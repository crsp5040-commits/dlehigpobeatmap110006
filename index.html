        .skiptranslate > iframe { height: 0 !important; border: 0 !important; }

        @keyframes scanLaser {
            0% { top: 6%; opacity: 0.8; }
            50% { top: 90%; opacity: 1; }
            100% { top: 6%; opacity: 0.8; }
        }
        .scan-laser-line {
            position: absolute;
            left: 5%;
            width: 90%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #fdc003, #af101a, #fdc003, transparent);
            box-shadow: 0 0 15px #fdc003, 0 0 8px #af101a;
            animation: scanLaser 2.2s infinite ease-in-out;
            z-index: 20;
        }

        .lens-corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: #fdc003;
            z-index: 25;
        }
        .lens-tl { top: 12px; left: 12px; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 8px; }
        .lens-tr { top: 12px; right: 12px; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 8px; }
        .lens-bl { bottom: 12px; left: 12px; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 8px; }
        .lens-br { bottom: 12px; right: 12px; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 8px; }

        @keyframes micPulse {

            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

            let timer = null;
            return function(...args) {
                if (timer) clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delayMs);
            };

        // Always default to English ('en') on initial load
        function getCurrentLanguage() {
            return (ACTIVE_APP_LANGUAGE && (ACTIVE_APP_LANGUAGE === 'en' || I18N_TRANSLATIONS[ACTIVE_APP_LANGUAGE]))
                ? ACTIVE_APP_LANGUAGE
                : 'en';
        }

        function updateLanguageBadges(lang) {
            const meta = SUPPORTED_LANGUAGES.find(l => l.code === lang) || SUPPORTED_LANGUAGES[0];
            const mobBadge = document.getElementById('mobLangBadge');
            const deskBadge = document.getElementById('deskLangBadge');
            if (mobBadge) mobBadge.textContent = meta.badge;
            if (deskBadge) deskBadge.textContent = meta.badge;
        }

        // Prevent Material Symbols icons from ever being translated into text
        function protectIconsFromTranslation(root = document) {
            if (!root || typeof root.querySelectorAll !== 'function') return;
            const icons = root.querySelectorAll('.material-symbols-outlined');
            for (let i = 0; i < icons.length; i++) {
                const icon = icons[i];
                if (!icon.classList.contains('notranslate')) icon.classList.add('notranslate');
                if (icon.getAttribute('translate') !== 'no') icon.setAttribute('translate', 'no');
            }
        }

        function clearGoogleTranslateCookies() {
            try {
                const host = window.location.hostname;
                const paths = ['/', window.location.pathname || '/'];
                paths.forEach(p => {
                    document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=${p}; SameSite=Lax`;
                    if (host) {
                        document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=${p}; domain=${host}; SameSite=Lax`;
                        document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=${p}; domain=.${host}; SameSite=Lax`;
                    }
                });
            } catch (e) {}
        }

        function setGoogleTranslateCookies(lang) {
            try {
                const host = window.location.hostname;
                const val = `/en/${lang}`;
                document.cookie = `googtrans=${val}; path=/; SameSite=Lax`;
                if (host) {
                    document.cookie = `googtrans=${val}; path=/; domain=${host}; SameSite=Lax`;
                    document.cookie = `googtrans=${val}; path=/; domain=.${host}; SameSite=Lax`;
                }
            } catch (e) {}
        }

        function isGoogleTranslateReady() {
            return Boolean(document.querySelector('#google_translate_element select.goog-te-combo'));
        }

        let googleTranslateRetryTimer = null;

        function triggerGoogleTranslateCombo(lang, retryCount = 0) {
            protectIconsFromTranslation(document);
            if (googleTranslateRetryTimer) {
                clearTimeout(googleTranslateRetryTimer);
                googleTranslateRetryTimer = null;
            }
            try {
                if (lang === 'en') {
                    clearGoogleTranslateCookies();
                    // 1. Trigger Google Translate's built-in restore button if its banner iframe exists
                    const bannerFrame = document.querySelector('iframe.goog-te-banner-frame, iframe.skiptranslate');
                    if (bannerFrame && bannerFrame.contentDocument) {
                        const restoreBtn = bannerFrame.contentDocument.querySelector('button[id=":1.restore"], .goog-te-button button');
                        if (restoreBtn) restoreBtn.click();
                    }
                    // 2. Reset the combo box cleanly back to English
                    const select = document.querySelector('#google_translate_element select.goog-te-combo');
                    if (select) {
                        select.value = '';
                        select.dispatchEvent(new Event('change', { bubbles: true }));
                        setTimeout(() => {
                            if (ACTIVE_APP_LANGUAGE === 'en') {
                                select.value = 'en';
                                select.dispatchEvent(new Event('change', { bubbles: true }));
                            }
                        }, 60);
                    }
                    document.documentElement.classList.remove('translated-ltr', 'translated-rtl');
                    return true;
                }

                setGoogleTranslateCookies(lang);
                const select = document.querySelector('#google_translate_element select.goog-te-combo');
                if (select) {
                    // Force a clean re-translation trigger even when switching between two non-English languages
                    if (select.value === lang) {
                        select.value = 'en';
                        select.dispatchEvent(new Event('change', { bubbles: true }));
                        setTimeout(() => {
                            if (ACTIVE_APP_LANGUAGE === lang) {
                                select.value = lang;
                                select.dispatchEvent(new Event('change', { bubbles: true }));
                            }
                        }, 80);
                    } else {
                        select.value = lang;
                        select.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                    return true;
                } else if (retryCount < 12) {
                    googleTranslateRetryTimer = setTimeout(() => {
                        if (ACTIVE_APP_LANGUAGE === lang) {
                            triggerGoogleTranslateCombo(lang, retryCount + 1);
                        }
                    }, 300);
                }
            } catch (e) {}
            return false;
        }

        function normalizeTranslateKey(text) {
            return (text || '').replace(/\s+/g, ' ').trim();
        }

                if (lang === 'ml') return `ബീറ്റ് #${num}`;

        function applyCurrentLanguage(root = document.body) {
            const lang = getCurrentLanguage();
            if (!root) return;
            document.documentElement.lang = lang;
            updateLanguageBadges(lang);
            protectIconsFromTranslation(root);

            // Fast path for Default English: Zero TreeWalker overhead!
            if (lang === 'en') {
                const origI18n = root.querySelectorAll('[data-i18n-orig]');
                origI18n.forEach(el => {
                    el.textContent = el.getAttribute('data-i18n-orig');
                });
                const origNodes = root.querySelectorAll('[data-orig-text-node]');
                origNodes.forEach(el => {
                    const origVal = el.getAttribute('data-orig-text-node');
                    if (origVal !== null && el.childNodes.length === 1 && el.firstChild.nodeType === Node.TEXT_NODE) {
                        el.firstChild.nodeValue = origVal;
                    }
                    el.removeAttribute('data-orig-text-node');
                });
                const origPlaceholders = root.querySelectorAll('[data-orig-placeholder]');
                origPlaceholders.forEach(el => {
                    el.setAttribute('placeholder', el.getAttribute('data-orig-placeholder'));
                    el.removeAttribute('data-orig-placeholder');
                });
                return;
            }

            // If Google Translate is active & ready, keep source DOM clean in English so Google Translate translates 100% accurately without double-translation bugs
            if (isGoogleTranslateReady()) {
                // Only translate input placeholders (Google Translate skips placeholder attributes)
                const inputs = root.querySelectorAll('input[placeholder], textarea[placeholder]');
                inputs.forEach(inp => {
                    if (!inp.hasAttribute('data-orig-placeholder')) {
                        inp.setAttribute('data-orig-placeholder', inp.getAttribute('placeholder'));
                    }
                    const ph = normalizeTranslateKey(inp.getAttribute('data-orig-placeholder'));
                    const transPh = lookupTranslation(ph, lang);
                    if (transPh) inp.setAttribute('placeholder', transPh);
                });
                return;
            }

            // Offline / Fallback Dictionary Mode (when Google Translate CDN is unavailable)
            const elements = root.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                if (!el.hasAttribute('data-i18n-orig')) {
                    el.setAttribute('data-i18n-orig', el.textContent.trim());
                }
                const key = el.getAttribute('data-i18n');
                const origText = el.getAttribute('data-i18n-orig');
                el.textContent = lookupTranslation(key, lang) || lookupTranslation(origText, lang) || origText || key;
            });

            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            let current;
            while ((current = walker.nextNode())) {
                if (current.parentElement && !current.parentElement.closest('script, style, pre, code, svg, .material-symbols-outlined, .notranslate, #google_translate_element')) {
                    textNodes.push(current);
                }
            }

            textNodes.forEach(node => {
                const parent = node.parentElement;
                if (!parent) return;
                const raw = node.nodeValue;
                if (!raw || !raw.trim()) return;

                if (!parent.hasAttribute('data-orig-text-node')) {
                    parent.setAttribute('data-orig-text-node', raw);
                }
                const origRaw = parent.getAttribute('data-orig-text-node');
                const cleanOrig = normalizeTranslateKey(origRaw);
                const translated = lookupTranslation(cleanOrig, lang);
                if (translated) {
                    const leadingSpace = origRaw.match(/^\s*/)[0];
                    const trailingSpace = origRaw.match(/\s*$/)[0];
                    node.nodeValue = `${leadingSpace}${translated}${trailingSpace}`;
                }
            });

            const inputs = root.querySelectorAll('input[placeholder], textarea[placeholder]');
            inputs.forEach(inp => {
                if (!inp.hasAttribute('data-orig-placeholder')) {
                    inp.setAttribute('data-orig-placeholder', inp.getAttribute('placeholder'));
                }
                const ph = normalizeTranslateKey(inp.getAttribute('data-orig-placeholder'));
                const transPh = lookupTranslation(ph, lang);
                if (transPh) inp.setAttribute('placeholder', transPh);
            });
        }

        function openExternalLink(url) {
            if (!url) return;
            try {
                const win = window.open(url, '_blank', 'noopener,noreferrer');
                if (!win || win.closed || typeof win.closed === 'undefined') {
                    const a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        if (document.body.contains(a)) {
                            document.body.removeChild(a);
                        }
                    }, 300);
                }
            } catch (err) {
                try {
                    window.location.href = url;
                } catch (e) {
                    console.warn("External link error:", e);
                }
            }
        }

                _portalBroadcastChannel = new BroadcastChannel('delhi_gpo_110006_live_sync');
            }
        } catch (e) {}

        function hasValidSupabaseKey() {
            const k = (SUPABASE_CONFIG.anonKey || '').trim();
            return k.length > 20 && (k.startsWith('eyJ') || k.startsWith('sb_publishable_'));
        }

        function getSupabaseClient() {
            if (_supabaseClientInstance) return _supabaseClientInstance;
            if (typeof window.supabase !== 'undefined' && SUPABASE_CONFIG.url && hasValidSupabaseKey()) {
                try {
                    _supabaseClientInstance = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);
                } catch (e) {}
            }
            return _supabaseClientInstance;
        }

        function isPhoneDataUnlocked(beatNumber) {
            if (isAdminLoggedIn) return true;
            if (beatNumber !== undefined && beatNumber !== null && APP_SETTINGS.individualPhoneLocks &&
                Object.prototype.hasOwnProperty.call(APP_SETTINGS.individualPhoneLocks, String(beatNumber))) {
                return Boolean(APP_SETTINGS.individualPhoneLocks[String(beatNumber)]);
            }
            return Boolean(APP_SETTINGS.showPhoneNumbers);
        }

        function saveAppSettings() {
            try {
                localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(APP_SETTINGS));
            } catch (e) {}
            if (_portalBroadcastChannel) {
                try { _portalBroadcastChannel.postMessage({ type: 'SETTINGS_UPDATED', settings: APP_SETTINGS }); } catch (e) {}
            }
            const client = getSupabaseClient();
            if (client) {
                client.from('app_settings').upsert({
                    key: 'global_config',
                    value: APP_SETTINGS,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'key' }).catch(() => {});
            }
        }

        async function syncSettingsFromSupabase() {
            const client = getSupabaseClient();
            if (!client) return;
            try {
                const { data, error } = await client
                    .from('app_settings')
                    .select('value')
                    .eq('key', 'global_config')
                    .single();
                if (!error && data && data.value) {
                    const prevLocked = APP_SETTINGS.appLocked;
                    APP_SETTINGS = { ...APP_SETTINGS, ...data.value };
                    localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(APP_SETTINGS));
                    if (prevLocked !== APP_SETTINGS.appLocked && !isAdminLoggedIn) {
                        navigateTo(currentTab, activeBeatDetails);
                    }
                }
            } catch (e) {}
        }

        async function checkSupabaseAdminSession() {
            const client = getSupabaseClient();
            if (!client || !client.auth) return;
            try {
                const { data } = await client.auth.getSession();
                if (data && data.session && data.session.user) {
                    isAdminLoggedIn = true;
                }
            } catch (e) {}
        }

        function broadcastBeatsChange() {
            if (_portalBroadcastChannel) {
                try { _portalBroadcastChannel.postMessage({ type: 'BEATS_UPDATED', beats: BEATS_DATABASE }); } catch (e) {}
            }
        }

        function broadcastNotesChange() {
            if (_portalBroadcastChannel) {
                try { _portalBroadcastChannel.postMessage({ type: 'NOTES_UPDATED', notes: BEAT_DELIVERY_NOTES }); } catch (e) {}
            }
        }

        function initRealtimeCloudListeners() {
            if (_realtimeInitialized) return;
            _realtimeInitialized = true;

            if (_portalBroadcastChannel) {
                _portalBroadcastChannel.onmessage = (evt) => {
                    const msg = evt && evt.data;
                    if (!msg) return;
                    if (msg.type === 'SETTINGS_UPDATED' && msg.settings) {
                        APP_SETTINGS = { ...APP_SETTINGS, ...msg.settings };
                        localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(APP_SETTINGS));
                        navigateTo(currentTab, activeBeatDetails);
                    } else if (msg.type === 'BEATS_UPDATED' && Array.isArray(msg.beats)) {
                        BEATS_DATABASE = msg.beats;
                        window._beatIndicesCached = false;
                        ensureBeatSearchIndices();
                        navigateTo(currentTab, activeBeatDetails);
                    } else if (msg.type === 'NOTES_UPDATED' && msg.notes) {
                        BEAT_DELIVERY_NOTES = msg.notes;
                    }
                };
            }

            const client = getSupabaseClient();
            if (client && typeof client.channel === 'function') {
                try {
                    client.channel('delhi_gpo_live_changes')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, () => syncSettingsFromSupabase())
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'beats' }, () => syncBeatsFromSupabase())
                        .subscribe();
                } catch (e) {}
            }
        }

        function toggleAppSetting(key) {
            if (!(key in APP_SETTINGS)) return;
            APP_SETTINGS[key] = !APP_SETTINGS[key];
            saveAppSettings();
            navigateTo('admin');

        function toggleGlobalAppLock() {
            APP_SETTINGS.appLocked = !APP_SETTINGS.appLocked;

            );

        function toggleIndividualBeatPhoneLock(beatNumber) {
            if (!APP_SETTINGS.individualPhoneLocks) APP_SETTINGS.individualPhoneLocks = {};
            const key = String(beatNumber);
            const currentlyUnlocked = isPhoneDataUnlocked(beatNumber);
            APP_SETTINGS.individualPhoneLocks[key] = !currentlyUnlocked;
            saveAppSettings();
            navigateTo('admin');
        }

        function setAllBeatsPhoneLock(unlockAll) {
            APP_SETTINGS.showPhoneNumbers = Boolean(unlockAll);
            APP_SETTINGS.individualPhoneLocks = {};
            BEATS_DATABASE.forEach(b => {
                APP_SETTINGS.individualPhoneLocks[String(b.beatNumber)] = Boolean(unlockAll);
            });
            saveAppSettings();
            showModalNotice(

                unlockAll

            navigateTo('admin');

        function resolveDoorStreetContext(doorRangeStr, beat) {
            if (!doorRangeStr || !beat || !Array.isArray(beat.areas)) return '';
            const firstToken = String(doorRangeStr).split(/[-–—/]/)[0].trim();
            for (const areaLine of beat.areas) {
                if (areaLine.includes(doorRangeStr) || (firstToken && areaLine.includes(firstToken))) {
                    return areaLine.split(':')[0].trim();
                }
            }
            return '';
        }

        function buildLocationUrls(label, beat, isDoorRange = false) {
            const b = beat || activeBeatDetails || BEATS_DATABASE[0];
            const cleanLabel = String(label || '').trim();
            const primaryArea = (b.areaName || '').split('/')[0].trim();
            let streetCtx = '';
            let displayTitle = cleanLabel;
            let queryStr = '';

            if (isDoorRange) {
                const startDoor = cleanLabel.split(/[-–—]/)[0].trim();
                streetCtx = resolveDoorStreetContext(cleanLabel, b);
                displayTitle = streetCtx ? `Door #${cleanLabel} • ${streetCtx}` : `Door #${cleanLabel} • ${primaryArea}`;
                queryStr = streetCtx
                    ? `No. ${startDoor}, ${streetCtx}, ${primaryArea}, Delhi 110006`
                    : `No. ${startDoor}, ${primaryArea}, Delhi 110006`;
            } else {
                const streetOnly = cleanLabel.split(':')[0].trim();
                streetCtx = streetOnly;
                displayTitle = streetOnly;
                queryStr = `${streetOnly}, ${primaryArea}, Delhi 110006`;
            }

            const originParam = encodeURIComponent("Delhi GPO, Lothian Road, Kashmere Gate, Delhi 110006");
            const destParam = encodeURIComponent(queryStr);
            return {
                queryStr,
                streetCtx,
                displayTitle,
                mapsSearchUrl: `https://www.google.com/maps/search/?api=1&query=${destParam}`,
                mapsWalkUrl: `https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${destParam}&travelmode=walking`
            };
        }

            if (isDoorRange && !APP_SETTINGS.directGpsDoors && !isAdminLoggedIn) {
                showModalNotice("GPS Navigation Protected", "Direct door-number GPS navigation is currently restricted by the administrator.");

            const cleanLabel = String(label || '').trim();
            if (!cleanLabel) return;

            if (currentTab === 'postalLookup') {
                updateLookupSelectedLocationBar(locInfo, b);
                focusLocationOnLookupMap(locInfo, b);
            }
            openLocationActionModal(locInfo, b);

        function resolveOutsidePostalLocation(rawQuery) {
            if (!rawQuery) return null;
            const q = rawQuery.trim().toLowerCase();
            const qClean = q.replace(/[^a-z0-9]/g, '');

            // 1. Direct match in pre-indexed national postal directory
            for (const item of NATIONAL_POSTAL_DIRECTORY) {
                if (item.aliases.some(alias => {
                    const aliasClean = alias.replace(/[^a-z0-9]/g, '');
                    return q.includes(alias) || alias.includes(q) || (qClean.length >= 4 && (qClean.includes(aliasClean) || aliasClean.includes(qClean)));
                })) {
                    return item;
                }
            }

            // 2. 6-digit PIN code algorithmic resolver
            const pinMatch = q.match(/\b\d{6}\b/);
            if (pinMatch) {
                const pin = pinMatch[0];
                if (pin === '110006') return null; // Belongs to this GPO
                const p2 = parseInt(pin.slice(0, 2), 10);
                let stateCircle = "National Postal Network";
                let region = "Regional Delivery Division";

                if (p2 >= 51 && p2 <= 53) { stateCircle = "Andhra Pradesh"; region = "Andhra Circle"; }
                else if (p2 === 50) { stateCircle = "Telangana"; region = "Telangana Circle"; }
                else if (p2 >= 56 && p2 <= 59) { stateCircle = "Karnataka"; region = "Karnataka Circle"; }
                else if (p2 >= 60 && p2 <= 64) { stateCircle = "Tamil Nadu"; region = "Tamil Nadu Circle"; }
                else if (p2 >= 67 && p2 <= 69) { stateCircle = "Kerala"; region = "Kerala Circle"; }
                else if (p2 >= 40 && p2 <= 44) { stateCircle = "Maharashtra"; region = "Maharashtra Circle"; }
                else if (p2 === 11) { stateCircle = "Delhi Circle"; region = "Delhi Division"; }
                else if (p2 >= 12 && p2 <= 13) { stateCircle = "Haryana"; region = "Haryana Circle"; }
                else if (p2 >= 20 && p2 <= 28) { stateCircle = "Uttar Pradesh"; region = "UP Circle"; }
                else if (p2 >= 30 && p2 <= 34) { stateCircle = "Rajasthan"; region = "Rajasthan Circle"; }
                else if (p2 >= 36 && p2 <= 39) { stateCircle = "Gujarat"; region = "Gujarat Circle"; }
                else if (p2 >= 70 && p2 <= 74) { stateCircle = "West Bengal"; region = "West Bengal Circle"; }
                else if (p2 >= 80 && p2 <= 85) { stateCircle = "Bihar"; region = "Bihar Circle"; }

                return {
                    areaTitle: `PIN ${pin} Delivery Zone`,
                    pincode: pin,
                    deliveryOffice: `Designated Head Post Office (${pin.slice(0, 3)} HO)`,
                    postalDivision: `${stateCircle} Postal Division`,
                    district: `${region} Jurisdiction`,
                    stateCircle: stateCircle
                };
            }

            // 3. Dynamic generic fallback for any recognized outside city/town name
            const cleanTitle = rawQuery.trim().replace(/\b\w/g, l => l.toUpperCase());
            return {
                areaTitle: cleanTitle,
                pincode: "Search via Postal Registry",
                deliveryOffice: `${cleanTitle} Head Post Office (HPO)`,
                postalDivision: `${cleanTitle} Postal Division`,
                district: cleanTitle,
                stateCircle: "India Post National Network"
            };
        }

        /* Live Microphone Voice Search Handler */
        function toggleVoiceSearch(inputId) {
            const inputEl = document.getElementById(inputId);
            const micBtn = document.getElementById(`micBtn_${inputId}`);
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showModalNotice("Voice Search", "Voice input is not supported by your current browser. Please type your query in the search bar.");
                return;
            }
            try {
                const recognition = new SpeechRecognition();
                recognition.lang = 'en-IN';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                if (micBtn) micBtn.classList.add('mic-recording');

                recognition.onstart = () => {
                    if (inputEl) inputEl.placeholder = "🎙️ Listening... Please speak city, area, door no...";
                };

                recognition.onresult = (event) => {
                    const spokenText = event.results[0][0].transcript;
                    if (inputEl) {
                        inputEl.value = spokenText;
                        performSearch(inputId);
                    }
                };

                recognition.onerror = () => {
                    if (micBtn) micBtn.classList.remove('mic-recording');
                    if (inputEl) inputEl.placeholder = "🔍 Type or speak Door No, Street, City, PIN, Beat...";
                };

                recognition.onend = () => {
                    if (micBtn) micBtn.classList.remove('mic-recording');
                    if (inputEl) inputEl.placeholder = "🔍 Type or speak Door No, Street, City, PIN, Beat...";
                };

                recognition.start();
            } catch(err) {
                if (micBtn) micBtn.classList.remove('mic-recording');
            }
        }

        function getBeatDistanceMetrics(beat) {
            const b = beat || BEATS_DATABASE[0];
            const gpoLat = 28.6655, gpoLng = 77.2335;
            const official = OFFICIAL_BEAT_DISTANCES[b.beatNumber];

            // 1. Walkable Google Maps pedestrian distance from Delhi G.P.O. to Beat Area (km)
            let gpoRoadKm;
            if (official && typeof official.gpoRoadKm === 'number') {
                gpoRoadKm = official.gpoRoadKm;
            } else {
                const airKm = parseFloat(b.distance) || Math.sqrt(Math.pow((b.lat - gpoLat) * 111, 2) + Math.pow((b.lng - gpoLng) * 111 * Math.cos(gpoLat * Math.PI / 180), 2));
                gpoRoadKm = Math.max(0.35, airKm * 1.28);
            }

            // 2. Horizontal Beat Walk (Congested Old Delhi-6 Galis, Katras, Wholesale Markets & Traffic Weaving)
            let galisWalkKm;
            if (official && typeof official.galisWalkKm === 'number') {
                galisWalkKm = official.galisWalkKm;
            } else {
                const sectorCount = Array.isArray(b.areas) ? b.areas.length : 15;
                galisWalkKm = Math.min(11.5, Math.max(7.6, 7.2 + sectorCount * 0.16));
            }

            // 3. Realistic Mixed-Floor Stair Climbing Equivalent (Calibrated per beat's actual building height mix)
            let floorsClimbKm;
            if (official && typeof official.floorsClimbKm === 'number') {
                floorsClimbKm = official.floorsClimbKm;
            } else {
                const sectorCount = Array.isArray(b.areas) ? b.areas.length : 15;
                floorsClimbKm = Math.min(3.9, Math.max(2.5, 2.4 + sectorCount * 0.05));
            }

            const floorProfile = (official && official.floorProfile) ? official.floorProfile : "2–4 Flrs (Mixed)";

            // 4. Total Inside-Beat Walkable Coverage (Strictly >= 10.00 km for every Beat Area)
            const beatTourKm = Math.max(10.0, galisWalkKm + floorsClimbKm);

            // 5. Total Daily Postman Footwork = (GPO -> Beat Area Walk) + (Beat Walk + Mixed-Floor Stairs) + (Beat Area -> GPO Walk)
            const totalDailyKm = (gpoRoadKm * 2) + beatTourKm;

            // 6. Every Footstep Counted (~1,315 steps/km flat congested walk + ~1,450 steps/km stair climbing up & down)
            const gpoRoundTripSteps = Math.round((gpoRoadKm * 2) * 1315);
            const galisWalkSteps = Math.round(galisWalkKm * 1315);
            const stairsUpDownSteps = Math.round(floorsClimbKm * 1450);
            const beatInsideSteps = galisWalkSteps + stairsUpDownSteps;
            const dailySteps = gpoRoundTripSteps + beatInsideSteps;
            const dailyStepsFormatted = dailySteps.toLocaleString('en-IN');

            // 7. Official PDF Reference Metadata (Old Beat No., Reference Locality, GPS Coordinates, Straight-line km)
            const straightLineKm = (b.distance !== undefined && b.distance !== null && String(b.distance).trim() !== '')
                ? parseFloat(b.distance).toFixed(2)
                : Math.sqrt(Math.pow((b.lat - gpoLat) * 111, 2) + Math.pow((b.lng - gpoLng) * 111 * Math.cos(gpoLat * Math.PI / 180), 2)).toFixed(2);
            const refLocality = (b._refLocality && b._refLocality.split(' ')[0])
                ? (b.areaName.split('/')[0].trim())
                : b.areaName;
            const coordsStr = `${Number(b.lat || 28.65).toFixed(5)}, ${Number(b.lng || 77.23).toFixed(5)}`;
            const oldBeatDisplay = b.oldBeatNo || b.beatNumber;

            // 8. Direct Google Maps Walking Directions URL (Origin: Delhi GPO Kashmere Gate -> Beat Location)
            const destLabel = (official && official.mapQuery) ? official.mapQuery : `${b.areaName}, Delhi 110006`;
            const originParam = encodeURIComponent("Delhi GPO, Lothian Road, Kashmere Gate, Delhi 110006");
            const destParam = (b.lat && b.lng) ? `${b.lat},${b.lng}` : encodeURIComponent(destLabel);

            // Build Google Maps multi-stop walking loop using top 2 real localities inside the beat
            const sampleWaypoints = Array.isArray(b.areas)
                ? b.areas.slice(0, 2).map(a => a.split(':')[0].split(',')[0].trim() + ", Delhi 110006").filter(Boolean)
                : [];
            const waypointsParam = sampleWaypoints.length > 0 ? `&waypoints=${encodeURIComponent(sampleWaypoints.join('|'))}` : '';

            const googleMapsRouteUrl = `https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${destParam}&travelmode=walking`;
            const googleMapsLoopUrl = `https://www.google.com/maps/dir/?api=1&origin=${originParam}&destination=${originParam}${waypointsParam || `&waypoints=${destParam}`}&travelmode=walking`;
            const googleMapsAreaUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(destLabel)}`;

            return {
                gpoRoadKm: gpoRoadKm.toFixed(2),
                galisWalkKm: galisWalkKm.toFixed(2),
                floorsClimbKm: floorsClimbKm.toFixed(2),
                floorProfile: floorProfile,
                beatTourKm: beatTourKm.toFixed(2),
                totalDailyKm: totalDailyKm.toFixed(2),
                gpoRoundTripKm: (gpoRoadKm * 2).toFixed(2),
                gpoRoundTripStepsFormatted: gpoRoundTripSteps.toLocaleString('en-IN'),
                beatInsideStepsFormatted: beatInsideSteps.toLocaleString('en-IN'),
                stairsUpDownStepsFormatted: stairsUpDownSteps.toLocaleString('en-IN'),
                dailySteps: dailySteps,
                dailyStepsFormatted: dailyStepsFormatted,
                straightLineKm,
                refLocality,
                coordsStr,
                oldBeatDisplay,
                googleMapsRouteUrl,
                googleMapsLoopUrl,
                googleMapsAreaUrl
            };
        }

        // Save Beats Permanently to Local Storage and background sync to Supabase
        async function saveBeatsPermanently(notifyUser = false) {
            try {
                BEATS_DATABASE.sort((a, b) => a.beatNumber - b.beatNumber);
                localStorage.setItem(STORAGE_KEYS.BEATS, JSON.stringify(BEATS_DATABASE));
                window._beatIndicesCached = false;
                ensureBeatSearchIndices();
            } catch (e) {
                console.error("Local storage save error:", e);
            }

            // 1. Instant Real-Time Peer-to-Peer Broadcast to ALL devices & APKs (<30ms)
            broadcastBeatsChange();

            // 2. Background Supabase Push
            const client = getSupabaseClient();
            if (client) {
                try {
                    const payload = BEATS_DATABASE.map(b => ({
                        beat_number: b.beatNumber,
                        hub: b.hub,
                        area_name: b.areaName,
                        postman_name: b.postmanName,
                        mobile_number: b.mobileNumber,
                        type: b.type,
                        door_ranges: b.doorRanges,
                        areas: b.areas,
                        lat: b.lat,
                        lng: b.lng,
                        updated_at: new Date().toISOString()
                    }));
                    const { error } = await client.from('beats').upsert(payload, { onConflict: 'beat_number' });
                    if (!error && notifyUser) {
                        showModalNotice("Saved & Synced", "All 50 beats saved permanently and broadcast live across all user devices!");
                        return;
                    }
                } catch (err) {
                    console.info("Supabase sync will retry next time:", err.message);
                }
            }

            if (notifyUser) {
                showModalNotice("Saved Permanently", "Data saved permanently and broadcast live across all connected devices.");
            }
        }

        // Fetch Remote Beats from Supabase on startup if online with safe merging to never wipe fields
        async function syncBeatsFromSupabase() {
            if (isSyncingBeats) return;
            const client = getSupabaseClient();
            if (!client) return;
            try {
                isSyncingBeats = true;
                const { data, error } = await client
                    .from('beats')
                    .select('*')
                    .order('beat_number', { ascending: true });
                if (data && data.length > 0 && !error) {
                    BEATS_DATABASE = data.map(item => {
                        const bNum = item.beat_number || item.beatNumber;
                        const local = BEATS_DATABASE.find(b => b.beatNumber === bNum) || {};
                        return {
                            ...local,
                            beatNumber: bNum,
                            hub: item.hub || local.hub,
                            areaName: item.area_name || item.areaName || local.areaName,
                            postmanName: item.postman_name || item.postmanName || local.postmanName,
                            mobileNumber: item.mobile_number || item.mobileNumber || local.mobileNumber,
                            type: item.type || local.type || "Postman",
                            distance: item.distance || local.distance || "1.50",
                            doorRanges: (item.door_ranges || item.doorRanges) || local.doorRanges || "",
                            areas: (Array.isArray(item.areas) && item.areas.length > 0) 
                                ? item.areas 
                                : ((typeof item.areas === 'string' && item.areas.trim()) 
                                    ? item.areas.split(',') 
                                    : (local.areas || [])),
                            lat: item.lat || local.lat || 28.65,
                            lng: item.lng || local.lng || 77.23
                        };
                    });
                    // Strictly sort 1 to 50 in memory and storage
                    BEATS_DATABASE.sort((a, b) => a.beatNumber - b.beatNumber);
                    localStorage.setItem(STORAGE_KEYS.BEATS, JSON.stringify(BEATS_DATABASE));
                    window._beatIndicesCached = false;
                    ensureBeatSearchIndices();
                    console.log(`Synced ${data.length} beats safely from Supabase Cloud.`);
                }
            } catch (err) {
                console.info("Supabase sync status: using persistent local copy.");
            } finally {
                isSyncingBeats = false;
            }
        }

        // Generate Standalone Single-File HTML with all current data permanently baked into the file
        function exportBakeDataIntoHTML() {
            try {
                let htmlSource = document.documentElement.outerHTML;
                // Embed the latest BEATS_DATABASE array directly into the script
                const serializedBeats = JSON.stringify(BEATS_DATABASE, null, 4);
                const replacement = `let BEATS_DATABASE = ${serializedBeats};`;
                htmlSource = htmlSource.replace(/let\s+BEATS_DATABASE\s*=\s*\[[\s\S]*?\];/m, replacement);

                const blob = new Blob([htmlSource], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Delhi_GPO_110006_Portal_Permanent_${new Date().toISOString().slice(0, 10)}.html`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showModalNotice("Standalone HTML Exported", "Complete HTML file with all your permanent changes directly written into code has been downloaded!");
            } catch (e) {
                showModalNotice("Export Failed", e.message);
            }
        }

        // Import JSON Backup
        function triggerImportJSON() {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.json,application/json';
            fileInput.onchange = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed && Array.isArray(parsed.beats)) {
                            BEATS_DATABASE = parsed.beats;
                            if (parsed.settings) APP_SETTINGS = { ...APP_SETTINGS, ...parsed.settings };
                            if (parsed.deliveryNotes) BEAT_DELIVERY_NOTES = { ...BEAT_DELIVERY_NOTES, ...parsed.deliveryNotes };

        function get10mRecentSearches() {
            try {
                const raw = localStorage.getItem(SEARCH_HISTORY_KEY);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                const now = Date.now();
                return parsed.filter(item => (now - item.timestamp) < 600000).map(item => item.query);
            } catch (e) { return []; }
        }

        function saveSearchTo10mStorage(query) {
            if (!query) return;
            const clean = query.trim();
            if (!clean) return;
            try {
                const raw = localStorage.getItem(SEARCH_HISTORY_KEY);
                let list = raw ? JSON.parse(raw) : [];
                const now = Date.now();
                list = list.filter(item => item.query.toLowerCase() !== clean.toLowerCase() && (now - item.timestamp) < 600000);
                list.unshift({ query: clean, timestamp: now });
                localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(list.slice(0, 6)));
            } catch (e) {}

            // Asynchronously log search activity to Supabase table in background without blocking UI
            const client = getSupabaseClient();
            if (client) {
                setTimeout(() => {
                    try {
                        client
                            .from('search_logs')
                            .insert([{ query: clean, created_at: new Date().toISOString() }])
                            .catch(() => {});
                    } catch(err) {}
                }, 10);
            }
        }

            const client = getSupabaseClient();
            if (!client) {

                return;
            }
            try {
                showModalNotice("Uploading Data", "Backing up beats database to Supabase cloud table...");
                BEATS_DATABASE.sort((a, b) => a.beatNumber - b.beatNumber);
                const payload = BEATS_DATABASE.map(b => ({
                    beat_number: b.beatNumber,
                    hub: b.hub,
                    area_name: b.areaName,
                    postman_name: b.postmanName,
                    mobile_number: b.mobileNumber,
                    type: b.type,
                    door_ranges: b.doorRanges,
                    areas: b.areas,
                    lat: b.lat,
                    lng: b.lng
                }));

                const { error } = await client.from('beats').upsert(payload, { onConflict: 'beat_number' });
                if (error) {
                    showModalNotice("Supabase Notification", `Connected to project <strong>${SUPABASE_CONFIG.projectName}</strong>.<br><br><span class="text-xs text-amber-700">Notice: Ensure the 'beats' table is created in your Supabase SQL editor with 'beat_number' as primary key.</span><br><br><span class="text-[10px] text-on-surface-variant font-mono">${error.message}</span>`);

        /* ==========================================================================
           DELHI G.P.O. (110006) TRUE GEOGRAPHIC SKETCH MAP (ALL 50 BEATS + NDC)
           Hand-drawn cartographic sketch style with real Old Delhi roads, Yamuna River,
           Railway Line, Red Fort, Jama Masjid, Heritage Delhi GPO-6 Hub, Concentric
           Radius Rings, Anti-Overlap 50 Beat Pins (#01-#50) & NDC 4-PIN Dispatch Arrows.
           ========================================================================== */
        function renderGpoRoughOverviewMapSection() {
            const totalStaff = BEATS_DATABASE.length;
            const postmenCount = BEATS_DATABASE.filter(b => (b.type || 'Postman').toLowerCase() !== 'postwoman').length;
            const postwomenCount = totalStaff - postmenCount;
            const totalCombinedDailyKm = Math.round(
                BEATS_DATABASE.reduce((sum, b) => sum + (parseFloat(getBeatDistanceMetrics(b).totalDailyKm) || 0), 0)
            ).toLocaleString('en-IN');

            // Geographic Projection into Map Sketch Canvas (Map Area: x = 44..995, y = 135..735)
            // Piecewise longitude scale gives spacious room for all 49 Old Delhi beats + Beat #45 Sarai Rohilla on Far West
            function projectSketchLng(lng) {
                if (lng < 77.198) {
                    return 92 + ((lng - 77.184) / 0.014) * 70;
                }
                const clamped = Math.max(77.198, Math.min(77.2385, lng));
                return 178 + ((clamped - 77.198) / (77.2385 - 77.198)) * 775;
            }
            function projectSketchLat(lat) {
                const clamped = Math.max(28.6410, Math.min(28.6685, lat));
                return 162 + ((28.6685 - clamped) / (28.6685 - 28.6410)) * 545;
            }

            // Delhi G.P.O. Head Office Real Anchor on Sketch Map
            const gpoX = Math.round(projectSketchLng(77.2345));
            const gpoY = Math.round(projectSketchLat(28.6626));

            // Hub color mapping (matching official 5 PRI(P) Hubs)
            const sketchHubColors = {
                "SITARAM BAZAR / DAREEBA": { fill: "#dc2626", stroke: "#7f1d1d", soft: "#fee2e2" },
                "HAUZ QAZI / KHARI BAOLI": { fill: "#d97706", stroke: "#78350f", soft: "#fef3c7" },
                "CHANDNI CHOWK / NAI SARAK": { fill: "#7c3aed", stroke: "#4c1d95", soft: "#ede9fe" },
                "SADAR BAZAR / TELIWARA": { fill: "#0284c7", stroke: "#0c4a6e", soft: "#e0f2fe" },
                "KASHMERI GATE": { fill: "#059669", stroke: "#064e3b", soft: "#d1fae5" }
            };

            // Project all 50 beats to their real geographic locations
            const nodes = BEATS_DATABASE.map(b => {
                const baseX = projectSketchLng(b.lng || 77.225);
                const baseY = projectSketchLat(b.lat || 28.655);
                return {
                    beat: b,
                    origX: baseX,
                    origY: baseY,
                    x: baseX,
                    y: baseY,
                    color: (sketchHubColors[b.hub] || sketchHubColors["SITARAM BAZAR / DAREEBA"])
                };
            });

            // Deterministic gentle repulsion so NO two beat pins (#01-#50) ever overlap while staying true to geography
            const minPinDist = 31;
            for (let iter = 0; iter < 55; iter++) {
                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        let dx = nodes[j].x - nodes[i].x;
                        let dy = nodes[j].y - nodes[i].y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 0.01) {
                            const angle = ((i * 7 + j * 13) % 12) * (Math.PI / 6);
                            dx = Math.cos(angle);
                            dy = Math.sin(angle);
                            dist = 1;
                        }
                        if (dist < minPinDist) {
                            const push = (minPinDist - dist) * 0.52;
                            const ux = dx / dist;
                            const uy = dy / dist;
                            nodes[i].x -= ux * push;
                            nodes[i].y -= uy * push;
                            nodes[j].x += ux * push;
                            nodes[j].y += uy * push;
                        }
                    }
                    // Keep pins cleanly clear of the Delhi G.P.O. central building badge
                    const gdx = nodes[i].x - gpoX;
                    const gdy = nodes[i].y - gpoY;
                    const gDist = Math.sqrt(gdx * gdx + gdy * gdy);
                    if (gDist < 62 && nodes[i].beat.beatNumber !== 49) {
                        const pushG = (62 - gDist) * 0.6;
                        const ux = (gdx || -1) / (gDist || 1);
                        const uy = (gdy || 1) / (gDist || 1);
                        nodes[i].x += ux * pushG;
                        nodes[i].y += uy * pushG;
                    }

        function createPdfFromCanvas(canvas, orientation = 'portrait') {
            const JsPdfCtor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
            if (!JsPdfCtor) return null;

            const isLandscape = orientation === 'landscape';
            const doc = new JsPdfCtor({
                orientation: isLandscape ? 'landscape' : 'portrait',
                unit: 'mm',
                format: 'a4',
                compress: true
            });

            const pageW = isLandscape ? 297 : 210;
            const pageH = isLandscape ? 210 : 297;
            const imgData = canvas.toDataURL('image/png', 0.96);

            if (isLandscape) {
                // Symmetrical centered fit on A4 Landscape
                const margin = 5;
                const availW = pageW - margin * 2;
                const availH = pageH - margin * 2;
                const ratio = Math.min(availW / canvas.width, availH / canvas.height);
                const drawW = canvas.width * ratio;
                const drawH = canvas.height * ratio;
                const drawX = (pageW - drawW) / 2;
                const drawY = (pageH - drawH) / 2;
                doc.addImage(imgData, 'PNG', drawX, drawY, drawW, drawH, undefined, 'FAST');
            } else {
                // Symmetrical A4 Portrait fit with equal Left/Right & Top/Bottom margins
                const padX = 4;
                const padY = 4;
                const availW = pageW - padX * 2;
                const availH = pageH - padY * 2;
                const ratio = Math.min(availW / canvas.width, availH / canvas.height);
                const drawW = canvas.width * ratio;
                const drawH = canvas.height * ratio;
                const drawX = (pageW - drawW) / 2;
                const drawY = (pageH - drawH) / 2;
                doc.addImage(imgData, 'PNG', drawX, drawY, drawW, drawH, undefined, 'FAST');
            }

            return doc.output('blob');
        }

        function isCanvasMostlyBlank(canvas) {
            try {
                if (!canvas || canvas.width < 50 || canvas.height < 50) return true;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                if (!ctx) return false;
                const sampleW = Math.min(200, canvas.width);
                const sampleH = Math.min(280, canvas.height);
                const data = ctx.getImageData(0, 0, sampleW, sampleH).data;
                let nonWhite = 0;
                for (let i = 0; i < data.length; i += 16) {
                    if (data[i + 3] > 20 && (data[i] < 248 || data[i + 1] < 248 || data[i + 2] < 248)) {
                        nonWhite++;
                        if (nonWhite > 25) return false;
                    }
                }
                return true;
            } catch (e) {
                return false;
            }
        }

        let _activePdfDownloadState = null;

        function clearActivePdfDownloadState() {
            if (_activePdfDownloadState && _activePdfDownloadState.blobUrl) {
                try { URL.revokeObjectURL(_activePdfDownloadState.blobUrl); } catch (e) {}
            }
            _activePdfDownloadState = null;
        }

        function triggerDirectPdfDownload(pdfBlob, filename) {
            const blobUrl = URL.createObjectURL(pdfBlob);
            try {
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                a.rel = 'noopener noreferrer';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    if (document.body.contains(a)) document.body.removeChild(a);
                }, 500);
            } catch (e) {}
            return blobUrl;
        }

        async function shareActivePdfOnDevice() {
            if (!_activePdfDownloadState || !_activePdfDownloadState.blob) return;
            try {
                const { blob, filename, title } = _activePdfDownloadState;
                const file = new File([blob], filename, { type: 'application/pdf' });
                if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
                    await navigator.share({
                        files: [file],
                        title: title || filename,
                        text: `Delhi G.P.O. 110006 • ${title || filename}`
                    });
                }
            } catch (e) {}
        }

        function cleanCompactStr(str) {
            return String(str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function phoneticSimplifyStr(str) {
            return cleanCompactStr(str)
                .replace(/aa+/g, 'a')
                .replace(/ee+/g, 'i')
                .replace(/oo+/g, 'u')
                .replace(/ph/g, 'f')
                .replace(/kh/g, 'k')
                .replace(/gh/g, 'g')
                .replace(/bh/g, 'b')
                .replace(/dh/g, 'd')
                .replace(/th/g, 't')
                .replace(/sh/g, 's')
                .replace(/ch/g, 'c')
                .replace(/q/g, 'k')
                .replace(/w/g, 'v')
                .replace(/z/g, 'j')
                .replace(/y/g, 'i')
                .replace(/(.)\1+/g, '$1');
        }

        function fastLevenshtein(a, b, maxDist = 2) {
            if (!a || !b) return maxDist + 1;
            const al = a.length;
            const bl = b.length;
            if (Math.abs(al - bl) > maxDist) return maxDist + 1;

            let prev = new Array(bl + 1);
            for (let j = 0; j <= bl; j++) prev[j] = j;

            for (let i = 1; i <= al; i++) {
                const curr = new Array(bl + 1);
                curr[0] = i;
                let minVal = curr[0];
                const ca = a.charCodeAt(i - 1);
                for (let j = 1; j <= bl; j++) {
                    const cost = ca === b.charCodeAt(j - 1) ? 0 : 1;
                    curr[j] = Math.min(
                        prev[j] + 1,
                        curr[j - 1] + 1,
                        prev[j - 1] + cost
                    );
                    if (curr[j] < minVal) minVal = curr[j];
                }
                if (minVal > maxDist) return maxDist + 1;
                prev = curr;
            }
            return prev[bl];
        }

        // Ultra-fast word match (Guards against false positives on small words)
        function isFastFuzzyWordMatch(qClean, qPhonetic, target) {
            if (!qClean || !target) return false;
            const tClean = target.toLowerCase();
            if (tClean.includes(qClean)) return true;
            if (qClean.length >= 4 && tClean.length >= 4 && qClean.includes(tClean)) return true;

            const tPhonetic = phoneticSimplifyStr(tClean);
            if (tPhonetic && qPhonetic) {
                if (tPhonetic.includes(qPhonetic)) return true;
                if (qPhonetic.length >= 5 && tPhonetic.length >= 5 && qPhonetic.includes(tPhonetic)) return true;
            }

            if (qClean.length >= 5 && tClean.length >= 5) {
                const maxDist = qClean.length >= 7 ? 2 : 1;
                if (fastLevenshtein(qClean, tClean, maxDist) <= maxDist) return true;
            }
            return false;
        }

        function checkDoorNumberInRange(numStr, rangeStr) {
            if (!numStr || !rangeStr) return false;
            const searchNum = parseInt(numStr.replace(/\D/g, ''), 10);
            if (isNaN(searchNum)) return false;

            const tokens = rangeStr.split(/[,\s]+/).map(t => t.trim()).filter(Boolean);
            for (const t of tokens) {
                const parts = t.split(/[-–—]|to/i).map(p => p.trim());
                if (parts.length === 2) {
                    const start = parseInt(parts[0].replace(/\D/g, ''), 10);
                    const end = parseInt(parts[1].replace(/\D/g, ''), 10);
                    if (!isNaN(start) && !isNaN(end)) {
                        const min = Math.min(start, end);
                        const max = Math.max(start, end);
                        if (searchNum >= min && searchNum <= max) {
                            return t;
                        }
                    }
                } else if (parts.length === 1) {
                    const exact = parseInt(parts[0].replace(/\D/g, ''), 10);
                    if (!isNaN(exact) && exact === searchNum) {
                        return t;
                    }
                }
            }
            return false;
        }
