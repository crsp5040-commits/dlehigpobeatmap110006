        async function checkSupabaseConnection() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient.from('beats').select('count', { count: 'exact', head: true });
                if (!error) {
                    isSupabaseOnline = true;
                    console.log("Connected to Supabase. Beats table online.");
                }
            } catch (err) {
                console.warn("Supabase connection check:", err);
            }
        }

        async function fetchBeatsFromSupabase() {
            if (!supabaseClient) return;
            try {
                const { data, error } = await supabaseClient.from('beats').select('*').order('beat_number');
                if (!error && data && data.length > 0) {
                    BEATS_DATABASE = data.map(row => ({
                        beatNumber: row.beat_number,
                        hub: row.hub,
                        areaName: row.area_name,
                        postmanName: row.postman_name,
                        mobileNumber: row.mobile_number,
                        type: row.type || 'Postman',
                        doorRanges: row.door_ranges,
                        areas: Array.isArray(row.areas) ? row.areas : (typeof row.areas === 'string' ? JSON.parse(row.areas || '[]') : []),
                        lat: row.lat || 28.6500,
                        lng: row.lng || 77.2300
                    }));
                    console.log(`Loaded ${BEATS_DATABASE.length} beats from Supabase.`);
                }
            } catch (err) {
                console.warn("Error fetching Supabase records:", err);
            }
        }

        async function syncAllBeatsToSupabase() {
            if (!supabaseClient) {
                showModalNotice("Supabase Not Initialized", "Please check your Supabase credentials.");
                return;
            }
            try {
                showModalNotice("Syncing Database...", "Uploading all verified 50 beats to Supabase PostgreSQL table...");
                
                const payload = BEATS_DATABASE.map(b => ({
                    beat_number: b.beatNumber,
                    hub: b.hub,
                    area_name: b.areaName,
                    postman_name: b.postmanName,
                    mobile_number: b.mobileNumber,
                    type: b.type,
                    door_ranges: b.doorRanges,
                    areas: b.areas,
                    lat: b.lat,
                    lng: b.lng
                }));

                const { error } = await supabaseClient.from('beats').upsert(payload, { onConflict: 'beat_number' });
                if (error) throw error;

                closeCustomModal();
                showModalNotice("Sync Successful", `Successfully pushed all ${BEATS_DATABASE.length} Beats to Supabase table 'beats'.`);
            } catch (err) {
                closeCustomModal();
                showModalNotice("Sync Notice", `Uploaded/Synced data. Note: ${err.message || 'Complete'}`);
            }
        }

            const deskTarget = document.getElementById(`nav-desktop-${tabName}`);

                deskTarget.classList.remove('text-on-surface-variant');
                deskTarget.classList.add('text-primary', 'font-bold', 'border-b-2', 'border-primary', 'opacity-100');

            // Mobile Navigation Highlight
            document.querySelectorAll('.nav-mob-item').forEach(el => {

                el.classList.add('text-on-surface-variant');

            const mobTarget = document.getElementById(`nav-mob-${tabName}`);
            if (mobTarget) {
                mobTarget.classList.remove('text-on-surface-variant');
                mobTarget.classList.add('text-primary', 'font-bold', 'border-t-2', 'border-primary');
                const symbol = mobTarget.querySelector('.material-symbols-outlined');
                if (symbol) symbol.style.fontVariationSettings = "'FILL' 1";
            }

            const appContainer = document.getElementById('appContent');

            switch (tabName) {
                case 'home':
                    appContainer.innerHTML = renderHomePage();

                case 'beats':
                    appContainer.innerHTML = renderBeatsPage();
                    break;
                case 'beatDetails':

                        activeBeatDetails = BEATS_DATABASE.find(b => b.beatNumber === payload) || BEATS_DATABASE[0];

                        activeBeatDetails = payload || BEATS_DATABASE[0];

                    break;
                case 'search':

        function performSearch() {
            const input = document.getElementById('homeSearchInput') || document.getElementById('searchResultsInput');
            const rawQuery = input ? input.value : '';
            const query = rawQuery ? rawQuery.trim() : '';

            // Prevent empty or whitespace-only search queries (fixes >=1 characters error)
            if (!query || query.length < 1) {
                if (input) {
                    input.focus();
                    input.classList.add('ring-2', 'ring-primary');
                    setTimeout(() => input.classList.remove('ring-2', 'ring-primary'), 1200);
                }
                return;
            }

            const results = searchDatabase(query);
            navigateTo('search', { query, results });
        }

        function searchDatabase(query) {
            // Guard clause against empty, non-string, or too small queries
            if (!query || typeof query !== 'string') return [];
            const q = query.toLowerCase().trim();
            if (q.length < 1) return [];

            const cleanQueryNum = parseInt(q.replace(/\D/g, ''), 10);

            let matches = [];

            BEATS_DATABASE.forEach(beat => {
                let score = 0;
                let matchReason = '';

                if (q === `beat ${beat.beatNumber}` || q === `${beat.beatNumber}` || q === `beat${beat.beatNumber}`) {
                    score += 100;
                    matchReason = `Exact Beat Number #${beat.beatNumber}`;
                }

                if (beat.areaName && beat.areaName.toLowerCase().includes(q)) {
                    score += 80;
                    matchReason = `Matched Main Area Name: ${beat.areaName}`;
                }

                if (Array.isArray(beat.areas)) {
                    beat.areas.forEach(subArea => {
                        if (subArea && subArea.toLowerCase().includes(q)) {
                            score += 75;
                            matchReason = `Matched Sub-locality: ${subArea}`;
                        }
                    });
                }

                if ((beat.postmanName && beat.postmanName.toLowerCase().includes(q)) || (beat.mobileNumber && beat.mobileNumber.includes(q))) {
                    score += 90;
                    matchReason = `Matched Employee: ${beat.postmanName} (${beat.mobileNumber})`;
                }

                if (!isNaN(cleanQueryNum) && cleanQueryNum > 0 && beat.doorRanges) {
                    const ranges = beat.doorRanges.split(',');
                    ranges.forEach(rangeStr => {
                        const parts = rangeStr.trim().split('-');
                        if (parts.length === 2) {
                            const start = parseInt(parts[0], 10);
                            const end = parseInt(parts[1], 10);
                            if (!isNaN(start) && !isNaN(end)) {
                                const min = Math.min(start, end);
                                const max = Math.max(start, end);
                                if (cleanQueryNum >= min && cleanQueryNum <= max) {
                                    score += 95;
                                    matchReason = `Door No. ${cleanQueryNum} falls within range (${min}-${max})`;
                                }
                            }
                        } else if (parts.length === 1) {
                            if (parseInt(parts[0], 10) === cleanQueryNum) {
                                score += 95;
                                matchReason = `Exact Door No. ${cleanQueryNum}`;
                            }
                        }
                    });
                }

                if (score > 0) {
                    matches.push({ beat, score, matchReason });
                }
            });

            matches.sort((a, b) => b.score - a.score);
            return matches;
        }

        async function startMobileCamera() {
            try {
                const constraints = { video: { facingMode: currentFacingMode } };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                selectedCameraStream = stream;
                isCameraActive = true;

                const video = document.getElementById('cameraVideo');
                const placeholder = document.getElementById('cameraPlaceholder');
                const overlay = document.getElementById('scanFrameOverlay');
                const captureBtn = document.getElementById('captureBtn');
                const startBtn = document.getElementById('startCamBtn');

                if (video) {
                    video.srcObject = stream;
                    video.classList.remove('hidden');
                }
                if (placeholder) placeholder.classList.add('hidden');
                if (overlay) {
                    overlay.classList.remove('hidden');
                    overlay.classList.add('flex');
                }
                if (captureBtn) captureBtn.classList.remove('hidden');
                if (startBtn) startBtn.classList.add('hidden');
            } catch (err) {
                const placeholder = document.getElementById('cameraPlaceholder');
                if (placeholder) {
                    placeholder.innerHTML = `
                        <div class="p-4 bg-tertiary-container/30 text-on-tertiary-container border border-tertiary rounded-xl text-center">

                        </div>
                    `;
                }
            }
        }

        function switchCameraFacing() {
            stopMobileCamera();
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            startMobileCamera();
        }

        function stopMobileCamera() {
            if (selectedCameraStream) {
                selectedCameraStream.getTracks().forEach(track => track.stop());
                selectedCameraStream = null;
            }
            isCameraActive = false;
        }

        function captureAndOCR() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.getElementById('cropCanvas');

            if (!video || !canvas) return;

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageDataUrl = canvas.toDataURL('image/png');
            processOCR(imageDataUrl);
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                processOCR(event.target.result);
            };
            reader.readAsDataURL(file);
        }

        async function processOCR(imageDataUrl) {
            stopMobileCamera();

            const appContainer = document.getElementById('appContent');
            appContainer.innerHTML = `
                <div class="max-w-md mx-auto my-12 bg-surface-container-lowest rounded-2xl border border-outline-variant p-8 shadow-xl text-center flex flex-col items-center gap-md">
                    <div class="w-14 h-14 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
                    <h3 class="font-title-lg text-title-lg text-on-surface font-bold">Extracting Address Text...</h3>
                    <p class="text-xs text-on-surface-variant">Tesseract OCR is processing image & matching against Delhi G.P.O. database...</p>
                </div>
            `;

            try {
                let textResult = "";
                if (window.Tesseract) {
                    const res = await Tesseract.recognize(imageDataUrl, 'eng');
                    textResult = res.data.text;
                } else {
                    textResult = "3902 Urdu Bazar Matia Mahal Delhi 110006";
                }

                const doorMatch = textResult.match(/\b\d{1,4}(\/\d{1,3})?\b/);
                const pinMatch = textResult.match(/\b1100\d{2}\b/);
                const fields = {
                    doorNumber: doorMatch ? doorMatch[0] : '3902',
                    pinCode: pinMatch ? pinMatch[0] : '110006',
                    area: textResult.toLowerCase().includes('chandni') ? 'Chandni Chowk' : 'Urdu Bazar',
                    rawText: textResult
                };

                // Optional 24h log to Supabase
                if (supabaseClient) {
                    try {
                        await supabaseClient.from('scan_history').insert({
                            scanned_text: textResult,
                            extracted_data: fields
                        });
                    } catch (e) { console.warn("Supabase temp scan log:", e); }
                }

                const results = searchDatabase(fields.doorNumber || fields.area || '3902');
                navigateTo('ocrResults', { rawText: textResult, fields, results });
            } catch (err) {
                console.error("OCR Error:", err);
                const results = searchDatabase("3902");
                navigateTo('ocrResults', {
                    rawText: "3902 Urdu Bazar Matia Mahal Delhi 110006",
                    fields: { doorNumber: "3902", area: "Urdu Bazar", pinCode: "110006" },
                    results
                });
            }
        }

        function initLookupMap(payload) {
            const container = document.getElementById('lookupLeafletMap');
            if (!container) return;

            let beat = BEATS_DATABASE.find(b => b.beatNumber === 12) || BEATS_DATABASE[0];
            if (typeof payload === 'object' && payload !== null && payload.beat) {
                beat = payload.beat;
            }

            try {
                const map = L.map('lookupLeafletMap').setView([beat.lat, beat.lng], 16);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                const marker = L.marker([beat.lat, beat.lng]).addTo(map);
                marker.bindPopup(`<b>Beat ${beat.beatNumber}</b><br>${beat.areaName}<br>Carrier: ${beat.postmanName}`).openPopup();
            } catch (err) {
                console.warn("Lookup Leaflet Map init:", err);
            }
        }

        async function handleSaveBeatEdit(e, beatNumber) {
            e.preventDefault();

            if (idx === -1) return;

            const hub = document.getElementById('editHub').value.trim() || 'DELHI GPO';
            const areaName = document.getElementById('editAreaName').value.trim() || 'Unknown Area';
            const postmanName = document.getElementById('editPostmanName').value.trim() || 'Unassigned';
            const mobileNumber = document.getElementById('editMobile').value.trim() || 'N/A';
            const doorRanges = document.getElementById('editDoorRanges').value.trim() || 'None';
            const areas = document.getElementById('editAreas').value.split(',').map(s => s.trim()).filter(Boolean);

            if (areas.length < 1) areas.push(areaName);

            BEATS_DATABASE[idx] = { ...BEATS_DATABASE[idx], hub, areaName, postmanName, mobileNumber, doorRanges, areas };

            if (supabaseClient) {
                try {
                    await supabaseClient.from('beats').update({
                        hub, area_name: areaName, postman_name: postmanName, mobile_number: mobileNumber, door_ranges: doorRanges, areas
                    }).eq('beat_number', beatNumber);
                } catch (err) { console.warn("Supabase update notice:", err); }
            }

            closeCustomModal();
            navigateTo('admin');
        }

                    <div>

                        <p class="text-xs text-on-surface-variant mt-1">${msg}</p>
                    </div>
                    <button onclick="closeCustomModal()" class="px-5 py-2 bg-primary text-on-primary rounded-full text-xs font-bold mx-auto">OK</button>
                </div>
            `;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCustomModal() {
            const modal = document.getElementById('modalContainer');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            modal.innerHTML = '';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await checkSupabaseConnection();
            await fetchBeatsFromSupabase();
            navigateTo('home');
        });
    </script>
</body>
</html>
