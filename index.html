        /* High-Definition SVG to PNG Converter for html2canvas with timeout guard */
        function rasterizeSvgNodeToImage(svgEl) {
            return new Promise((resolve) => {
                const safetyTimeout = setTimeout(() => resolve(false), 900);
                try {
                    const width = 345;
                    const height = 490;
                    const clonedSvg = svgEl.cloneNode(true);
                    clonedSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
                    clonedSvg.setAttribute('width', width);
                    clonedSvg.setAttribute('height', height);

                    const xml = new XMLSerializer().serializeToString(clonedSvg);
                    const svgBlob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
                    const URL = window.URL || window.webkitURL || window;
                    const blobUrl = URL.createObjectURL(svgBlob);

                    const img = new Image();
                    img.onload = () => {
                        clearTimeout(safetyTimeout);
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = width * 2;
                            canvas.height = height * 2;
                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = '#f4f7f2';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            URL.revokeObjectURL(blobUrl);

                            const pngImg = document.createElement('img');
                            pngImg.src = canvas.toDataURL('image/png', 0.95);
                            pngImg.style.width = '100%';
                            pngImg.style.height = '100%';
                            pngImg.style.display = 'block';
                            pngImg.style.objectFit = 'contain';

                            if (svgEl.parentNode) {
                                svgEl.parentNode.replaceChild(pngImg, svgEl);
                            }
                            resolve(true);
                        } catch (e) {
                            URL.revokeObjectURL(blobUrl);
                            resolve(false);
                        }
                    };
                    img.onerror = () => {
                        clearTimeout(safetyTimeout);
                        URL.revokeObjectURL(blobUrl);
                        resolve(false);
                    };
                    img.src = blobUrl;
                } catch (err) {
                    clearTimeout(safetyTimeout);
                    resolve(false);
                }
            });
        }

        /* Dedicated Mobile PDF Delivery Engine (Bypasses Android DownloadManager Blob URL failures) */
        async function deliverPdfToUser(pdfBlob, filename, beat) {
            const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
            const pdfUrl = URL.createObjectURL(pdfBlob);

            // 1. Mobile Native Web Share API: Allows saving straight to device/Drive without blob download failure
            if (isMobile && navigator.canShare) {
                try {
                    const file = new File([pdfBlob], filename, { type: 'application/pdf' });
                    if (navigator.canShare({ files: [file] })) {
                        closeCustomModal();
                        await navigator.share({
                            files: [file],
                            title: `Beat #${beat.beatNumber} Sheet`,
                            text: `Delhi G.P.O. Official Beat #${beat.beatNumber} Sheet (${beat.areaName})`
                        });
                        return;
                    }
                } catch (shareErr) {
                    if (shareErr.name === 'AbortError') {
                        closeCustomModal();
                        return;
                    }
                    console.debug("Web Share notice, falling back to direct options:", shareErr);
                }
            }

            // 2. Direct browser link click attempt
            try {
                const link = document.createElement('a');
                link.href = pdfUrl;
                link.download = filename;
                link.target = '_blank';
                document.body.appendChild(link);
                link.click();
                setTimeout(() => {
                    if (document.body.contains(link)) document.body.removeChild(link);
                }, 300);
            } catch(e) {
                console.warn("Direct link trigger:", e);
            }

            // 3. Display instant interactive Ready Modal with Open / View & Download buttons
            showPdfReadyModal(pdfUrl, filename, beat);
        }

        async function downloadA4PDF(beatNumber) {
            try {
                const saved = localStorage.getItem(STORAGE_KEYS.SETTINGS);
                if (saved) APP_SETTINGS = { ...APP_SETTINGS, ...JSON.parse(saved) };
            } catch(e) {}

            const beat = BEATS_DATABASE.find(b => b.beatNumber === beatNumber) || activeBeatDetails || BEATS_DATABASE[0];
            const filename = `Delhi_GPO_110006_Beat_${beat.beatNumber}_Official_A4_Sheet.pdf`;
            const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
            
            showModalNotice("Generating A4 PDF", `
                <div class="flex flex-col items-center gap-2 py-1 text-center">
                    <div class="w-8 h-8 border-3 border-primary border-t-transparent rounded-full animate-spin"></div>
                    <span class="text-xs font-black text-on-surface">Rendering Official Single-Page A4 Sheet for Beat #${beat.beatNumber}...</span>
                    <span class="text-[10.5px] text-emerald-800 font-semibold">Delivery Zone Map • HD Sharpness • Strictly 1 Page</span>
                </div>
            `);

            const renderWrapper = document.createElement('div');
            renderWrapper.id = 'a4_pdf_render_stage';
            renderWrapper.style.position = 'fixed';
            renderWrapper.style.top = '0';
            renderWrapper.style.left = '0';
            renderWrapper.style.width = '794px';
            renderWrapper.style.minWidth = '794px';
            renderWrapper.style.maxWidth = '794px';
            renderWrapper.style.height = '1120px';
            renderWrapper.style.maxHeight = '1120px';
            renderWrapper.style.backgroundColor = '#ffffff';
            renderWrapper.style.zIndex = '99999';
            renderWrapper.style.overflow = 'hidden';
            renderWrapper.style.boxSizing = 'border-box';
            renderWrapper.style.pointerEvents = 'none';

            renderWrapper.innerHTML = renderOfficialA4SheetHTML(beat, true);
            document.body.appendChild(renderWrapper);

            const svgEl = renderWrapper.querySelector('svg.map-sketch-svg');
            if (svgEl) {
                await rasterizeSvgNodeToImage(svgEl);
            }

            setTimeout(() => {
                if (typeof html2pdf !== 'undefined') {
                    const opt = {
                        margin: [0, 0, 0, 0],
                        filename: filename,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { 
                            scale: isMobile ? 1.5 : 2, 
                            useCORS: true, 
                            logging: false,
                            scrollX: 0,
                            scrollY: 0,
                            width: 794,
                            height: 1120,
                            windowWidth: 794,
                            windowHeight: 1120
                        },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                        pagebreak: { mode: 'avoid-all' }
                    };

                    const worker = html2pdf().set(opt).from(renderWrapper);
                    worker.toPdf().get('pdf').then(async function(pdf) {
                        const pdfBlob = pdf.output('blob');
                        if (document.body.contains(renderWrapper)) {
                            document.body.removeChild(renderWrapper);
                        }
                        await deliverPdfToUser(pdfBlob, filename, beat);
                    }).catch(function(err) {
                        console.warn("Direct html2pdf error, fallback to print:", err);
                        if (document.body.contains(renderWrapper)) {
                            document.body.removeChild(renderWrapper);
                        }
                        handlePdfFallback(beat, filename);
                    });
                } else {
                    if (document.body.contains(renderWrapper)) {
                        document.body.removeChild(renderWrapper);
                    }
                    handlePdfFallback(beat, filename);
                }
            }, 300);
        }

            const cleanEmail = email.toLowerCase().trim();

        function renderAdminTableRows(beats) {
            const list = (beats && beats.length > 0) ? beats : BEATS_DATABASE;

            if (!sortedList || sortedList.length === 0) {
                return `<tr><td colspan="7" class="p-6 text-center text-xs text-on-surface-variant font-bold">No beats match your search criteria.</td></tr>`;

            return sortedList.map(b => {
                const isUnlocked = isPhoneDataUnlocked(b.beatNumber);
                return `
                <tr class="hover:bg-surface-container-low transition-colors border-b border-outline-variant/40">
                    <td class="py-2.5 px-3.5 whitespace-nowrap">

            }).join('');

        function filterAdminBeatsTable() {
            const query = document.getElementById('adminBeatSearchInput')?.value.toLowerCase().trim() || '';
            const filtered = BEATS_DATABASE.filter(b => 
                b.beatNumber.toString() === query ||

        function exportBeatsCSV() {
            try {
                let csv = "Beat Number,Hub Name,Area Name,Postman Staff,Type,Contact Number,Door Ranges\n";
                BEATS_DATABASE.forEach(b => {
                    const row = [
                        b.beatNumber,
                        `"${(b.hub || '').replace(/"/g, '""')}"`,
                        `"${(b.areaName || '').replace(/"/g, '""')}"`,
                        `"${(b.postmanName || '').replace(/"/g, '""')}"`,
                        `"${(b.type || 'Postman').replace(/"/g, '""')}"`,
                        `"${(b.mobileNumber || '').replace(/"/g, '""')}"`,
                        `"${(b.doorRanges || '').replace(/"/g, '""')}"`
                    ];
                    csv += row.join(",") + "\n";
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Delhi_GPO_110006_Beats_Master_${new Date().toISOString().slice(0, 10)}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showModalNotice("CSV Exported", "Master beat roster successfully exported to CSV spreadsheet!");
            } catch (e) {
                showModalNotice("Export Error", e.message);

        }

        function handleSaveNewBeat(e) {

            const type = document.getElementById('newBeatType').value;
            const doorRanges = document.getElementById('newBeatDoorRanges').value.trim();
            const areas = document.getElementById('newBeatAreas').value.split(',').map(s => s.trim()).filter(Boolean);

            const existingIdx = BEATS_DATABASE.findIndex(b => b.beatNumber === beatNumber);
            const newEntry = { beatNumber, hub, areaName, postmanName, mobileNumber, type, doorRanges, areas, lat: 28.655, lng: 77.228 };

            if (existingIdx >= 0) {
                BEATS_DATABASE[existingIdx] = newEntry;
            } else {
                BEATS_DATABASE.push(newEntry);
                BEATS_DATABASE.sort((a, b) => a.beatNumber - b.beatNumber);
            }

            saveBeatsPermanently(true);
            closeCustomModal();
            navigateTo('admin');
        }

        function computePostageTariff() {
            const serviceType = document.getElementById('calcServiceType')?.value || 'speed_post';
            const distance = document.getElementById('calcDistance')?.value || 'local';
            const weightInput = document.getElementById('calcWeight');
            let weight = parseFloat(weightInput?.value) || 50;
            const ack = document.getElementById('calcAck')?.value || 'no';
            const insValue = parseFloat(document.getElementById('calcInsurance')?.value) || 0;

            const resAmountEl = document.getElementById('calcResultAmount');
            const breakdownEl = document.getElementById('calcBreakdown');
            const gstBadgeEl = document.getElementById('calcGstBadge');
            if (!resAmountEl || !breakdownEl) return;

            let baseAmount = 0;
            let serviceLabel = "Speed Post";
            let isGstApplicable = true;

            if (serviceType === 'speed_post') {
                serviceLabel = "Speed Post";
                isGstApplicable = true;
                if (distance === 'local') {
                    if (weight <= 50) baseAmount = 15;
                    else if (weight <= 200) baseAmount = 25;
                    else if (weight <= 500) baseAmount = 30;
                    else baseAmount = 30 + Math.ceil((weight - 500) / 500) * 10;
                } else if (distance === 'up_to_200') {
                    if (weight <= 50) baseAmount = 35;
                    else if (weight <= 200) baseAmount = 35;
                    else if (weight <= 500) baseAmount = 40;
                    else baseAmount = 40 + Math.ceil((weight - 500) / 500) * 15;
                } else if (distance === '201_1000') {
                    if (weight <= 50) baseAmount = 35;
                    else if (weight <= 200) baseAmount = 40;
                    else if (weight <= 500) baseAmount = 60;
                    else baseAmount = 60 + Math.ceil((weight - 500) / 500) * 30;
                } else if (distance === '1001_2000') {
                    if (weight <= 50) baseAmount = 35;
                    else if (weight <= 200) baseAmount = 60;
                    else if (weight <= 500) baseAmount = 70;
                    else baseAmount = 70 + Math.ceil((weight - 500) / 500) * 40;
                } else { // above 2000 km
                    if (weight <= 50) baseAmount = 35;
                    else if (weight <= 200) baseAmount = 70;
                    else if (weight <= 500) baseAmount = 80;
                    else baseAmount = 80 + Math.ceil((weight - 500) / 500) * 50;
                }
            } else if (serviceType === 'registered_post') {
                serviceLabel = "Regd Post";
                isGstApplicable = false;
                const letterPostage = weight <= 20 ? 5 : 5 + Math.ceil((weight - 20) / 20) * 5;
                const regFee = 17;
                baseAmount = letterPostage + regFee;
            } else if (serviceType === 'parcel') {
                serviceLabel = "Retail Parcel";
                isGstApplicable = true;
                const regFee = 17;
                const parcelBase = weight <= 500 ? 19 : 19 + Math.ceil((weight - 500) / 500) * 16;
                baseAmount = regFee + parcelBase;
            } else if (serviceType === 'book_post') {
                serviceLabel = "Book Post";
                isGstApplicable = false;
                baseAmount = weight <= 50 ? 4 : 4 + Math.ceil((weight - 500) / 50) * 3;
            } else { // ordinary_letter
                serviceLabel = "Ordinary Letter";
                isGstApplicable = false;
                baseAmount = weight <= 20 ? 5 : 5 + Math.ceil((weight - 20) / 20) * 5;
            }

            // Optional Add-ons
            let adFee = (ack === 'yes') ? 3.00 : 0;
            let insFee = 0;
            if (insValue > 0) {
                insFee = insValue <= 200 ? 10 : 10 + Math.ceil((insValue - 200) / 100) * 6;
            }

            baseAmount += adFee + insFee;

            if (isGstApplicable) {
                const cgst = baseAmount * 0.09;
                const sgst = baseAmount * 0.09;
                const total = baseAmount + cgst + sgst;
                resAmountEl.textContent = `₹${total.toFixed(2)}`;
                if (gstBadgeEl) gstBadgeEl.textContent = "(Inclusive of 18% GST)";
                breakdownEl.textContent = `${serviceLabel} Base: ₹${baseAmount.toFixed(2)} • CGST (9%): ₹${cgst.toFixed(2)} • SGST (9%): ₹${sgst.toFixed(2)}`;
            } else {
                resAmountEl.textContent = `₹${baseAmount.toFixed(2)}`;
                if (gstBadgeEl) gstBadgeEl.textContent = "(Exempt from GST)";
                breakdownEl.textContent = `${serviceLabel} Base Postage: ₹${baseAmount.toFixed(2)} • Standard Public Postage`;
            }
        }

            if (!modal) return;
            modal.innerHTML = `
                <div class="bg-surface-container-lowest w-full max-w-[340px] rounded-3xl border border-outline-variant shadow-2xl p-5 flex flex-col gap-3">
                    <div class="flex justify-between items-center border-b pb-2">
                        <h3 class="text-sm font-black text-on-surface" data-i18n="Select Language">Select Language</h3>
                        <button onclick="closeCustomModal()" class="material-symbols-outlined">close</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        ${[
                            { c: 'en', n: 'English' }, { c: 'hi', n: 'हिन्दी' },
                            { c: 'te', n: 'తెలుగు' }, { c: 'ml', n: 'മലയാളം' },
                            { c: 'kn', n: 'ಕನ್ನಡ' }, { c: 'ta', n: 'தமிழ்' }
                        ].map(l => `
                            <button onclick="changeLanguage('${l.c}')" class="p-2.5 rounded-xl border text-xs font-bold ${currentLang === l.c ? 'bg-primary text-white' : 'bg-surface-container'}">
                                ${l.n}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function changeLanguage(lang) {
            localStorage.setItem('delhi_gpo_selected_lang', lang);
            closeCustomModal();
            navigateTo(currentTab, activeBeatDetails);
        }

        function closeCustomModal() {
            const modal = document.getElementById('modalContainer');
            if (modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); modal.innerHTML = ''; }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = getCurrentLanguage();
            if (savedLang && savedLang !== 'en') {
                try {
                    const domain = window.location.hostname;
                    document.cookie = `googtrans=/en/${savedLang}; path=/;`;
                    document.cookie = `googtrans=/en/${savedLang}; path=/; domain=${domain};`;
                } catch(e) {}
            }
            // Auto-trigger Supabase background sync, settings sync & real-time broadcast listeners
            checkSupabaseAdminSession();
            syncSettingsFromSupabase();
            syncBeatsFromSupabase();
            initRealtimeCloudListeners();

            // High-speed background sync fallback for environments with restricted WebSockets (Canvas / Sandboxes)
            setInterval(() => {
                syncSettingsFromSupabase();
            }, 2500);

            setInterval(() => {
                syncBeatsFromSupabase();
            }, 5000);

            // Instant sync whenever user switches to the app or unlocks their mobile screen
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    syncSettingsFromSupabase();
                    syncBeatsFromSupabase();
                }
            });
            window.addEventListener('focus', () => {
                syncSettingsFromSupabase();
                syncBeatsFromSupabase();
            });

            navigateTo('home');
            applyCurrentLanguage(document.body);
        });
    </script>
</body>
</html>
