        // Comprehensive Door / Shop / Quarter / Block Matcher (Handles standard, descending, slash, and letter-prefixed/suffixed ranges)
        function matchDoorTokenInText(rawToken, rangeText) {
            if (!rawToken || !rangeText) return false;
            const q = rawToken.trim().toLowerCase();
            if (!q) return false;

            // 1. Slash-based Door Number (e.g. "2208/15" in "2208/1-2208/30", "1/120" in "1/101-1/131", "1439/25" in "1439/1-1439/50")
            const slashQuery = q.match(/^(\d+)\/(\d+)$/);
            if (slashQuery) {
                const qPrefix = slashQuery[1];
                const qSub = parseInt(slashQuery[2], 10);
                // Exact slash match
                const escapedQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                if (new RegExp(`(^|[^0-9a-z/])${escapedQ}($|[^0-9a-z/])`, 'i').test(rangeText)) {
                    return rawToken.toUpperCase();
                }
                // Slash range match like 2208/1-2208/30 or 232/1-80
                const slashRangeRegex = /(\d+)\/(\d+)\s*(?:-|–|—|\bto\b)\s*(?:(\d+)\/)?(\d+)/gi;
                let m;
                while ((m = slashRangeRegex.exec(rangeText)) !== null) {
                    const p1 = m[1], s1 = parseInt(m[2], 10), p2 = m[3] || p1, s2 = parseInt(m[4], 10);
                    if (p1 === qPrefix && p2 === qPrefix) {
                        const lo = Math.min(s1, s2), hi = Math.max(s1, s2);
                        if (qSub >= lo && qSub <= hi) return m[0];
                    }
                }
            }

            // 2. Letter-prefixed Door/Quarter/Block Code (e.g. "J-45", "J45", "T225", "T-410", "B50", "A20", "L18")
            const alphaPrefixQuery = q.match(/^([a-z]{1,2})[-]?(\d+)([a-z]?)$/i);
            if (alphaPrefixQuery) {
                const qLet = alphaPrefixQuery[1].toLowerCase();
                const qNum = parseInt(alphaPrefixQuery[2], 10);
                const qSuf = (alphaPrefixQuery[3] || '').toLowerCase();
                // Exact alphanumeric token match (e.g. T51A, T510A, F1A)
                const escapedFull = q.replace(/[-]/g, '[-]?').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                if (new RegExp(`(^|[^a-z0-9])${escapedFull}($|[^a-z0-9])`, 'i').test(rangeText)) {
                    return rawToken.toUpperCase();
                }
                // Letter-prefixed range match (e.g. J-1 to J-99, A1-A36, B71-B37, T-221-T295, T480-T414, L16-L22)
                if (!qSuf) {
                    const prefRangeRegex = /([a-z]{1,2})[-]?(\d+)\s*(?:-|–|—|\bto\b)\s*([a-z]{1,2})?[-]?(\d+)/gi;
                    let m;
                    while ((m = prefRangeRegex.exec(rangeText)) !== null) {
                        const l1 = m[1].toLowerCase(), n1 = parseInt(m[2], 10);
                        const l2 = (m[3] || l1).toLowerCase(), n2 = parseInt(m[4], 10);
                        if (l1 === qLet && l2 === qLet) {
                            const lo = Math.min(n1, n2), hi = Math.max(n1, n2);
                            if (qNum >= lo && qNum <= hi) return m[0];
                        }
                    }
                }
            }

            // 3. Number + Letter suffix (e.g. "1568A", "826B", "142a", "110C", "100B", "12A")
            const alphaSuffixQuery = q.match(/^(\d+)([a-z])$/i);
            if (alphaSuffixQuery) {
                const qNum = parseInt(alphaSuffixQuery[1], 10);
                const qLet = alphaSuffixQuery[2].toLowerCase();
                const escapedFull = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                if (new RegExp(`(^|[^a-z0-9])${escapedFull}($|[^a-z0-9])`, 'i').test(rangeText)) {
                    return rawToken.toUpperCase();
                }
                // Same-number letter range e.g. 110A-110E or 100A-100D
                const sameNumLetRange = /(\d+)([a-z])\s*(?:-|–|—|\bto\b)\s*(\d+)([a-z])/gi;
                let m;
                while ((m = sameNumLetRange.exec(rangeText)) !== null) {
                    const n1 = parseInt(m[1], 10), l1 = m[2].toLowerCase();
                    const n2 = parseInt(m[3], 10), l2 = m[4].toLowerCase();
                    if (n1 === n2 && n1 === qNum && qLet >= l1 && qLet <= l2) return m[0];
                    if (l1 === l2 && l1 === qLet) {
                        const lo = Math.min(n1, n2), hi = Math.max(n1, n2);
                        if (qNum >= lo && qNum <= hi) return m[0];
                    }
                }
            }

            // 4. Pure Integer Door/House/Shop Number (handles ascending & descending ranges like 3902-3930, 2510-2476, 07 to 695)
            if (/^\d{1,5}$/.test(q)) {
                const searchNum = parseInt(q, 10);
                // First check numeric ranges (excluding slash-prefixed sub-numbers)
                const numRangeRegex = /(?<![a-z/])\b(\d{1,5})[a-z]?\s*(?:-|–|—|\bto\b)\s*(\d{1,5})[a-z]?\b(?!\/)/gi;
                let m;
                while ((m = numRangeRegex.exec(rangeText)) !== null) {
                    const start = parseInt(m[1], 10);
                    const end = parseInt(m[2], 10);
                    if (!isNaN(start) && !isNaN(end)) {
                        const lo = Math.min(start, end);
                        const hi = Math.max(start, end);
                        if (searchNum >= lo && searchNum <= hi) {
                            return m[0];
                        }
                    }
                }
                // Check exact standalone number or slash-base number (e.g. "2208" matching "2208/1-2208/30" or "3611")
                const exactNumRegex = new RegExp(`(^|[^0-9a-z/])${searchNum}(?:[a-z]|\\/\\d+)?($|[^0-9a-z])`, 'i');
                const exactMatch = rangeText.match(exactNumRegex);
                if (exactMatch) {
                    return String(searchNum);
                }
            }

            return false;
        }

        // Find exact matching PDF Area/Street bullet line for a door number or text query
        function findMatchingAreaLine(beat, queryLower, doorToken = null) {
            const list = beat._areasList || [];
            if (doorToken) {
                for (const line of list) {
                    if (matchDoorTokenInText(doorToken, line)) {
                        return line;
                    }
                }
            }
            if (queryLower) {
                const qCompact = cleanCompactStr(queryLower);
                for (const line of list) {
                    const lLow = line.toLowerCase();
                    if (lLow.includes(queryLower) || (qCompact.length >= 3 && cleanCompactStr(lLow).includes(qCompact))) {
                        return line;
                    }
                }
                const words = queryLower.split(/[^a-z0-9/]+/).filter(w => w.length >= 2);
                if (words.length > 0) {
                    let bestLine = '';
                    let bestHits = 0;
                    for (const line of list) {
                        const lLow = line.toLowerCase();
                        let hits = 0;
                        for (const w of words) {
                            if (lLow.includes(w)) hits++;
                        }
                        if (hits > bestHits) {
                            bestHits = hits;
                            bestLine = line;
                        }
                    }
                    if (bestHits > 0) return bestLine;
                }
            }
            return '';
        }

        function checkDoorNumberInRange(numStr, rangeStr) {
            return matchDoorTokenInText(numStr, rangeStr);
        }

        function searchDatabase(rawQuery) {
            if (!rawQuery) return [];
            const cleanRaw = rawQuery.trim().toLowerCase();
            if (!cleanRaw) return [];

            ensureBeatSearchIndices();

            // 1. EXPLICIT OLD BEAT NUMBER SEARCH (e.g. "old beat 12", "old beat no 42")
            const oldBeatMatch = cleanRaw.match(/^old\s*beat\s*(?:no\.?|number|#)?\s*(\d{1,2}(?:\/\d{1,2})?)$/);
            if (oldBeatMatch) {
                const ob = oldBeatMatch[1];
                const matches = BEATS_DATABASE.filter(b => b._oldBeatStr === ob || b._oldBeatStr.split('/').includes(ob));
                if (matches.length > 0) {
                    return matches.map(beat => ({
                        beat,
                        score: 1000,
                        matchReason: `Old Beat No. ${beat.oldBeatNo} → Revised Beat #${beat.beatNumber} (${beat.areaName})`
                    }));
                }
            }

            // 2. DIRECT BEAT NUMBER (1 to 50) e.g., "1", "10", "50", "beat 10", "#10", "beat no. 10"
            const beatNumClean = cleanRaw.replace(/\b(beat|no\.?|number|delhi|gpo)\b/g, '').replace(/[#]/g, '').trim();
            if (/^\d{1,2}$/.test(beatNumClean)) {
                const bNum = parseInt(beatNumClean, 10);
                if (bNum >= 1 && bNum <= 50) {
                    const exactBeat = BEATS_DATABASE.find(b => b.beatNumber === bNum);
                    if (exactBeat) {
                        return [{
                            beat: exactBeat,
                            score: 1000,
                            matchReason: `Exact Beat #${exactBeat.beatNumber} (${exactBeat.areaName})`
                        }];
                    }
                }
            }

            // 3. POSTMAN MOBILE NUMBER SEARCH (Exact 10-digit or partial 4+ digit phone search)
            const pureDigits = cleanRaw.replace(/[\s+()-]/g, '');
            if (/^\d{4,12}$/.test(pureDigits)) {
                const normPhone = pureDigits.startsWith('91') && pureDigits.length === 12 ? pureDigits.slice(2) : pureDigits;
                if (normPhone.length >= 6) {
                    const phoneMatches = BEATS_DATABASE.filter(b => b._mobileDigits && b._mobileDigits.includes(normPhone));
                    if (phoneMatches.length > 0) {
                        return phoneMatches.map(beat => ({
                            beat,
                            score: 995,
                            matchReason: `Postman Contact Match: ${beat.postmanName} (Beat #${beat.beatNumber})`
                        }));
                    }
                }
            }

            const qCompact = cleanCompactStr(cleanRaw);
            const qPhonetic = phoneticSimplifyStr(cleanRaw);

            // 4. JOINED DOOR + AREA e.g., "1100lalkuan", "3905matiamahal", "lalkuan1100"
            let joinedDoorNum = null;
            let joinedAreaText = null;
            const joinedMatchLeading = cleanRaw.match(/^(\d{2,5})([a-z]{3,})$/);
            const joinedMatchTrailing = cleanRaw.match(/^([a-z]{3,})(\d{2,5})$/);

            if (joinedMatchLeading) {
                joinedDoorNum = joinedMatchLeading[1];
                joinedAreaText = joinedMatchLeading[2];
            } else if (joinedMatchTrailing) {
                joinedAreaText = joinedMatchTrailing[1];
                joinedDoorNum = joinedMatchTrailing[2];
            }

            if (joinedDoorNum && joinedAreaText) {
                const areaCompact = cleanCompactStr(joinedAreaText);
                const areaPhonetic = phoneticSimplifyStr(joinedAreaText);
                const joinedResults = [];

                for (const beat of BEATS_DATABASE) {
                    const matchedRange = matchDoorTokenInText(joinedDoorNum, beat.doorRanges || '') || matchDoorTokenInText(joinedDoorNum, beat._areasLower);
                    if (!matchedRange) continue;

                    const areaMatched = beat._areaCompact.includes(areaCompact) || areaCompact.includes(beat._areaCompact) ||
                                        (areaPhonetic && beat._areaPhonetic.includes(areaPhonetic)) ||
                                        beat._areasCompact.includes(areaCompact);
                    if (areaMatched) {
                        const exactLine = findMatchingAreaLine(beat, joinedAreaText, joinedDoorNum);
                        joinedResults.push({
                            beat,
                            score: 990,
                            matchReason: exactLine
                                ? `Door #${joinedDoorNum} → ${exactLine}`
                                : `Door #${joinedDoorNum} in range [${matchedRange}] in ${beat.areaName}`
                        });
                    }
                }
                if (joinedResults.length > 0) return joinedResults;
            }

            // 5. PURE / ALPHANUMERIC SINGLE DOOR NUMBER SEARCH (e.g. "3905", "70", "85", "1568A", "T51A", "J-45", "2208/15", "B50", "1/120")
            const isDoorCodeQuery = /^(\d{2,5}|[a-z]{1,2}[-]?\d+[a-z]?|\d+[a-z]|\d+\/\d+)$/i.test(cleanRaw);
            if (isDoorCodeQuery) {
                const doorMatches = [];
                for (const beat of BEATS_DATABASE) {
                    const matchedRange = matchDoorTokenInText(cleanRaw, beat.doorRanges || '') || matchDoorTokenInText(cleanRaw, beat._areasLower);
                    if (matchedRange) {
                        const exactLine = findMatchingAreaLine(beat, null, cleanRaw);
                        const isExactCode = matchedRange.toLowerCase() === cleanRaw;
                        doorMatches.push({
                            beat,
                            score: isExactCode ? 960 : 880,
                            matchReason: exactLine
                                ? `Door/Code "${rawQuery.trim()}" → ${exactLine}`
                                : `Door/Code "${rawQuery.trim()}" falls in [${matchedRange}] (${beat.areaName})`
                        });
                    }
                }
                if (doorMatches.length > 0) {
                    doorMatches.sort((a, b) => b.score - a.score || a.beat.beatNumber - b.beat.beatNumber);
                    return doorMatches.slice(0, 20);
                }
            }

            // 6. FULL-TEXT MULTI-FIELD INTELLIGENT SCORING ACROSS ALL 50 BEATS (Every word, street, katra, market, office, postman, door range from the PDF)
            const stopWords = new Set(['beat', 'no', 'number', 'delhi', 'gpo', '110006', 'pin', 'pincode', 'of', 'the', 'and', 'in', 'at', 'to', 'for', 'near', 'opp', 'road', 'rd']);
            const rawTokens = cleanRaw.split(/[\s,;&+()]+/).map(t => t.replace(/^[^a-z0-9/]+|[^a-z0-9/]+$/g, '')).filter(Boolean);
            const meaningfulTokens = rawTokens.filter(t => !stopWords.has(t));
            const tokensToUse = meaningfulTokens.length > 0 ? meaningfulTokens : rawTokens;

            const doorTokens = tokensToUse.filter(t => /^(\d{1,5}|[a-z]{1,2}[-]?\d+[a-z]?|\d+[a-z]|\d+\/\d+)$/i.test(t));
            const textTokens = tokensToUse.filter(t => !doorTokens.includes(t));

            const scoredList = [];

            for (const beat of BEATS_DATABASE) {
                let score = 0;
                const reasons = [];

                // A. Direct Beat # + Text combination (e.g. "10 lal kuan", "beat 16 red fort")
                if (doorTokens.length > 0 && textTokens.length > 0 && /^\d{1,2}$/.test(doorTokens[0])) {
                    const bCand = parseInt(doorTokens[0], 10);
                    if (bCand === beat.beatNumber) {
                        const textAllHit = textTokens.every(t => {
                            const tc = cleanCompactStr(t);
                            return beat._fullTextLower.includes(t) || (tc.length >= 3 && beat._fullCorpusCompact.includes(tc));
                        });
                        if (textAllHit) {
                            score = Math.max(score, 985);
                            reasons.push(`Beat #${beat.beatNumber} matching "${textTokens.join(' ')}"`);
                        }
                    }
                }

                // B. Postman Name Match (handles BOTH single and multiple matches like "Rajesh", "Kumar", "Sharma", "Meena", "Devi", "Prasad Reddy")
                if (qCompact.length >= 3) {
                    if (beat._postmanCompact === qCompact || beat._postmanPhonetic === qPhonetic) {
                        score = Math.max(score, 970);
                        reasons.push(`Assigned Carrier: ${beat.postmanName} (${beat.type})`);
                    } else if (beat._postmanLower.includes(cleanRaw) || beat._postmanCompact.includes(qCompact)) {
                        score = Math.max(score, 900);
                        reasons.push(`Assigned Carrier: ${beat.postmanName} (${beat.type})`);
                    } else if (qCompact.length >= 5 && isFastFuzzyWordMatch(qCompact, qPhonetic, beat.postmanName)) {
                        score = Math.max(score, 820);
                        reasons.push(`Carrier Match: ${beat.postmanName} (${beat.type})`);
                    }
                }

                // C. Exact Phrase Match in Primary Area / Reference Locality / Hub / Any Street-Katra Bullet
                if (beat._areaLower === cleanRaw || beat._areaCompact === qCompact) {
                    score = Math.max(score, 950);
                    reasons.push(`Exact Area: ${beat.areaName}`);
                } else if (beat._areaLower.includes(cleanRaw) || (qCompact.length >= 3 && beat._areaCompact.includes(qCompact))) {
                    score = Math.max(score, 860);
                    reasons.push(`Primary Area: ${beat.areaName}`);
                } else if (beat._areasLower.includes(cleanRaw) || (qCompact.length >= 3 && beat._areasCompact.includes(qCompact))) {
                    const matchedLine = findMatchingAreaLine(beat, cleanRaw);
                    score = Math.max(score, 840);
                    reasons.push(matchedLine ? `Matched: ${matchedLine}` : `Street / Katra in ${beat.areaName}`);
                } else if (beat._hubLower.includes(cleanRaw) || (qCompact.length >= 4 && beat._hubCompact.includes(qCompact))) {
                    score = Math.max(score, 720);
                    reasons.push(`Delivery Hub: ${beat.hub}`);
                }

                // D. Short Acronym / Exact Word Boundary Match (e.g. "SBI", "DTC", "LIC", "DCM", "CBI", "ITI", "MCD", "PWD", "NCC", "RMS", "TB", "OHE", "ISBT", "CRPF", "CISF", "BSES", "MTNL")
                if (score === 0 && cleanRaw.length >= 2 && cleanRaw.length <= 5 && /^[a-z0-9]+$/i.test(cleanRaw)) {
                    const escaped = cleanRaw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const wordBoundary = new RegExp(`(^|[^a-z0-9])${escaped}($|[^a-z0-9])`, 'i');
                    if (wordBoundary.test(beat._fullTextLower)) {
                        const matchedLine = findMatchingAreaLine(beat, cleanRaw);
                        score = Math.max(score, 830);
                        reasons.push(matchedLine ? `Matched: ${matchedLine}` : `Matched "${rawQuery.trim()}" in ${beat.areaName}`);
                    }
                }

                // E. Multi-Token Combined Matching (e.g. "3905 Matia Mahal", "Red Fort CISF", "SBI Bhagirath", "Police Quarters Chamelian", "Haryana Roadways ISBT")
                if (tokensToUse.length >= 2) {
                    let textHits = 0;
                    let doorHits = 0;
                    let matchedDoorDesc = '';

                    for (const dt of doorTokens) {
                        const mr = matchDoorTokenInText(dt, beat.doorRanges || '') || matchDoorTokenInText(dt, beat._areasLower);
                        if (mr) {
                            doorHits++;
                            const exactLine = findMatchingAreaLine(beat, textTokens.join(' '), dt);
                            matchedDoorDesc = exactLine ? `Door #${dt} → ${exactLine}` : `Door #${dt} in [${mr}]`;
                        }
                    }

                    for (const tt of textTokens) {
                        const tComp = cleanCompactStr(tt);
                        const tPhon = phoneticSimplifyStr(tt);
                        const escaped = tt.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const isShort = tt.length <= 3;

                        let hit = false;
                        if (isShort) {
                            hit = new RegExp(`(^|[^a-z0-9])${escaped}($|[^a-z0-9])`, 'i').test(beat._fullTextLower);
                        } else {
                            hit = beat._fullTextLower.includes(tt) ||
                                  beat._fullCorpusCompact.includes(tComp) ||
                                  (tPhon.length >= 4 && (beat._areaPhonetic.includes(tPhon) || beat._areasPhonetic.includes(tPhon) || beat._postmanPhonetic.includes(tPhon))) ||
                                  (tt.length >= 5 && beat._fullWords.some(w => Math.abs(w.length - tt.length) <= 2 && fastLevenshtein(tt, w, tt.length >= 7 ? 2 : 1) <= (tt.length >= 7 ? 2 : 1)));
                        }
                        if (hit) textHits++;
                    }

                    const totalMatched = textHits + doorHits;
                    if (totalMatched === tokensToUse.length) {
                        const combinedScore = doorHits > 0 ? 965 : 890;
                        if (combinedScore > score) {
                            score = combinedScore;
                            const matchedLine = findMatchingAreaLine(beat, textTokens.join(' '), doorTokens[0] || null);
                            reasons.unshift(matchedDoorDesc || (matchedLine ? `Matched: ${matchedLine}` : `All terms matched in ${beat.areaName}`));
                        }
                    } else if (textTokens.length >= 2 && textHits >= Math.ceil(textTokens.length * 0.75) && doorTokens.length === 0) {
                        const partialScore = 620 + (textHits * 35);
                        if (partialScore > score) {
                            score = partialScore;
                            const matchedLine = findMatchingAreaLine(beat, textTokens.join(' '));
                            reasons.push(matchedLine ? `Matched: ${matchedLine}` : `Partial match in ${beat.areaName}`);
                        }
                    }
                }

                // F. Phonetic & Typo-Tolerant Fallback for Single Words (e.g. "chawri", "dariba", "chandni", "kashmere", "bazaar", "turkman")
                if (score === 0 && qCompact.length >= 4) {
                    if (qPhonetic.length >= 4 && beat._areaPhonetic.includes(qPhonetic)) {
                        score = 780;
                        reasons.push(`Area Match: ${beat.areaName}`);
                    } else if (qPhonetic.length >= 5 && beat._areasPhonetic.includes(qPhonetic)) {
                        const matchedLine = findMatchingAreaLine(beat, cleanRaw);
                        score = 740;
                        reasons.push(matchedLine ? `Matched: ${matchedLine}` : `Street / Katra Match in ${beat.areaName}`);
                    } else if (qCompact.length >= 5) {
                        const maxD = qCompact.length >= 7 ? 2 : 1;
                        const fuzzyWord = beat._fullWords.find(w => w.length >= 5 && fastLevenshtein(qCompact, w, maxD) <= maxD);
                        if (fuzzyWord) {
                            const matchedLine = findMatchingAreaLine(beat, fuzzyWord);
                            score = 680;
                            reasons.push(matchedLine ? `Similar Match: ${matchedLine}` : `Similar to "${fuzzyWord}" in ${beat.areaName}`);
                        }
                    }
                }

                if (score > 0) {
                    scoredList.push({
                        beat,
                        score,
                        matchReason: reasons[0] || `Matched in ${beat.areaName}`
                    });
                }
            }

            scoredList.sort((a, b) => b.score - a.score || a.beat.beatNumber - b.beat.beatNumber);

            if (scoredList.length > 0) {
                const topScore = scoredList[0].score;
                // Keep all strong & relevant matches (don't hide beats when a street, area, or postman name spans multiple beats)
                const threshold = topScore >= 900 ? topScore * 0.85 : topScore * 0.78;
                return scoredList.filter(item => item.score >= threshold).slice(0, 15);
            }

            return [];
        }

        /* Reliable Zero-403 Map Tile Engine (Google Maps Streets/Hybrid + Esri + CartoDB Auto-Fallback)
           Completely eliminates 403 Access Blocked errors in iframes, Netlify, mobile WebViews & Android APKs */
        function attachReliableTileLayer(map) {
            if (!map) return null;
            let activeFallbackLevel = 0;
            let tileErrorCount = 0;

            const googleStreets = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                subdomains: ['0', '1', '2', '3'],
                maxZoom: 20,
                attribution: '&copy; Google Maps • Delhi G.P.O. 110006'
            });

            const googleHybrid = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
                subdomains: ['0', '1', '2', '3'],
                maxZoom: 20,
                attribution: '&copy; Google Satellite • Delhi G.P.O. 110006'
            });

            const esriStreets = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: '&copy; Esri • Delhi G.P.O. 110006'
            });

            const cartoVoyager = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                subdomains: 'abcd',
                maxZoom: 20,
                attribution: '&copy; CARTO • Delhi G.P.O. 110006'
            });

            // Automatic silent cascade fallback if any network/firewall blocks a provider
            googleStreets.on('tileerror', () => {
                tileErrorCount++;
                if (activeFallbackLevel === 0 && tileErrorCount >= 3) {
                    activeFallbackLevel = 1;
                    tileErrorCount = 0;
                    try { if (map.hasLayer(googleStreets)) map.removeLayer(googleStreets); } catch (e) {}
                    esriStreets.addTo(map);
                }
            });

            esriStreets.on('tileerror', () => {
                tileErrorCount++;
                if (activeFallbackLevel === 1 && tileErrorCount >= 3) {
                    activeFallbackLevel = 2;
                    tileErrorCount = 0;
                    try { if (map.hasLayer(esriStreets)) map.removeLayer(esriStreets); } catch (e) {}
                    cartoVoyager.addTo(map);
                }
            });

            googleStreets.addTo(map);

            // Allow one-tap switching between Google Road, Google Satellite & Esri Street Map
            try {
                L.control.layers({
                    "Google Road Map": googleStreets,
                    "Google Satellite": googleHybrid,
                    "Esri Street Map": esriStreets
                }, null, { position: 'topright', collapsed: true }).addTo(map);
            } catch (e) {}

            // Ensure tiles fit container cleanly on mobile screens & tab switches
            setTimeout(() => {
                try { map.invalidateSize(); } catch (e) {}
            }, 250);

            return googleStreets;
        }

            const gpoLat = 28.6655, gpoLng = 77.2335;
            let maxAirKm = 0;

            let totalCombinedDailyKm = 0;
            let farthestBeat = BEATS_DATABASE[0];

            BEATS_DATABASE.forEach(b => {
                const airKm = parseFloat(b.distance) || Math.sqrt(
                    Math.pow((b.lat - gpoLat) * 111, 2) +
                    Math.pow((b.lng - gpoLng) * 111 * Math.cos(gpoLat * Math.PI / 180), 2)
                );
                const m = getBeatDistanceMetrics(b);
                const roadKm = parseFloat(m.gpoRoadKm) || 0;
                const dailyKm = parseFloat(m.totalDailyKm) || 0;
                totalCombinedDailyKm += dailyKm;
                if (airKm > maxAirKm) {
                    maxAirKm = airKm;
                    farthestBeat = b;
                }
                if (roadKm > maxRoadKm) {
                    maxRoadKm = roadKm;
                }
            });

            return {
                maxAirRadiusKm: "8.00",
                maxRoadRadiusKm: Math.max(8.0, maxRoadKm).toFixed(2),
                totalCombinedDailyKm: Math.round(totalCombinedDailyKm).toLocaleString('en-IN'),
                avgDailyPerBeatKm: (totalCombinedDailyKm / Math.max(1, BEATS_DATABASE.length)).toFixed(1),
                farthestBeatNumber: farthestBeat ? farthestBeat.beatNumber : 45,
                farthestAreaName: farthestBeat ? farthestBeat.areaName : "DCM / Sarai Rohilla"
            };
        }

        /* Live WebRTC Camera Stream Controller */
        async function startLiveCamera() {
            const videoEl = document.getElementById('lensVideoElement');
            const idleOverlay = document.getElementById('lensIdleOverlay');
            const activeControls = document.getElementById('lensActiveControls');
            const laserLine = document.getElementById('lensLaserScanLine');
            const previewImg = document.getElementById('lensPreviewImage');

            if (previewImg) previewImg.classList.add('hidden');

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                // Fallback to direct camera file input if getUserMedia is unsupported
                const fallbackInput = document.getElementById('scannerDirectCameraInput');
                if (fallbackInput) fallbackInput.click();
                return;
            }

            try {
                if (selectedCameraStream) {
                    selectedCameraStream.getTracks().forEach(t => t.stop());
                }

                // Request rear environment camera with HD resolution
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                selectedCameraStream = stream;
                isCameraActive = true;

                if (videoEl) {
                    videoEl.srcObject = stream;
                    videoEl.classList.remove('hidden');
                }
                if (idleOverlay) idleOverlay.classList.add('hidden');
                if (activeControls) activeControls.classList.remove('hidden');
                if (laserLine) laserLine.classList.remove('hidden');

            } catch (err) {
                console.warn("Live camera permission or hardware notice:", err);
                const fallbackInput = document.getElementById('scannerDirectCameraInput');
                if (fallbackInput) fallbackInput.click();
            }
        }

        function stopLiveCamera() {
            if (selectedCameraStream) {
                selectedCameraStream.getTracks().forEach(t => t.stop());
                selectedCameraStream = null;
            }
            isCameraActive = false;

            const videoEl = document.getElementById('lensVideoElement');
            const activeControls = document.getElementById('lensActiveControls');
            const laserLine = document.getElementById('lensLaserScanLine');

            if (videoEl) videoEl.classList.add('hidden');
            if (activeControls) activeControls.classList.add('hidden');
            if (laserLine) laserLine.classList.add('hidden');
        }

        function captureFromLiveStream() {
            const videoEl = document.getElementById('lensVideoElement');
            const canvas = document.getElementById('lensCanvasCapture');
            if (!videoEl || !canvas) return;

            canvas.width = videoEl.videoWidth || 1280;
            canvas.height = videoEl.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

            const capturedDataUrl = canvas.toDataURL('image/jpeg', 0.92);
            stopLiveCamera();
            displayScannedImageInViewport(capturedDataUrl);
            processOCR(capturedDataUrl);
        }

        function resetScannerView() {
            stopLiveCamera();
            const panel = document.getElementById('scannerDetectedWordsPanel');
            if (panel) panel.classList.add('hidden');
            const previewImg = document.getElementById('lensPreviewImage');
            if (previewImg) { previewImg.src = ''; previewImg.classList.add('hidden'); }
            const idleOverlay = document.getElementById('lensIdleOverlay');
            if (idleOverlay) idleOverlay.classList.remove('hidden');

        function displayScannedImageInViewport(dataUrl) {
            const previewImg = document.getElementById('lensPreviewImage');
            const idleOverlay = document.getElementById('lensIdleOverlay');
            const videoEl = document.getElementById('lensVideoElement');
            const activeControls = document.getElementById('lensActiveControls');

            if (videoEl) videoEl.classList.add('hidden');
            if (activeControls) activeControls.classList.add('hidden');
            if (idleOverlay) idleOverlay.classList.add('hidden');
            if (previewImg) {
                previewImg.src = dataUrl;
                previewImg.classList.remove('hidden');
            }

        function handleFileUpload(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            stopLiveCamera();
            const reader = new FileReader();
            reader.onload = (event) => {
                const dataUrl = event.target.result;
                displayScannedImageInViewport(dataUrl);
                processOCR(dataUrl);
            };
            reader.readAsDataURL(file);
            e.target.value = ''; // Reset input to allow re-upload
        }

        async function processOCR(dataUrl) {
            const spinner = document.getElementById('lensLoadingSpinner');
            const laserLine = document.getElementById('lensLaserScanLine');
            const progressLabel = document.getElementById('ocrProgressLabel');
            const panel = document.getElementById('scannerDetectedWordsPanel');

            if (spinner) spinner.classList.remove('hidden');
            if (laserLine) laserLine.classList.remove('hidden');
            if (panel) panel.classList.add('hidden');

            try {
                if (typeof Tesseract === 'undefined') {
                    throw new Error("Tesseract OCR engine is initializing. Please try again in a moment.");
                }

                const result = await Tesseract.recognize(
                    dataUrl,
                    'eng',
                    {
                        logger: m => {
                            if (progressLabel && m.status === 'recognizing text') {
                                progressLabel.textContent = `Scanning: ${Math.round((m.progress || 0) * 100)}%`;
                            }
                        }
                    }
                );

                if (spinner) spinner.classList.add('hidden');
                if (laserLine) laserLine.classList.add('hidden');

                const text = (result && result.data && result.data.text) ? result.data.text.trim() : '';
                if (!text) {
                    showModalNotice("OCR Complete", "No legible postal text or door numbers detected. Please ensure the address label is well-lit and clear.");
                    return;
                }

                // Render Touch-to-Search Words and Raw Extracted Text
                renderOcrDetectedWords(text);

            } catch (err) {
                if (spinner) spinner.classList.add('hidden');
                if (laserLine) laserLine.classList.add('hidden');
                showModalNotice("Scanner Notice", "Could not complete text scan: " + err.message);
            }
        }

        /* Parse OCR Text and Split Into Interactive Touch-to-Search Words & Categories */
        function renderOcrDetectedWords(rawText) {
            const panel = document.getElementById('scannerDetectedWordsPanel');
            const wordsListEl = document.getElementById('ocrWordBadgesList');
            const fullTextEl = document.getElementById('ocrFullRecognizedText');
            const searchAllBtn = document.getElementById('ocrSearchAllBtn');
            const doorGroup = document.getElementById('ocrDoorNumbersGroup');
            const doorList = document.getElementById('ocrDoorBadgesList');
            const locGroup = document.getElementById('ocrLocalitiesGroup');
            const locList = document.getElementById('ocrLocalityBadgesList');

            if (!panel || !wordsListEl || !fullTextEl) return;

            fullTextEl.textContent = rawText;

            // Split raw text into clean tokens
            const rawTokens = rawText.split(/[\s,\n\r\t|/\\-]+/)
                .map(t => t.trim().replace(/^[^a-zA-Z0-9]+|[^a-zA-Z0-9]+$/g, ''))
                .filter(Boolean);

            const uniqueTokens = Array.from(new Set(rawTokens)).filter(t => t.length >= 2);

            // Separate Door Numbers, PIN codes, and General Words
            const doorNumbers = [];
            const pinCodes = [];
            const generalWords = [];

            uniqueTokens.forEach(t => {
                if (/^\d{6}$/.test(t)) {
                    pinCodes.push(t);
                } else if (/^\d{1,5}$/.test(t)) {
                    doorNumbers.push(t);
                } else {
                    generalWords.push(t);
                }
            });

            // Detect known Old Delhi localities/streets from rawText
            const knownPhrases = [
                "Matia Mahal", "Jama Masjid", "Churiwalan", "Bazar Sita Ram", "Turkman Gate",
                "Kali Masjid", "Hauz Qazi", "Ajmeri Gate", "Kucha Pandit", "Farash Khana",
                "Lal Kuan", "Chawari Bazar", "Dharampura", "Kinari Bazar", "Cheera Khana",
                "Dareeba", "Lajpat Rai Market", "Red Fort", "Bhagirath Palace", "Chandni Chowk",
                "Town Hall", "Katra Neel", "Fatehpuri", "Gandhi Cloth Market", "Nai Sarak",
                "Maliwara", "Roshanpura", "Jogiwara", "Ballimaran", "Charkhewalan",
                "Saudagran", "Katra Baryan", "Naya Bans", "Cloth Market", "Novelty Cinema",
                "SP Mukerjee Marg", "Tilak Bazar", "Khari Baoli", "Naya Bazar", "Lahori Gate",
                "Sadar Bazar", "Pratap Market", "Rui Mandi", "Teliwara", "Pahari Dhiraj",
                "Bara Hindu Rao", "Kutub Road", "Pan Mandi", "Basti Julahan", "Idgah Road",
                "Baratooti", "Nawab Road", "Ahata Kidara", "Basti Khatikan", "Chamelian Road",
                "Kishan Ganj", "Aziz Ganj", "Nawab Ganj", "Islam Ganj", "Sarai Rohilla",
                "Kashmeri Gate", "Mori Gate", "Hamilton Road", "Ram Bazar", "Lothian Road",
                "ISBT", "Jamna Bazar", "RMS Bhawan", "Bara Bazaar", "Chabi Ganj"
            ];

            const detectedLocalities = [];
            const lowerRaw = rawText.toLowerCase();
            knownPhrases.forEach(phrase => {
                if (lowerRaw.includes(phrase.toLowerCase()) && !detectedLocalities.includes(phrase)) {
                    detectedLocalities.push(phrase);
                }
            });

            // 1. Populate Door Numbers Group
            if (doorNumbers.length > 0 && doorGroup && doorList) {
                doorList.innerHTML = doorNumbers.map(num => `
                    <button onclick="quickSearch('${num}')" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-amber-100 hover:bg-amber-600 hover:text-white text-amber-950 border border-amber-300 font-mono font-black text-xs transition-all shadow-2xs active:scale-95 cursor-pointer">
                        <span class="material-symbols-outlined text-xs">tag</span>
                        <span>Door #${num}</span>
                    </button>
                `).join('');
                doorGroup.classList.remove('hidden');
            } else if (doorGroup) {
                doorGroup.classList.add('hidden');
            }

            // 2. Populate Localities Group
            if (detectedLocalities.length > 0 && locGroup && locList) {
                locList.innerHTML = detectedLocalities.map(loc => `
                    <button onclick="quickSearch('${loc.replace(/'/g, "\\'")}')" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-emerald-100 hover:bg-emerald-700 hover:text-white text-emerald-950 border border-emerald-300 font-black text-xs transition-all shadow-2xs active:scale-95 cursor-pointer">
                        <span class="material-symbols-outlined text-xs">location_on</span>
                        <span>${loc}</span>
                    </button>
                `).join('');
                locGroup.classList.remove('hidden');
            } else if (locGroup) {
                locGroup.classList.add('hidden');
            }

            // 3. Populate All Individual Words
            if (uniqueTokens.length === 0) {
                wordsListEl.innerHTML = `<span class="text-xs text-on-surface-variant font-medium">No distinct address words extracted.</span>`;
            } else {
                wordsListEl.innerHTML = uniqueTokens.map(token => {
                    const isPin = /^\d{6}$/.test(token);
                    const isDoor = /^\d{1,5}$/.test(token);

                    let badgeStyle = "bg-surface-container-lowest hover:bg-primary hover:text-white border-outline-variant text-on-surface";
                    let icon = "touch_app";

                    if (isPin) {
                        badgeStyle = "bg-primary/10 hover:bg-primary hover:text-white text-primary border-primary/30 font-mono font-black";
                        icon = "pin";
                    } else if (isDoor) {
                        badgeStyle = "bg-amber-100 hover:bg-amber-600 hover:text-white text-amber-950 border-amber-300 font-mono font-black";
                        icon = "tag";
                    }

                    return `
                        <button onclick="quickSearch('${token.replace(/'/g, "\\'")}')" 
                                class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl border text-xs font-bold transition-all shadow-2xs active:scale-95 cursor-pointer ${badgeStyle}"

                            <span>${token}</span>

                }).join('');

            if (searchAllBtn) {

                    // Combine detected localities or top tokens for smart composite search
                    const primaryQuery = detectedLocalities.length > 0 
                        ? (doorNumbers.length > 0 ? `${doorNumbers[0]} ${detectedLocalities[0]}` : detectedLocalities[0])
                        : uniqueTokens.slice(0, 5).join(' ');
                    quickSearch(primaryQuery || rawText.slice(0, 30));
                };

            panel.classList.remove('hidden');
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

            const beat = BEATS_DATABASE.find(b => b.beatNumber === activeBeatNumber) || BEATS_DATABASE[0];

            // Accurate Google Maps & Daily Postman Tour Distance Metrics
            const distInfo = getBeatDistanceMetrics(beat);
            const distFromGpo = distInfo.gpoRoadKm;

            // Door ranges parse
            const doorRangesList = beat.doorRanges ? beat.doorRanges.split(',').map(s => s.trim()).filter(Boolean) : [];

            // Areas parse
            const areasList = Array.isArray(beat.areas) ? beat.areas : (beat.areas ? beat.areas.split(',').map(s => s.trim()).filter(Boolean) : []);

            // Dynamic Neighbors / Adjacent Beats (Geodesic 4 Closest)
            const neighbors = BEATS_DATABASE
                .filter(b => b.beatNumber !== beat.beatNumber)
                .map(b => {
                    const d = Math.sqrt(Math.pow((b.lat - beat.lat) * 111, 2) + Math.pow((b.lng - beat.lng) * 111 * Math.cos(beat.lat * Math.PI / 180), 2));
                    return { beat: b, distKm: d.toFixed(2) };
                })
                .sort((a, b) => parseFloat(a.distKm) - parseFloat(b.distKm))

        function createVerticalBorderDataUrl(side = 'left') {
            try {
                const scale = 2;
                const w = 16 * scale;
                const h = 1040 * scale;
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                if (!ctx) return '';

                ctx.clearRect(0, 0, w, h);
                ctx.save();
                ctx.translate(w / 2, h / 2);
                ctx.rotate(side === 'left' ? -Math.PI / 2 : Math.PI / 2);

                ctx.font = `900 ${6.2 * scale}px Inter, Arial, Helvetica, sans-serif`;
                ctx.fillStyle = '#af101a';
                ctx.textBaseline = 'middle';

                const text = 'BEAT MAP, DELHI G.P.O - 110006   •   BEAT MAP, DELHI G.P.O - 110006   •   BEAT MAP, DELHI G.P.O - 110006   •   BEAT MAP, DELHI G.P.O - 110006';
                const tracking = 1.2 * scale;
                const chars = Array.from(text);
                let totalWidth = 0;
                for (let i = 0; i < chars.length; i++) {
                    totalWidth += ctx.measureText(chars[i]).width + (i < chars.length - 1 ? tracking : 0);
                }

                let currentX = -totalWidth / 2;
                for (let i = 0; i < chars.length; i++) {
                    const ch = chars[i];
                    ctx.fillText(ch, currentX, 0);
                    currentX += ctx.measureText(ch).width + tracking;
                }

                ctx.restore();
                return canvas.toDataURL('image/png');
            } catch (e) {
                return '';
            }
        }

        /* High-Definition SVG to PNG Converter for html2canvas with timeout guard */
        function rasterizeSvgNodeToImage(svgEl) {
            return new Promise((resolve) => {
                const safetyTimeout = setTimeout(() => resolve(false), 900);
                try {
                    const width = 345;
                    const height = 490;
                    const clonedSvg = svgEl.cloneNode(true);
                    clonedSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
                    clonedSvg.setAttribute('width', width);
                    clonedSvg.setAttribute('height', height);

                    const xml = new XMLSerializer().serializeToString(clonedSvg);
                    const svgBlob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
                    const URL = window.URL || window.webkitURL || window;
                    const blobUrl = URL.createObjectURL(svgBlob);

                    const img = new Image();
                    img.onload = () => {
                        clearTimeout(safetyTimeout);
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = width * 2;
                            canvas.height = height * 2;
                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = '#f4f7f2';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            URL.revokeObjectURL(blobUrl);

                            const pngImg = document.createElement('img');
                            pngImg.src = canvas.toDataURL('image/png', 0.95);
                            pngImg.style.width = '100%';
                            pngImg.style.height = '100%';
                            pngImg.style.display = 'block';
                            pngImg.style.objectFit = 'contain';

                            const finalizeSwap = () => {
                                if (svgEl.parentNode) {
                                    svgEl.parentNode.replaceChild(pngImg, svgEl);
                                }
                                resolve(true);
                            };

                            if (typeof pngImg.decode === 'function') {
                                pngImg.decode().then(finalizeSwap).catch(finalizeSwap);
                            } else {
                                pngImg.onload = finalizeSwap;
                                pngImg.onerror = finalizeSwap;
                            }
                        } catch (e) {
                            URL.revokeObjectURL(blobUrl);
                            resolve(false);
                        }
                    };
                    img.onerror = () => {
                        clearTimeout(safetyTimeout);
                        URL.revokeObjectURL(blobUrl);
                        resolve(false);
                    };
                    img.src = blobUrl;
                } catch (err) {
                    clearTimeout(safetyTimeout);
                    resolve(false);
                }
            });
        }

        /* Dedicated Mobile PDF Delivery Engine (Bypasses Android DownloadManager Blob URL failures) */
        async function deliverPdfToUser(pdfBlob, filename, beat) {
            const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
            let httpsUrl = null;
            let blobUrl = null;

            // 1. Upload to Supabase Storage to get an authentic HTTPS URL for Android DownloadManager
            const client = getSupabaseClient();
            if (client && client.storage) {
                try {
                    const storagePath = `beat_sheets/${filename}`;
                    const { error: uploadErr } = await client.storage
                        .from('Beat Map of Delhi G.P.O - 110006')
                        .upload(storagePath, pdfBlob, {
                            contentType: 'application/pdf',
                            upsert: true
                        });

                    if (!uploadErr) {
                        const { data: urlData } = client.storage
                            .from('Beat Map of Delhi G.P.O - 110006')
                            .getPublicUrl(storagePath);

                        if (urlData && urlData.publicUrl) {
                            httpsUrl = `${urlData.publicUrl}?t=${Date.now()}`;
                        }
                    } else {
                        console.debug("Supabase PDF storage notice:", uploadErr.message);
                    }
                } catch (storageException) {
                    console.debug("Supabase upload exception:", storageException);
                }
            }

            // 2. Direct Download Execution
            if (httpsUrl) {
                // Genuine HTTPS URI: Android DownloadManager and APK webviews download this cleanly without blob errors
                try {
                    const dlLink = document.createElement('a');
                    dlLink.href = httpsUrl;
                    dlLink.download = filename;
                    dlLink.target = '_blank';
                    dlLink.rel = 'noopener noreferrer';
                    document.body.appendChild(dlLink);
                    dlLink.click();
                    setTimeout(() => {
                        if (document.body.contains(dlLink)) document.body.removeChild(dlLink);
                    }, 500);
                } catch (dlErr) {
                    console.warn("Direct download link notice:", dlErr);
                }

                // Display interactive confirmation modal with direct view and redownload options
                showPdfReadyModal(httpsUrl, filename, beat, true);
                return;
            }

            // 3. Fallback when offline or storage is unreachable
            // Mobile Web Share API: Saves PDF file directly to device without hitting Android DownloadManager
            if (isMobile && navigator.canShare) {
                try {
                    const pdfFile = new File([pdfBlob], filename, { type: 'application/pdf' });
                    if (navigator.canShare({ files: [pdfFile] })) {
                        closeCustomModal();
                        await navigator.share({
                            files: [pdfFile],
                            title: `Beat #${beat.beatNumber} Sheet`,
                            text: `Delhi G.P.O. Official Beat #${beat.beatNumber} Sheet (${beat.areaName})`
                        });
                        return;
                    }
                } catch (shareErr) {
                    if (shareErr.name === 'AbortError') {
                        closeCustomModal();
                        return;
                    }
                }
            }

            // Fallback to local blob modal if Web Share / HTTPS are not accessible
            blobUrl = URL.createObjectURL(pdfBlob);
            if (!isMobile) {
                try {
                    const fallbackLink = document.createElement('a');
                    fallbackLink.href = blobUrl;
                    fallbackLink.download = filename;
                    document.body.appendChild(fallbackLink);
                    fallbackLink.click();
                    setTimeout(() => {
                        if (document.body.contains(fallbackLink)) document.body.removeChild(fallbackLink);
                    }, 300);
                } catch (e) {}
            }

            showPdfReadyModal(blobUrl, filename, beat, false);
        }

        // Pixel-exact A4 auto-trim & symmetrical centering (guarantees Left === Right & Top === Bottom margins)
        function centerCanvasOnA4Frame(rawCanvas, scaleFactor = 2) {
            try {
                const rawW = rawCanvas.width;
                const rawH = rawCanvas.height;
                const rawCtx = rawCanvas.getContext('2d', { willReadFrequently: true });
                if (!rawCtx || rawW < 100 || rawH < 100) return rawCanvas;

                const imgData = rawCtx.getImageData(0, 0, rawW, rawH).data;
                let minX = rawW, minY = rawH, maxX = -1, maxY = -1;

                // Scan rendered pixels to locate the exact outer red-bordered sheet bounds
                for (let y = 0; y < rawH; y++) {
                    const rowOffset = y * rawW * 4;
                    for (let x = 0; x < rawW; x++) {
                        const i = rowOffset + x * 4;
                        if (imgData[i + 3] > 20 && (imgData[i] < 246 || imgData[i + 1] < 246 || imgData[i + 2] < 246)) {
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    }
                }

                if (maxX <= minX || maxY <= minY) return rawCanvas;

                const srcW = maxX - minX + 1;
                const srcH = maxY - minY + 1;
                if (srcW < 150 || srcH < 150) return rawCanvas;

                // Exact A4 portrait ratio (210mm x 297mm -> 794 x 1123)
                const outW = Math.round(794 * scaleFactor);
                const outH = Math.round(1123 * scaleFactor);
                const outCanvas = document.createElement('canvas');
                outCanvas.width = outW;
                outCanvas.height = outH;

                const outCtx = outCanvas.getContext('2d');
                outCtx.fillStyle = '#ffffff';
                outCtx.fillRect(0, 0, outW, outH);

                // Symmetrical safe margins on all 4 sides (Left = Right, Top = Bottom)
                const padX = Math.round(outW * 0.022);
                const padY = Math.round(outH * 0.020);
                const availW = outW - padX * 2;
                const availH = outH - padY * 2;

                const fitScale = Math.min(availW / srcW, availH / srcH);
                const drawW = Math.round(srcW * fitScale);
                const drawH = Math.round(srcH * fitScale);
                const drawX = Math.round((outW - drawW) / 2);
                const drawY = Math.round((outH - drawH) / 2);

                outCtx.imageSmoothingEnabled = true;
                outCtx.imageSmoothingQuality = 'high';
                outCtx.drawImage(rawCanvas, minX, minY, srcW, srcH, drawX, drawY, drawW, drawH);

                return outCanvas;
            } catch (e) {
                return rawCanvas;
            }
        }

        async function renderBeatSheetCanvas(beatNumber) {

            // Use the exact rendered two-column sheet structure matching the uploaded reference PDF
            const rawTwoColHtml = renderOfficialA4SheetHTML(beat, false);

            const sheetNode = tempDiv.firstElementChild;
            if (sheetNode) {

                    rightCol.style.maxWidth = '42%';
                }
                renderWrapper.appendChild(sheetNode);
            } else {
                renderWrapper.innerHTML = rawTwoColHtml;
            }

            renderHost.appendChild(renderWrapper);
            document.body.appendChild(renderHost);

            try {
                // Convert SVG maps to crisp PNGs so every road, label, pin, and distance card renders cleanly
                const svgNodes = Array.from(renderWrapper.querySelectorAll('svg'));
                for (const svgNode of svgNodes) {
                    await rasterizeSvgNodeToImage(svgNode);
                }

                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                await new Promise(r => setTimeout(r, 140));

                const measuredH = Math.max(760, Math.ceil(renderWrapper.getBoundingClientRect().height + 28));
                renderHost.style.height = `${measuredH}px`;

                const renderOnceWithOptions = async (opts) => {
                    if (typeof html2canvas !== 'undefined') {
                        return await html2canvas(renderHost, opts);
                    }
                    if (typeof html2pdf !== 'undefined') {
                        return await html2pdf().set({ html2canvas: opts }).from(renderHost).toCanvas().get('canvas');
                    }
                    return null;
                };

                const scaleFactor = isMobile ? 1.5 : 2.0;
                const captureOpts = {
                    scale: scaleFactor,
                    useCORS: true,
                    allowTaint: true,
                    logging: false,
                    backgroundColor: '#ffffff',
                    scrollX: 0,
                    scrollY: 0,
                    x: 0,
                    y: 0,
                    width: 1060,
                    height: measuredH,
                    windowWidth: 1200,
                    windowHeight: measuredH + 120,
                    ignoreElements: (el) => {
                        return Boolean(el && el.tagName === 'IMG' && el.complete === false);
                    },
                    onclone: (clonedDoc) => {
                        clonedDoc.documentElement.style.setProperty('width', '1200px', 'important');
                        clonedDoc.documentElement.style.setProperty('max-width', 'none', 'important');
                        clonedDoc.documentElement.style.setProperty('overflow', 'visible', 'important');
                        clonedDoc.documentElement.style.setProperty('margin', '0', 'important');
                        clonedDoc.documentElement.style.setProperty('padding', '0', 'important');

                        clonedDoc.body.style.setProperty('display', 'block', 'important');
                        clonedDoc.body.style.setProperty('position', 'static', 'important');
                        clonedDoc.body.style.setProperty('width', '1200px', 'important');
                        clonedDoc.body.style.setProperty('max-width', 'none', 'important');
                        clonedDoc.body.style.setProperty('overflow', 'visible', 'important');
                        clonedDoc.body.style.setProperty('margin', '0', 'important');
                        clonedDoc.body.style.setProperty('padding', '0', 'important');
                        clonedDoc.body.style.setProperty('background', '#ffffff', 'important');

                        Array.from(clonedDoc.body.children).forEach(child => {
                            if (child.id !== 'a4ExportRenderHost') {
                                child.style.setProperty('display', 'none', 'important');
                            }
                        });

                        const clonedHost = clonedDoc.getElementById('a4ExportRenderHost');
                        if (clonedHost) {
                            clonedHost.style.position = 'absolute';
                            clonedHost.style.top = '0px';
                            clonedHost.style.left = '0px';
                            clonedHost.style.width = '1060px';
                            clonedHost.style.height = `${measuredH}px`;
                            clonedHost.style.opacity = '1';
                            clonedHost.style.overflow = 'visible';
                        }
                    }
                };

                let rawCanvas = await renderOnceWithOptions(captureOpts);

                if (!rawCanvas || isCanvasMostlyBlank(rawCanvas)) {
                    rawCanvas = await renderOnceWithOptions({
                        scale: isMobile ? 1.3 : 1.5,
                        useCORS: true,
                        allowTaint: true,
                        foreignObjectRendering: false,
                        logging: false,
                        backgroundColor: '#ffffff',
                        width: 1060,
                        height: measuredH,
                        windowWidth: 1200,
                        windowHeight: measuredH + 120
                    });
                }

                if (!rawCanvas || isCanvasMostlyBlank(rawCanvas)) {
                    throw new Error("Rendered canvas came out empty");
                }

                const canvas = centerCanvasOnA4Frame(rawCanvas, scaleFactor);
                return { canvas, beat };
            } finally {
                if (document.body.contains(renderHost)) {
                    document.body.removeChild(renderHost);
                }
            }
        }

        function saveFileCrossPlatform(blob, filename, mimeType, titleText) {
            const isAndroidWebView = /Android/i.test(navigator.userAgent) && (/wv\)/i.test(navigator.userAgent) || !window.chrome);
            const url = URL.createObjectURL(blob);

            // Standard direct download works on PC Chrome/Edge/Firefox, Android Chrome, and iOS Safari
            try {
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                link.rel = 'noopener noreferrer';
                document.body.appendChild(link);
                link.click();
                setTimeout(() => {
                    if (document.body.contains(link)) document.body.removeChild(link);
                }, 500);
            } catch (e) {}

            // On Android APK WebViews where <a download> blob URLs are ignored, also offer native Share/Save fallback
            if (isAndroidWebView && navigator.canShare) {
                try {
                    const fileObj = new File([blob], filename, { type: mimeType });
                    if (navigator.canShare({ files: [fileObj] })) {
                        navigator.share({ files: [fileObj], title: titleText }).catch(() => {});
                    }
                } catch (e) {}
            }

            setTimeout(() => {
                try { URL.revokeObjectURL(url); } catch (e) {}
            }, 60000);
        }

                                <input id="tariffWeight" type="number" value="50" min="1" max="35000" oninput="calculatePostageTariff()" class="w-full p-2.5 rounded-xl bg-surface-container-low border border-outline-variant font-mono font-bold" />
                            </div>
                            <div>
                                <label class="font-bold text-on-surface-variant block mb-1">Distance Zone</label>
                                <select id="tariffZone" onchange="calculatePostageTariff()" class="w-full p-2.5 rounded-xl bg-surface-container-low border border-outline-variant font-bold">
                                    <option value="local">Local (Delhi NCR)</option>
                                    <option value="200">Up to 200 km</option>

                                    <option value="2000">Above 1000 km</option>

        function calculatePostageTariff() {
            const service = document.getElementById('tariffService')?.value || 'speed';
            const weight = Math.max(1, parseInt(document.getElementById('tariffWeight')?.value || '50', 10));
            const zone = document.getElementById('tariffZone')?.value || 'local';
            let base = 15;
            if (service === 'speed') {
                if (weight <= 50) base = zone === 'local' ? 15 : 35;
                else if (weight <= 200) base = zone === 'local' ? 25 : (zone === '200' ? 35 : (zone === '1000' ? 40 : 60));
                else if (weight <= 500) base = zone === 'local' ? 30 : (zone === '200' ? 50 : (zone === '1000' ? 60 : 80));
                else base = (zone === 'local' ? 30 : 60) + Math.ceil((weight - 500) / 500) * (zone === 'local' ? 10 : 30);
                base = Math.round(base * 1.18);
            } else if (service === 'reg') {
                base = 17 + Math.ceil(weight / 20) * 5;
            } else {
                base = 17 + 19 + Math.max(0, Math.ceil((weight - 500) / 500)) * 16;
            }
            const out = document.getElementById('tariffAmountDisplay');
            if (out) out.textContent = `₹ ${base}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            // 1. Always enforce English ('en') as the default language on every fresh load
            ACTIVE_APP_LANGUAGE = 'en';
            try {
                localStorage.setItem('delhi_gpo_selected_lang', 'en');
                clearGoogleTranslateCookies();
            } catch (e) {}
            document.documentElement.lang = 'en';
            updateLanguageBadges('en');
            protectIconsFromTranslation(document);

            // 2. Pre-warm all 50 beats full-text search index immediately for 0ms search speed
            ensureBeatSearchIndices();

            // 3. Auto-protect icons & keep modals synchronized with selected language
            const modalObserverTarget = document.getElementById('modalContainer');
            if (modalObserverTarget && typeof MutationObserver !== 'undefined') {
                const modalObs = new MutationObserver(() => {
                    if (!modalObserverTarget.classList.contains('hidden')) {
                        protectIconsFromTranslation(modalObserverTarget);
                        const activeLang = getCurrentLanguage();
                        if (activeLang !== 'en' && !isGoogleTranslateReady()) {
                            applyCurrentLanguage(modalObserverTarget);
                        }
                    }
                });
                modalObs.observe(modalObserverTarget, { childList: true, subtree: false });
            }

            // 4. Render Home immediately for instant First Paint, then run cloud sync in background
            try {
                navigateTo('home');
            } catch (renderErr) {
                console.error("Initial render recovery:", renderErr);
                const appEl = document.getElementById('appContent');
                if (appEl) appEl.innerHTML = renderHomePage();
            }

            setTimeout(() => {
                try {
                    initRealtimeCloudListeners();
                    syncSettingsFromSupabase();
                    syncBeatsFromSupabase();
                } catch (bgErr) {}
            }, 300);

            setInterval(() => {
                if (document.visibilityState === 'visible') {
                    syncSettingsFromSupabase();
                }
            }, 15000);

            setInterval(() => {
                if (document.visibilityState === 'visible') {
                    syncBeatsFromSupabase();
                }
            }, 35000);

            // Instant sync whenever user switches to the app or unlocks their mobile screen
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    syncSettingsFromSupabase();
                    syncBeatsFromSupabase();
                }
            });
            window.addEventListener('focus', () => {
                syncSettingsFromSupabase();
                syncBeatsFromSupabase();
            });
        });

        // Immediate fallback render if DOM is already ready in preview iframe
        if (document.readyState !== 'loading') {
            try {
                ACTIVE_APP_LANGUAGE = 'en';
                ensureBeatSearchIndices();
                const appEl = document.getElementById('appContent');
                if (appEl && !appEl.innerHTML.trim()) {
                    navigateTo('home');
                }
            } catch (e) {}
        }
