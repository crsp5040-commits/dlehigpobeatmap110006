            svg.map-sketch-svg {
                height: 165mm !important;
                min-height: 165mm !important;

            }
        }

        /* Google Translate clean bar overrides */
        .goog-te-banner-frame.skiptranslate, .goog-te-banner-frame { display: none !important; }
        body { top: 0px !important; }
        .goog-tooltip { display: none !important; }
        .goog-tooltip:hover { display: none !important; }
        .goog-text-highlight { background-color: transparent !important; border: none !important; box-shadow: none !important; }
        #google_translate_element { display: none !important; }
        .skiptranslate > iframe { height: 0 !important; border: 0 !important; }

        @keyframes scanLaser {
            0% { top: 6%; opacity: 0.8; }
            50% { top: 90%; opacity: 1; }
            100% { top: 6%; opacity: 0.8; }
        }
        .scan-laser-line {
            position: absolute;
            left: 5%;
            width: 90%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #fdc003, #af101a, #fdc003, transparent);
            box-shadow: 0 0 15px #fdc003, 0 0 8px #af101a;
            animation: scanLaser 2.2s infinite ease-in-out;
            z-index: 20;
        }

        .lens-corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: #fdc003;
            z-index: 25;
        }
        .lens-tl { top: 12px; left: 12px; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 8px; }
        .lens-tr { top: 12px; right: 12px; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 8px; }
        .lens-bl { bottom: 12px; left: 12px; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 8px; }
        .lens-br { bottom: 12px; right: 12px; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 8px; }

        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(175, 16, 26, 0.7); transform: scale(1); }
            50% { box-shadow: 0 0 0 12px rgba(175, 16, 26, 0); transform: scale(1.08); }
        }
        .mic-recording {
            animation: micPulse 1.4s infinite ease-in-out;
            background-color: #af101a !important;
            color: #ffffff !important;
        }

        #leafletMapContainer {
            height: 360px;
            width: 100%;

        #lookupLeafletMap {
            height: 380px;

            }
            #lookupLeafletMap {
                height: 260px !important;
                border-radius: 0.75rem !important;
            }
        }
    </style>

    <script>
        /* ==========================================================================
           SANDBOX & CANVAS WEBSOCKET SAFETY GUARD
           ========================================================================== */
        window.onerror = function(message, source, lineno, colno, error) {
            const msg = String(message || (error && error.message) || '');
            if (msg.includes('WebSocket') || msg.includes('SecurityError') || msg.includes('Canvas')) {
                return true; // Suppress browser console/global error reporting
            }
            return false;
        };

        window.addEventListener('error', (event) => {
            const msg = String(event.message || (event.error && event.error.message) || '');
            if (msg.includes('WebSocket') || msg.includes('SecurityError') || msg.includes('Canvas')) {
                event.preventDefault();
                event.stopImmediatePropagation();
            }
        }, true);

        window.addEventListener('unhandledrejection', (event) => {
            const reason = event.reason;
            const msg = String((reason && (reason.message || reason.toString())) || '');
            if (msg.includes('WebSocket') || msg.includes('SecurityError') || msg.includes('Canvas')) {
                event.preventDefault();
                event.stopImmediatePropagation();
            }
        }, true);

        function areWebSocketsAllowed() {
            try {
                // 1. Check if running inside Canvas or a sandboxed iframe
                if (window.self !== window.top) {
                    return false;
                }
                // 2. Check if origin is sandboxed / opaque
                if (typeof window.location !== 'undefined' && window.location.origin === 'null') {
                    return false;
                }
                // 3. Check if WebSocket API exists
                if (typeof WebSocket === 'undefined') {
                    return false;
                }
                return true;
            } catch (e) {
                // Cross-origin iframe security restrictions mean we are in Canvas / sandboxed preview
                return false;
            }
        }

        /* ==========================================================================
           SUPABASE CONFIGURATION & CLIENT INITIALIZATION
           ========================================================================== */
        const SUPABASE_CONFIG = {
            url: "https://gtppvtyorvkmcohbdfui.supabase.co",
            publishableKey: "sb_publishable_DKBa_G6YUbsVoNDvQ9CkYA_qggBZToB",
            projectName: "delhigpobeatmap",
            projectId: "gtppvtyorvkmcohbdfui"
        };

        let supabaseClient = null;
        function getSupabaseClient() {
            if (!supabaseClient && window.supabase && typeof window.supabase.createClient === 'function') {
                try {
                    supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.publishableKey);
                } catch (e) {
                    console.warn("Supabase initialization note:", e);
                }
            }
            return supabaseClient;
        }

        // Initialize immediately
        getSupabaseClient();

        // Check active Supabase admin session on startup
        let isAdminLoggedIn = false;
        try {
            if (localStorage.getItem('delhi_gpo_admin_logged_in') === 'true' || sessionStorage.getItem('delhi_gpo_admin_logged_in') === 'true') {
                isAdminLoggedIn = true;
            }
        } catch(e) {}

        async function checkSupabaseAdminSession() {
            const client = getSupabaseClient();
            if (!client || !client.auth) return;
            try {
                const { data } = await client.auth.getSession();
                if (data && data.session && data.session.user) {
                    isAdminLoggedIn = true;
                    try {
                        localStorage.setItem('delhi_gpo_admin_logged_in', 'true');
                    } catch(e) {}
                    console.log("Active Supabase Admin Session:", data.session.user.email);
                }
            } catch (e) {
                console.debug("Session check:", e);
            }
        }

        /* ==========================================================================
           PERMANENT STORAGE KEYS & DATA ENGINE (VERSION 5 MASTER ROSTER)
           ========================================================================== */
        const STORAGE_KEYS = {
            BEATS: 'delhi_gpo_beats_master_v5',
            SETTINGS: 'delhi_gpo_admin_settings_v5',
            NOTES: 'delhi_gpo_beat_notes_v5',
            SEARCH_HISTORY: 'delhi_gpo_recent_searches_10m'
        };

        let APP_SETTINGS = {
            showPhoneNumbers: true,
            directGpsDoors: false,
            gpoDistanceOnly: true,
            appLocked: false,
            lockNotice: "Delhi G.P.O. Portal is temporarily in administrative maintenance mode. Please check back shortly.",
            individualPhoneLocks: {}
        };

        try {
            const savedSettings = localStorage.getItem(STORAGE_KEYS.SETTINGS);
            if (savedSettings) APP_SETTINGS = { ...APP_SETTINGS, ...JSON.parse(savedSettings) };
            if (!APP_SETTINGS.individualPhoneLocks) APP_SETTINGS.individualPhoneLocks = {};
        } catch(e) {}

        function saveAppSettings() {
            try {
                localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(APP_SETTINGS));
            } catch(e) {}
        }

        // Unified lock/unlock state evaluator supporting Individual Beat Lock/Unlock
        function isPhoneDataUnlocked(beatNumber = null) {
            try {
                // If a specific beat number is provided, check individual beat privacy lock first
                if (beatNumber != null) {
                    const bNum = parseInt(beatNumber, 10);
                    if (APP_SETTINGS.individualPhoneLocks && typeof APP_SETTINGS.individualPhoneLocks[bNum] !== 'undefined') {
                        return Boolean(APP_SETTINGS.individualPhoneLocks[bNum]);
                    }
                }
                return (APP_SETTINGS.showPhoneNumbers === true || APP_SETTINGS.showPhoneNumbers === 'true');
            } catch(e) {
                return Boolean(APP_SETTINGS.showPhoneNumbers);
            }
        }

        // Toggle individual beat lock/unlock in Admin Panel
        function toggleIndividualBeatPhoneLock(beatNumber) {
            if (!APP_SETTINGS.individualPhoneLocks) {
                APP_SETTINGS.individualPhoneLocks = {};
            }
            const bNum = parseInt(beatNumber, 10);
            const currentStatus = isPhoneDataUnlocked(bNum);
            APP_SETTINGS.individualPhoneLocks[bNum] = !currentStatus;
            saveAppSettings();
            pushSettingsToSupabase(false);
            
            filterAdminBeatsTable();
            showModalNotice("Beat Setting Updated", `Beat #${bNum} contact is now <strong>${!currentStatus ? 'UNLOCKED (Visible to users)' : 'LOCKED (Protected)'}</strong>. Updated in real-time across all user devices!`);
        }

        // Bulk Unlock/Lock All Beats Helper for Admin
        function setAllBeatsPhoneLock(unlocked) {
            APP_SETTINGS.showPhoneNumbers = unlocked;
            if (!APP_SETTINGS.individualPhoneLocks) {
                APP_SETTINGS.individualPhoneLocks = {};
            }
            BEATS_DATABASE.forEach(b => {
                APP_SETTINGS.individualPhoneLocks[b.beatNumber] = unlocked;
            });
            saveAppSettings();
            pushSettingsToSupabase(true);
            filterAdminBeatsTable();
            navigateTo(currentTab);
        }

        /* ==========================================================================
           MULTI-DEVICE SUPABASE REAL-TIME CLOUD CONTROLS ENGINE
           Instant (<50ms) Broadcast across all connected devices, APKs & browsers.
           When Admin changes any lock/unlock setting on Device A, ALL devices B, C, D
           update their UI and data automatically without manual refresh!
           ========================================================================== */
        let realtimeSyncChannel = null;
        let isSyncingSettings = false;
        let isSyncingBeats = false;

        function refreshActiveScreenSilent() {
            const scrollY = window.scrollY;
            const appContainer = document.getElementById('appContent');
            if (!appContainer) return;

            // If global lock state is enabled and user is not admin
            if (APP_SETTINGS.appLocked && !isAdminLoggedIn && currentTab !== 'admin') {
                appContainer.innerHTML = renderAppLockedScreen();
                return;
            }

            switch (currentTab) {
                case 'home':
                    appContainer.innerHTML = renderHomePage();
                    break;
                case 'beats':
                    appContainer.innerHTML = renderBeatsPage();
                    break;
                case 'beatDetails':
                    if (activeBeatDetails) {
                        activeBeatDetails = BEATS_DATABASE.find(b => b.beatNumber === activeBeatDetails.beatNumber) || activeBeatDetails;
                    }
                    appContainer.innerHTML = renderBeatDetailsPage(activeBeatDetails);
                    setTimeout(() => initBeatMap(activeBeatDetails), 60);
                    break;
                case 'postalLookup':
                    if (activeBeatDetails) {
                        activeBeatDetails = BEATS_DATABASE.find(b => b.beatNumber === activeBeatDetails.beatNumber) || activeBeatDetails;
                    }
                    appContainer.innerHTML = renderPostalLookupPage(activeBeatDetails);
                    setTimeout(() => initLookupMap(), 60);
                    break;
                case 'admin':
                    if (isAdminLoggedIn) {
                        appContainer.innerHTML = renderAdminDashboardPage();
                    }
                    break;
            }
            applyCurrentLanguage(document.body);
            window.scrollTo({ top: scrollY, behavior: 'instant' });
        }

        function broadcastBeatsChange() {
            if (realtimeSyncChannel) {
                try {
                    realtimeSyncChannel.send({
                        type: 'broadcast',
                        event: 'beat_directory_change',
                        payload: BEATS_DATABASE
                    });
                } catch(e) {
                    console.debug("Beat directory broadcast send:", e);
                }
            }
        }

        function broadcastNotesChange() {
            if (realtimeSyncChannel) {
                try {
                    realtimeSyncChannel.send({
                        type: 'broadcast',
                        event: 'beat_notes_change',
                        payload: BEAT_DELIVERY_NOTES
                    });
                } catch(e) {
                    console.debug("Beat notes broadcast send:", e);
                }
            }
        }

        async function syncSettingsFromSupabase() {
            if (isSyncingSettings) return;
            const client = getSupabaseClient();
            if (!client) return;
            try {
                isSyncingSettings = true;
                const { data, error } = await client
                    .from('app_settings')
                    .select('value')
                    .eq('key', 'global_config')
                    .single();

                if (data && data.value && !error) {
                    const prevShowPhone = APP_SETTINGS.showPhoneNumbers;
                    const prevLocked = APP_SETTINGS.appLocked;
                    
                    APP_SETTINGS = {
                        ...APP_SETTINGS,
                        ...data.value
                    };
                    saveAppSettings();

                    // If phone unlock or app locked status changed in cloud, auto re-render screen immediately
                    if (prevShowPhone !== APP_SETTINGS.showPhoneNumbers || prevLocked !== APP_SETTINGS.appLocked) {
                        refreshActiveScreenSilent();
                    }
                }
            } catch (err) {
                console.debug("Cloud settings sync note:", err.message);
            } finally {
                isSyncingSettings = false;
            }
        }

        async function pushSettingsToSupabase(notify = false) {
            saveAppSettings();
            const client = getSupabaseClient();

            // 1. Instant Peer-to-Peer Cloud Broadcast (<30ms to all live connected APKs/devices)
            if (realtimeSyncChannel) {
                try {
                    realtimeSyncChannel.send({
                        type: 'broadcast',
                        event: 'settings_change',
                        payload: APP_SETTINGS
                    });
                } catch(e) {
                    console.debug("Realtime broadcast send note:", e);
                }
            }

            // 2. Persist to Supabase Database for new incoming users & offline syncing
            if (!client) {
                if (notify) showModalNotice("Saved Locally", "Settings saved in device storage.");
                return;
            }
            try {
                const { error } = await client
                    .from('app_settings')
                    .upsert({
                        key: 'global_config',
                        value: APP_SETTINGS,
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'key' });

                if (error) {
                    console.warn("Settings push notice:", error.message);
                } else if (notify) {
                    showModalNotice("Broadcast Live", "Master setting updated & broadcasted in real-time across all connected devices and APKs!");
                }
            } catch (err) {
                console.warn("Settings push error:", err);
            }
        }

        // Real-Time Supabase WebSocket Channel Listener for Immediate Multi-Device Push
        function initRealtimeCloudListeners() {
            // Guard against Canvas sandbox WebSocket restrictions
            if (!areWebSocketsAllowed()) {
                console.info("⚡ Canvas / Sandboxed preview detected: WebSockets are restricted. Using high-speed HTTP polling fallback.");
                return;
            }

            const client = getSupabaseClient();
            if (!client || typeof client.channel !== 'function') return;

            try {
                if (realtimeSyncChannel) {
                    try { client.removeChannel(realtimeSyncChannel); } catch(e) {}
                }

                realtimeSyncChannel = client.channel('delhi_gpo_realtime_hub', {
                    config: { broadcast: { ack: false } }
                });

                // Listen for instantaneous broadcast signals from any Admin device
                realtimeSyncChannel
                    .on('broadcast', { event: 'settings_change' }, payload => {
                        if (payload && payload.payload) {
                            console.log("⚡ Instant broadcast received from Admin device (settings):", payload.payload);
                            APP_SETTINGS = { ...APP_SETTINGS, ...payload.payload };
                            saveAppSettings();
                            refreshActiveScreenSilent();
                        }
                    })
                    .on('broadcast', { event: 'beat_directory_change' }, payload => {
                        if (payload && Array.isArray(payload.payload) && payload.payload.length > 0) {
                            console.log("⚡ Instant broadcast received from Admin device (beats):", payload.payload.length);
                            BEATS_DATABASE = payload.payload;
                            BEATS_DATABASE.sort((a, b) => a.beatNumber - b.beatNumber);
                            try { localStorage.setItem(STORAGE_KEYS.BEATS, JSON.stringify(BEATS_DATABASE)); } catch(e) {}
                            window._beatIndicesCached = false;
                            ensureBeatSearchIndices();
                            refreshActiveScreenSilent();
                        }
                    })
                    .on('broadcast', { event: 'beat_notes_change' }, payload => {
                        if (payload && payload.payload) {
                            console.log("⚡ Instant broadcast received from Admin device (notes):", payload.payload);
                            BEAT_DELIVERY_NOTES = { ...BEAT_DELIVERY_NOTES, ...payload.payload };
                            try { localStorage.setItem(STORAGE_KEYS.NOTES, JSON.stringify(BEAT_DELIVERY_NOTES)); } catch(e) {}
                            refreshActiveScreenSilent();
                        }
                    })
                    // Listen for direct Postgres table upserts
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, payload => {
                        if (payload.new && payload.new.key === 'global_config' && payload.new.value) {
                            console.log("⚡ Real-time Postgres settings change received:", payload.new.value);
                            APP_SETTINGS = { ...APP_SETTINGS, ...payload.new.value };
                            saveAppSettings();
                            refreshActiveScreenSilent();
                        }
                    })
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'beats' }, () => {
                        console.log("⚡ Real-time beat directory update received from cloud.");
                        syncBeatsFromSupabase().then(() => {
                            refreshActiveScreenSilent();
                        });
                    })
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'beat_notes' }, payload => {
                        if (payload.new && payload.new.beat_number) {
                            BEAT_DELIVERY_NOTES[payload.new.beat_number] = {
                                text: payload.new.note,
                                updatedAt: new Date().toLocaleString('en-IN')
                            };
                            try { localStorage.setItem(STORAGE_KEYS.NOTES, JSON.stringify(BEAT_DELIVERY_NOTES)); } catch(e) {}
                            refreshActiveScreenSilent();
                        }
                    })
                    .subscribe((status, err) => {
                        if (err) console.debug("Realtime channel note:", status);
                    });
            } catch (err) {
                console.debug("Realtime subscription initialization:", err);
            }
        }

        function toggleAppSetting(key) {
            if (typeof APP_SETTINGS[key] !== 'undefined') {
                APP_SETTINGS[key] = !APP_SETTINGS[key];
                saveAppSettings();
                pushSettingsToSupabase(false);
                
                const statusName = key === 'showPhoneNumbers' 
                    ? (APP_SETTINGS.showPhoneNumbers ? "UNLOCKED (Full Data Visible)" : "LOCKED (Data Protected)")
                    : (APP_SETTINGS[key] ? "ENABLED" : "DISABLED");
                
                showModalNotice("Setting Updated", `<strong>${key}</strong> is now set to <strong>${statusName}</strong>. All connected devices and APKs are updated automatically.`);
                navigateTo(currentTab, activeBeatDetails);
            }
        }

        function toggleGlobalAppLock() {
            APP_SETTINGS.appLocked = !APP_SETTINGS.appLocked;
            saveAppSettings();
            pushSettingsToSupabase(true);
            navigateTo(currentTab, activeBeatDetails);
        }

        function getCurrentLanguage() {
            try {
                return localStorage.getItem('delhi_gpo_selected_lang') || 'en';
            } catch (e) {
                return 'en';
            }
        }

        function applyCurrentLanguage(root = document.body) {
            const lang = getCurrentLanguage();
            if (!root) return;
            const elements = root.querySelectorAll('[data-i18n]');
            elements.forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (lang === 'en') {
                    el.textContent = key;
                } else if (I18N_TRANSLATIONS[lang] && I18N_TRANSLATIONS[lang][key]) {
                    el.textContent = I18N_TRANSLATIONS[lang][key];
                }
            });
        }

        function openExternalLink(url) {
            if (!url) return;
            try {
                const win = window.open(url, '_blank', 'noopener,noreferrer');
                if (!win || win.closed || typeof win.closed === 'undefined') {
                    const a = document.createElement('a');
                    a.href = url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        if (document.body.contains(a)) {
                            document.body.removeChild(a);
                        }
                    }, 300);
                }
            } catch (err) {
                try {
                    window.location.href = url;
                } catch (e) {
                    console.warn("External link error:", e);
                }
            }
        }

        function resolveOutsidePostalLocation(rawQuery) {
            if (!rawQuery) return null;
            const q = rawQuery.trim().toLowerCase();
            const qClean = q.replace(/[^a-z0-9]/g, '');

            // 1. Direct match in pre-indexed national postal directory
            for (const item of NATIONAL_POSTAL_DIRECTORY) {
                if (item.aliases.some(alias => {
                    const aliasClean = alias.replace(/[^a-z0-9]/g, '');
                    return q.includes(alias) || alias.includes(q) || (qClean.length >= 4 && (qClean.includes(aliasClean) || aliasClean.includes(qClean)));
                })) {
                    return item;
                }
            }

            // 2. 6-digit PIN code algorithmic resolver
            const pinMatch = q.match(/\b\d{6}\b/);
            if (pinMatch) {
                const pin = pinMatch[0];
                if (pin === '110006') return null; // Belongs to this GPO
                const p2 = parseInt(pin.slice(0, 2), 10);
                let stateCircle = "National Postal Network";
                let region = "Regional Delivery Division";

                if (p2 >= 51 && p2 <= 53) { stateCircle = "Andhra Pradesh"; region = "Andhra Circle"; }
                else if (p2 === 50) { stateCircle = "Telangana"; region = "Telangana Circle"; }
                else if (p2 >= 56 && p2 <= 59) { stateCircle = "Karnataka"; region = "Karnataka Circle"; }
                else if (p2 >= 60 && p2 <= 64) { stateCircle = "Tamil Nadu"; region = "Tamil Nadu Circle"; }
                else if (p2 >= 67 && p2 <= 69) { stateCircle = "Kerala"; region = "Kerala Circle"; }
                else if (p2 >= 40 && p2 <= 44) { stateCircle = "Maharashtra"; region = "Maharashtra Circle"; }
                else if (p2 === 11) { stateCircle = "Delhi Circle"; region = "Delhi Division"; }
                else if (p2 >= 12 && p2 <= 13) { stateCircle = "Haryana"; region = "Haryana Circle"; }
                else if (p2 >= 20 && p2 <= 28) { stateCircle = "Uttar Pradesh"; region = "UP Circle"; }
                else if (p2 >= 30 && p2 <= 34) { stateCircle = "Rajasthan"; region = "Rajasthan Circle"; }
                else if (p2 >= 36 && p2 <= 39) { stateCircle = "Gujarat"; region = "Gujarat Circle"; }
                else if (p2 >= 70 && p2 <= 74) { stateCircle = "West Bengal"; region = "West Bengal Circle"; }
                else if (p2 >= 80 && p2 <= 85) { stateCircle = "Bihar"; region = "Bihar Circle"; }

                return {
                    areaTitle: `PIN ${pin} Delivery Zone`,
                    pincode: pin,
                    deliveryOffice: `Designated Head Post Office (${pin.slice(0, 3)} HO)`,
                    postalDivision: `${stateCircle} Postal Division`,
                    district: `${region} Jurisdiction`,
                    stateCircle: stateCircle
                };
            }

            // 3. Dynamic generic fallback for any recognized outside city/town name
            const cleanTitle = rawQuery.trim().replace(/\b\w/g, l => l.toUpperCase());
            return {
                areaTitle: cleanTitle,
                pincode: "Search via Postal Registry",
                deliveryOffice: `${cleanTitle} Head Post Office (HPO)`,
                postalDivision: `${cleanTitle} Postal Division`,
                district: cleanTitle,
                stateCircle: "India Post National Network"
            };
        }

        /* Live Microphone Voice Search Handler */
        function toggleVoiceSearch(inputId) {
            const inputEl = document.getElementById(inputId);
            const micBtn = document.getElementById(`micBtn_${inputId}`);
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showModalNotice("Voice Search", "Voice input is not supported by your current browser. Please type your query in the search bar.");
                return;
            }
            try {
                const recognition = new SpeechRecognition();
                recognition.lang = 'en-IN';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                if (micBtn) micBtn.classList.add('mic-recording');

                recognition.onstart = () => {
                    if (inputEl) inputEl.placeholder = "🎙️ Listening... Please speak city, area, door no...";
                };

                recognition.onresult = (event) => {
                    const spokenText = event.results[0][0].transcript;
                    if (inputEl) {
                        inputEl.value = spokenText;
                        performSearch(inputId);
                    }
                };

                recognition.onerror = () => {
                    if (micBtn) micBtn.classList.remove('mic-recording');
                    if (inputEl) inputEl.placeholder = "🔍 Type or speak Door No, Street, City, PIN, Beat...";
                };

                recognition.onend = () => {
                    if (micBtn) micBtn.classList.remove('mic-recording');
                    if (inputEl) inputEl.placeholder = "🔍 Type or speak Door No, Street, City, PIN, Beat...";
                };

                recognition.start();
            } catch(err) {
                if (micBtn) micBtn.classList.remove('mic-recording');
            }
        }

        // Permanent Local Cache Loader (Initializes Master v5 Roster Instantly)
        function initPermanentBeatsStorage() {
            try {
                const storedBeats = localStorage.getItem(STORAGE_KEYS.BEATS);
                if (storedBeats) {
                    const parsed = JSON.parse(storedBeats);
                    // Ensure full 50 beats integrity
                    if (Array.isArray(parsed) && parsed.length === 50 && parsed.some(b => b.beatNumber === 10 && b.postmanName === "C. S. Prasad Reddy")) {
                        parsed.sort((a, b) => a.beatNumber - b.beatNumber);
                        BEATS_DATABASE = parsed;
                    } else {
                        BEATS_DATABASE.sort((a, b) => a.beatNumber - b.beatNumber);
                        localStorage.setItem(STORAGE_KEYS.BEATS, JSON.stringify(BEATS_DATABASE));
                    }
                } else {
                    BEATS_DATABASE.sort((a, b) => a.beatNumber - b.beatNumber);
                    localStorage.setItem(STORAGE_KEYS.BEATS, JSON.stringify(BEATS_DATABASE));
                }
            } catch (e) {
                console.warn("Storage read error, using built-in database:", e);
            }
            BEATS_DATABASE.sort((a, b) => a.beatNumber - b.beatNumber);
        }
        initPermanentBeatsStorage();

        // Save Beats Permanently to Local Storage and background sync to Supabase
        async function saveBeatsPermanently(notifyUser = false) {
            try {
                BEATS_DATABASE.sort((a, b) => a.beatNumber - b.beatNumber);
                localStorage.setItem(STORAGE_KEYS.BEATS, JSON.stringify(BEATS_DATABASE));
                window._beatIndicesCached = false;
                ensureBeatSearchIndices();
            } catch (e) {
                console.error("Local storage save error:", e);
            }

            // 1. Instant Real-Time Peer-to-Peer Broadcast to ALL devices & APKs (<30ms)
            broadcastBeatsChange();

            // 2. Background Supabase Push
            const client = getSupabaseClient();
            if (client) {
                try {
                    const payload = BEATS_DATABASE.map(b => ({
                        beat_number: b.beatNumber,
                        hub: b.hub,
                        area_name: b.areaName,
                        postman_name: b.postmanName,
                        mobile_number: b.mobileNumber,
                        type: b.type,
                        door_ranges: b.doorRanges,
                        areas: b.areas,
                        lat: b.lat,
                        lng: b.lng,
                        updated_at: new Date().toISOString()
                    }));
                    const { error } = await client.from('beats').upsert(payload, { onConflict: 'beat_number' });
                    if (!error && notifyUser) {
                        showModalNotice("Saved & Synced", "All 50 beats saved permanently and broadcast live across all user devices!");
                        return;
                    }
                } catch (err) {
                    console.info("Supabase sync will retry next time:", err.message);
                }
            }

            if (notifyUser) {
                showModalNotice("Saved Permanently", "Data saved permanently and broadcast live across all connected devices.");
            }
        }

        // Fetch Remote Beats from Supabase on startup if online with safe merging to never wipe fields
        async function syncBeatsFromSupabase() {
            if (isSyncingBeats) return;
            const client = getSupabaseClient();
            if (!client) return;
            try {
                isSyncingBeats = true;
                const { data, error } = await client
                    .from('beats')
                    .select('*')
                    .order('beat_number', { ascending: true });
                if (data && data.length > 0 && !error) {
                    BEATS_DATABASE = data.map(item => {
                        const bNum = item.beat_number || item.beatNumber;
                        const local = BEATS_DATABASE.find(b => b.beatNumber === bNum) || {};
                        return {
                            ...local,
                            beatNumber: bNum,
                            hub: item.hub || local.hub,
                            area_name: item.area_name || item.areaName || local.areaName,
                            postman_name: item.postman_name || item.postmanName || local.postmanName,
                            mobile_number: item.mobile_number || item.mobileNumber || local.mobileNumber,
                            type: item.type || local.type || "Postman",
                            distance: item.distance || local.distance || "1.50",
                            doorRanges: (item.door_ranges || item.doorRanges) || local.doorRanges || "",
                            areas: (Array.isArray(item.areas) && item.areas.length > 0) 
                                ? item.areas 
                                : ((typeof item.areas === 'string' && item.areas.trim()) 
                                    ? item.areas.split(',') 
                                    : (local.areas || [])),
                            lat: item.lat || local.lat || 28.65,
                            lng: item.lng || local.lng || 77.23
                        };
                    });
                    // Strictly sort 1 to 50 in memory and storage
                    BEATS_DATABASE.sort((a, b) => a.beatNumber - b.beatNumber);
                    localStorage.setItem(STORAGE_KEYS.BEATS, JSON.stringify(BEATS_DATABASE));
                    window._beatIndicesCached = false;
                    ensureBeatSearchIndices();
                    console.log(`Synced ${data.length} beats safely from Supabase Cloud.`);
                }
            } catch (err) {
                console.info("Supabase sync status: using persistent local copy.");
            } finally {
                isSyncingBeats = false;
            }
        }

        function triggerImportJSON() {
            const fileInput = document.createElement('input');

            fileInput.accept = '.json,application/json';
            fileInput.onchange = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed && Array.isArray(parsed.beats)) {
                            BEATS_DATABASE = parsed.beats;
                            if (parsed.settings) APP_SETTINGS = { ...APP_SETTINGS, ...parsed.settings };
                            if (parsed.deliveryNotes) BEAT_DELIVERY_NOTES = { ...BEAT_DELIVERY_NOTES, ...parsed.deliveryNotes };

                        } else {
                            showModalNotice("Import Error", "Invalid JSON format. Expected an array of beats.");
                        }
                    } catch (err) {
                        showModalNotice("Import Failed", err.message);

                };
                reader.readAsText(file);
            };

        function get10mRecentSearches() {
            try {
                const raw = localStorage.getItem(SEARCH_HISTORY_KEY);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                const now = Date.now();
                return parsed.filter(item => (now - item.timestamp) < 600000).map(item => item.query);
            } catch (e) { return []; }
        }

        function saveSearchTo10mStorage(query) {
            if (!query) return;
            const clean = query.trim();
            if (!clean) return;
            try {
                const raw = localStorage.getItem(SEARCH_HISTORY_KEY);
                let list = raw ? JSON.parse(raw) : [];
                const now = Date.now();
                list = list.filter(item => item.query.toLowerCase() !== clean.toLowerCase() && (now - item.timestamp) < 600000);
                list.unshift({ query: clean, timestamp: now });
                localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(list.slice(0, 6)));
            } catch (e) {}

            // Asynchronously log search activity to Supabase table in background without blocking UI
            const client = getSupabaseClient();
            if (client) {
                setTimeout(() => {
                    try {
                        client
                            .from('search_logs')
                            .insert([{ query: clean, created_at: new Date().toISOString() }])
                            .catch(() => {});
                    } catch(err) {}
                }, 10);
            }
        }

            const client = getSupabaseClient();
            if (!client) {

            try {
                showModalNotice("Uploading Data", "Backing up beats database to Supabase cloud table...");
                BEATS_DATABASE.sort((a, b) => a.beatNumber - b.beatNumber);
                const payload = BEATS_DATABASE.map(b => ({
                    beat_number: b.beatNumber,

                    type: b.type,
                    door_ranges: b.doorRanges,
                    areas: b.areas,
                    lat: b.lat,
                    lng: b.lng
                }));

                const { error } = await client.from('beats').upsert(payload, { onConflict: 'beat_number' });
                if (error) {
                    showModalNotice("Supabase Notification", `Connected to project <strong>${SUPABASE_CONFIG.projectName}</strong>.<br><br><span class="text-xs text-amber-700">Notice: Ensure the 'beats' table is created in your Supabase SQL editor with 'beat_number' as primary key.</span><br><br><span class="text-[10px] text-on-surface-variant font-mono">${error.message}</span>`);

        /* ==========================================================================
           UNIVERSAL HIGH-SPEED INTELLIGENT SEARCH ENGINE (<2ms Latency)
           Matches: Door numbers, door number ranges (e.g. 3905 in 3902-3930),
                    Katras, Galis, Markets, Buildings, Landmarks,
                    Beat Number (#1, Beat 01, 1), Area Name, Hub, Postman Staff,
                    Single keywords, and Multi-keyword combinations.
           ========================================================================== */
        // Utility: Strip spaces and non-alphanumeric chars for space-insensitive matching
        function cleanCompactStr(str) {
            return (str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        // Fast phonetic simplification (Memoized & light)
        function phoneticSimplifyStr(str) {
            if (!str) return '';
            return str.toLowerCase()
                .replace(/ph/g, 'f')
                .replace(/w/g, 'v')
                .replace(/z/g, 'j')
                .replace(/sh/g, 's')
                .replace(/kh/g, 'k')
                .replace(/gh/g, 'g')
                .replace(/th/g, 't')
                .replace(/dh/g, 'd')
                .replace(/bh/g, 'b')
                .replace(/ee|ea|y/g, 'i')
                .replace(/oo|ou/g, 'u')
                .replace(/ai|ay/g, 'e')
                .replace(/(.)\1+/g, '$1')
                .replace(/[^a-z0-9]/g, '');
        }

        // Fast bounded Levenshtein distance
        function fastLevenshtein(a, b, maxDist = 2) {
            if (Math.abs(a.length - b.length) > maxDist) return maxDist + 1;
            if (a === b) return 0;
            const al = a.length, bl = b.length;
            let prev = [];
            for (let j = 0; j <= bl; j++) prev[j] = j;
            for (let i = 1; i <= al; i++) {
                let curr = [i];
                let minVal = curr[0];
                const ai = a.charAt(i - 1);
                for (let j = 1; j <= bl; j++) {
                    const cost = ai === b.charAt(j - 1) ? 0 : 1;
                    curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
                    if (curr[j] < minVal) minVal = curr[j];
                }
                if (minVal > maxDist) return maxDist + 1;
                prev = curr;
            }
            return prev[bl];
        }

        // Ultra-fast word match (Guards against false positives on small words)
        function isFastFuzzyWordMatch(qClean, qPhonetic, target) {
            if (!qClean || !target) return false;
            const tClean = target.toLowerCase();
            if (tClean.includes(qClean)) return true;
            if (qClean.length >= 4 && tClean.length >= 4 && qClean.includes(tClean)) return true;

            const tPhonetic = phoneticSimplifyStr(tClean);
            if (tPhonetic && qPhonetic) {
                if (tPhonetic.includes(qPhonetic)) return true;
                if (qPhonetic.length >= 5 && tPhonetic.length >= 5 && qPhonetic.includes(tPhonetic)) return true;
            }

            if (qClean.length >= 5 && tClean.length >= 5) {
                const maxDist = qClean.length >= 7 ? 2 : 1;
                if (fastLevenshtein(qClean, tClean, maxDist) <= maxDist) return true;
            }
            return false;
        }

        function checkDoorNumberInRange(numStr, rangeStr) {
            if (!numStr || !rangeStr) return false;
            const searchNum = parseInt(numStr.replace(/\D/g, ''), 10);
            if (isNaN(searchNum)) return false;

            const tokens = rangeStr.split(/[,\s]+/).map(t => t.trim()).filter(Boolean);
            for (const t of tokens) {
                const parts = t.split(/[-–—]|to/i).map(p => p.trim());
                if (parts.length === 2) {
                    const start = parseInt(parts[0].replace(/\D/g, ''), 10);
                    const end = parseInt(parts[1].replace(/\D/g, ''), 10);
                    if (!isNaN(start) && !isNaN(end)) {
                        const min = Math.min(start, end);
                        const max = Math.max(start, end);
                        if (searchNum >= min && searchNum <= max) {
                            return t;
                        }
                    }
                } else if (parts.length === 1) {
                    const exact = parseInt(parts[0].replace(/\D/g, ''), 10);
                    if (!isNaN(exact) && exact === searchNum) {
                        return t;
                    }
                }
            }
            return false;
        }

        // Cache pre-computed search indices on startup for instant execution
        function ensureBeatSearchIndices() {
            if (window._beatIndicesCached) return;
            for (const b of BEATS_DATABASE) {
                b._areaCompact = cleanCompactStr(b.areaName);
                b._areaPhonetic = phoneticSimplifyStr(b.areaName);
                b._hubCompact = cleanCompactStr(b.hub);
                b._postmanCompact = cleanCompactStr(b.postmanName);
                b._postmanPhonetic = phoneticSimplifyStr(b.postmanName);
                b._areasJoined = Array.isArray(b.areas) ? b.areas.join(' ') : '';
                b._areasCompact = cleanCompactStr(b._areasJoined);
                b._fullCorpusCompact = cleanCompactStr(`${b.areaName} ${b.hub} ${b.postmanName} ${b._areasJoined}`);
            }
            window._beatIndicesCached = true;
        }

        function searchDatabase(rawQuery) {
            if (!rawQuery) return [];
            const cleanRaw = rawQuery.trim().toLowerCase();
            if (!cleanRaw) return [];

            ensureBeatSearchIndices();

            // 1. DIRECT BEAT NUMBER (1 to 50) e.g., "1", "10", "50", "beat 10", "#10", "beat no 10"
            const beatNumClean = cleanRaw.replace(/\b(beat|no|number|delhi|gpo)\b/g, '').replace(/[#]/g, '').trim();
            if (/^\d{1,2}$/.test(beatNumClean)) {
                const bNum = parseInt(beatNumClean, 10);
                if (bNum >= 1 && bNum <= 50) {
                    const exactBeat = BEATS_DATABASE.find(b => b.beatNumber === bNum);
                    if (exactBeat) {
                        return [{
                            beat: exactBeat,
                            score: 1000,
                            matchReason: `Exact Beat #${exactBeat.beatNumber} (${exactBeat.areaName})`
                        }];
                    }
                }
            }

            const qCompact = cleanCompactStr(cleanRaw);
            const qPhonetic = phoneticSimplifyStr(cleanRaw);

            // 2. CHECK FOR JOINED DOOR + AREA e.g., "1100lalkuan", "3905matiamahal", "lalkuan1100"
            let joinedDoorNum = null;
            let joinedAreaText = null;

            const joinedMatchLeading = cleanRaw.match(/^(\d{1,5})([a-z]+)$/);
            const joinedMatchTrailing = cleanRaw.match(/^([a-z]+)(\d{1,5})$/);

            if (joinedMatchLeading) {
                joinedDoorNum = joinedMatchLeading[1];
                joinedAreaText = joinedMatchLeading[2];
            } else if (joinedMatchTrailing) {
                joinedAreaText = joinedMatchTrailing[1];
                joinedDoorNum = joinedMatchTrailing[2];
            }

            if (joinedDoorNum && joinedAreaText) {
                const areaCompact = cleanCompactStr(joinedAreaText);
                const areaPhonetic = phoneticSimplifyStr(joinedAreaText);

                for (const beat of BEATS_DATABASE) {
                    const matchedRange = checkDoorNumberInRange(joinedDoorNum, beat.doorRanges || '');
                    if (!matchedRange) continue;

                    let areaMatched = beat._areaCompact.includes(areaCompact) || areaCompact.includes(beat._areaCompact) ||
                                      (areaPhonetic && beat._areaPhonetic.includes(areaPhonetic)) ||
                                      beat._areasCompact.includes(areaCompact);

                    if (areaMatched) {
                        return [{
                            beat,
                            score: 1000,
                            matchReason: `Door #${joinedDoorNum} in range [${matchedRange}] in ${beat.areaName}`
                        }];
                    }
                }
            }

            // 3. DIRECT POSTMAN NAME SEARCH (e.g. "Prasad Reddy", "Amarnatha", "Anusha", "Jai Kishan")
            const postmanMatches = [];
            for (const b of BEATS_DATABASE) {
                if (b._postmanCompact === qCompact || b._postmanPhonetic === qPhonetic ||
                    b._postmanCompact.includes(qCompact) || (qCompact.length >= 4 && isFastFuzzyWordMatch(qCompact, qPhonetic, b.postmanName))) {
                    postmanMatches.push(b);
                }
            }
            if (postmanMatches.length === 1) {
                return [{
                    beat: postmanMatches[0],
                    score: 950,
                    matchReason: `Assigned Carrier: ${postmanMatches[0].postmanName} (${postmanMatches[0].type})`
                }];
            }

            // 4. COMBINED MULTI-WORD SEARCH (e.g. "1100 lal kuan", "10 lal kuan", "3905 matia mahal")
            const words = cleanRaw.split(/[\s,+/]+/).filter(w => w && !['beat', 'no', '#', 'gpo', 'delhi'].includes(w));
            const numberTokens = words.filter(w => /^\d+$/.test(w));
            const textTokens = words.filter(w => !/^\d+$/.test(w));

            if (numberTokens.length > 0 && textTokens.length > 0) {
                const numVal = parseInt(numberTokens[0], 10);
                const textPhrase = textTokens.join(' ');
                const textCompact = cleanCompactStr(textPhrase);

                // Case A: Number is Beat Number (1 to 50) + Area Name
                if (numVal >= 1 && numVal <= 50) {
                    const beatCandidate = BEATS_DATABASE.find(b => b.beatNumber === numVal);
                    if (beatCandidate && (beatCandidate._fullCorpusCompact.includes(textCompact) || textTokens.some(t => beatCandidate._fullCorpusCompact.includes(cleanCompactStr(t))))) {
                        return [{
                            beat: beatCandidate,
                            score: 980,
                            matchReason: `Beat #${numVal} matching "${textPhrase}"`
                        }];
                    }
                }

                // Case B: Door / House Number + Area Name
                const doorAndAreaMatches = [];
                for (const beat of BEATS_DATABASE) {
                    const matchedRange = checkDoorNumberInRange(numberTokens[0], beat.doorRanges || '');
                    if (!matchedRange) continue;

                    let areaMatched = textTokens.some(t => {
                        const tc = cleanCompactStr(t);
                        return tc.length >= 3 && (beat._areaCompact.includes(tc) || beat._areasCompact.includes(tc));
                    });

                    if (areaMatched) {
                        doorAndAreaMatches.push({
                            beat,
                            score: 990,
                            matchReason: `Door #${numberTokens[0]} falls in range [${matchedRange}] in ${beat.areaName}`
                        });
                    }
                }

                if (doorAndAreaMatches.length > 0) {
                    return doorAndAreaMatches;
                }
            }

            // 5. PURE DOOR NUMBER SEARCH ALONE (e.g. "1100", "3905", "2016")
            if (/^\d{3,5}$/.test(cleanRaw)) {
                const exactDoorMatches = [];
                for (const beat of BEATS_DATABASE) {
                    const matchedRange = checkDoorNumberInRange(cleanRaw, beat.doorRanges || '');
                    if (matchedRange) {
                        exactDoorMatches.push({
                            beat,
                            score: 850,
                            matchReason: `Door #${cleanRaw} falls in range [${matchedRange}] in ${beat.areaName}`
                        });
                    }
                }
                if (exactDoorMatches.length > 0) {
                    return exactDoorMatches;
                }
            }

            // 6. HIGH-SPEED AREA / STREET / KATRA TEXT SEARCH
            const scoredList = [];

            for (const beat of BEATS_DATABASE) {
                let score = 0;
                let reason = "";

                if (beat._areaCompact === qCompact) {
                    score = 600;
                    reason = `Exact Area: ${beat.areaName}`;
                } else if (beat._areaCompact.includes(qCompact) || (qCompact.length >= 5 && qCompact.includes(beat._areaCompact))) {
                    score = 450;
                    reason = `Area: ${beat.areaName}`;
                } else if (qPhonetic.length >= 5 && beat._areaPhonetic.includes(qPhonetic)) {
                    score = 380;
                    reason = `Phonetic Match: ${beat.areaName}`;
                } else if (beat._areasCompact.includes(qCompact) || (qCompact.length >= 5 && beat._areasCompact.includes(qCompact))) {
                    score = 400;
                    reason = `Katra / Street in ${beat.areaName}`;
                } else if (beat._hubCompact.includes(qCompact)) {
                    score = 300;
                    reason = `Hub: ${beat.hub}`;
                } else if (qCompact.length >= 5 && isFastFuzzyWordMatch(qCompact, qPhonetic, beat.areaName)) {
                    score = 350;
                    reason = `Typo Match: ${beat.areaName}`;
                }

                if (score >= 300) {
                    scoredList.push({
                        beat,
                        score,
                        matchReason: reason
                    });
                }
            }

            // Return only top matching beat(s) if within high confidence
            scoredList.sort((a, b) => b.score - a.score);
            if (scoredList.length > 0) {
                const topScore = scoredList[0].score;
                return scoredList.filter(item => item.score >= topScore * 0.90).slice(0, 2);
            }

            return [];
        }

            const postmanName = document.getElementById('editPostmanName').value.trim();

            const type = document.getElementById('editType').value;
            const doorRanges = document.getElementById('editDoorRanges').value.trim();
            const rawAreas = document.getElementById('editAreas').value;

            BEATS_DATABASE[idx] = {

                postmanName,
                mobileNumber,
                type,
                doorRanges,
                areas

            activeBeatDetails = BEATS_DATABASE[idx];
            navigateTo('beatDetails', activeBeatDetails);

        /* Camera Trigger: Native High-Res Camera on Mobile / Live Stream on Desktop */
        function triggerCameraCapture() {
            // On mobile devices, native input capture="environment" launches the phone's native camera with auto-focus & HD resolution
            const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
            const nativeCam = document.getElementById('scannerDirectCameraInput');
            if (isMobile && nativeCam) {
                nativeCam.click();
            } else {
                startLiveCamera();
            }
        }

        /* Live WebRTC Camera Stream Controller */
        async function startLiveCamera() {
            const videoEl = document.getElementById('lensVideoElement');
            const idleOverlay = document.getElementById('lensIdleOverlay');
            const activeControls = document.getElementById('lensActiveControls');
            const laserLine = document.getElementById('lensLaserScanLine');
            const previewImg = document.getElementById('lensPreviewImage');

            if (previewImg) previewImg.classList.add('hidden');

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                // Fallback to direct camera file input if getUserMedia is unsupported
                const fallbackInput = document.getElementById('scannerDirectCameraInput');
                if (fallbackInput) fallbackInput.click();
                return;
            }

            try {
                if (selectedCameraStream) {
                    selectedCameraStream.getTracks().forEach(t => t.stop());
                }

                // Request rear environment camera with HD resolution
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                selectedCameraStream = stream;
                isCameraActive = true;

                if (videoEl) {
                    videoEl.srcObject = stream;
                    videoEl.classList.remove('hidden');
                }
                if (idleOverlay) idleOverlay.classList.add('hidden');
                if (activeControls) activeControls.classList.remove('hidden');
                if (laserLine) laserLine.classList.remove('hidden');

            } catch (err) {
                console.warn("Live camera permission or hardware notice:", err);
                const fallbackInput = document.getElementById('scannerDirectCameraInput');
                if (fallbackInput) fallbackInput.click();
            }
        }

        function stopLiveCamera() {
            if (selectedCameraStream) {
                selectedCameraStream.getTracks().forEach(t => t.stop());
                selectedCameraStream = null;
            }
            isCameraActive = false;

            const videoEl = document.getElementById('lensVideoElement');
            const activeControls = document.getElementById('lensActiveControls');
            const laserLine = document.getElementById('lensLaserScanLine');

            if (videoEl) videoEl.classList.add('hidden');
            if (activeControls) activeControls.classList.add('hidden');
            if (laserLine) laserLine.classList.add('hidden');
        }

        function captureFromLiveStream() {
            const videoEl = document.getElementById('lensVideoElement');
            const canvas = document.getElementById('lensCanvasCapture');
            if (!videoEl || !canvas) return;

            canvas.width = videoEl.videoWidth || 1280;
            canvas.height = videoEl.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

            const capturedDataUrl = canvas.toDataURL('image/jpeg', 0.92);
            stopLiveCamera();
            displayScannedImageInViewport(capturedDataUrl);
            processOCR(capturedDataUrl);
        }

        function resetScannerView() {
            stopLiveCamera();
            const panel = document.getElementById('scannerDetectedWordsPanel');
            if (panel) panel.classList.add('hidden');
            const previewImg = document.getElementById('lensPreviewImage');
            if (previewImg) { previewImg.src = ''; previewImg.classList.add('hidden'); }
            const idleOverlay = document.getElementById('lensIdleOverlay');
            if (idleOverlay) idleOverlay.classList.remove('hidden');
        }

        function displayScannedImageInViewport(dataUrl) {
            const previewImg = document.getElementById('lensPreviewImage');
            const idleOverlay = document.getElementById('lensIdleOverlay');
            const videoEl = document.getElementById('lensVideoElement');
            const activeControls = document.getElementById('lensActiveControls');

            if (videoEl) videoEl.classList.add('hidden');
            if (activeControls) activeControls.classList.add('hidden');
            if (idleOverlay) idleOverlay.classList.add('hidden');
            if (previewImg) {
                previewImg.src = dataUrl;
                previewImg.classList.remove('hidden');
            }
        }

        function handleFileUpload(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            stopLiveCamera();
            const reader = new FileReader();
            reader.onload = (event) => {
                const dataUrl = event.target.result;
                displayScannedImageInViewport(dataUrl);
                processOCR(dataUrl);
            };
            reader.readAsDataURL(file);
            e.target.value = ''; // Reset input to allow re-upload
        }

        async function processOCR(dataUrl) {
            const spinner = document.getElementById('lensLoadingSpinner');
            const laserLine = document.getElementById('lensLaserScanLine');
            const progressLabel = document.getElementById('ocrProgressLabel');
            const panel = document.getElementById('scannerDetectedWordsPanel');

            if (spinner) spinner.classList.remove('hidden');
            if (laserLine) laserLine.classList.remove('hidden');
            if (panel) panel.classList.add('hidden');

            try {
                if (typeof Tesseract === 'undefined') {
                    throw new Error("Tesseract OCR engine is initializing. Please try again in a moment.");
                }

                const result = await Tesseract.recognize(
                    dataUrl,
                    'eng',
                    {
                        logger: m => {
                            if (progressLabel && m.status === 'recognizing text') {
                                progressLabel.textContent = `Scanning: ${Math.round((m.progress || 0) * 100)}%`;
                            }
                        }
                    }
                );

                if (spinner) spinner.classList.add('hidden');
                if (laserLine) laserLine.classList.add('hidden');

                const text = (result && result.data && result.data.text) ? result.data.text.trim() : '';
                if (!text) {
                    showModalNotice("OCR Complete", "No legible postal text or door numbers detected. Please ensure the address label is well-lit and clear.");
                    return;
                }

                // Render Touch-to-Search Words and Raw Extracted Text
                renderOcrDetectedWords(text);

            } catch (err) {
                if (spinner) spinner.classList.add('hidden');
                if (laserLine) laserLine.classList.add('hidden');
                showModalNotice("Scanner Notice", "Could not complete text scan: " + err.message);
            }
        }

        /* Parse OCR Text and Split Into Interactive Touch-to-Search Words & Categories */
        function renderOcrDetectedWords(rawText) {
            const panel = document.getElementById('scannerDetectedWordsPanel');
            const wordsListEl = document.getElementById('ocrWordBadgesList');
            const fullTextEl = document.getElementById('ocrFullRecognizedText');
            const searchAllBtn = document.getElementById('ocrSearchAllBtn');
            const doorGroup = document.getElementById('ocrDoorNumbersGroup');
            const doorList = document.getElementById('ocrDoorBadgesList');
            const locGroup = document.getElementById('ocrLocalitiesGroup');
            const locList = document.getElementById('ocrLocalityBadgesList');

            if (!panel || !wordsListEl || !fullTextEl) return;

            fullTextEl.textContent = rawText;

            // Split raw text into clean tokens
            const rawTokens = rawText.split(/[\s,\n\r\t|/\\-]+/)
                .map(t => t.trim().replace(/^[^a-zA-Z0-9]+|[^a-zA-Z0-9]+$/g, ''))
                .filter(Boolean);

            const uniqueTokens = Array.from(new Set(rawTokens)).filter(t => t.length >= 2);

            // Separate Door Numbers, PIN codes, and General Words
            const doorNumbers = [];
            const pinCodes = [];
            const generalWords = [];

            uniqueTokens.forEach(t => {
                if (/^\d{6}$/.test(t)) {
                    pinCodes.push(t);
                } else if (/^\d{1,5}$/.test(t)) {
                    doorNumbers.push(t);
                } else {
                    generalWords.push(t);
                }
            });

            // Detect known Old Delhi localities/streets from rawText
            const knownPhrases = [
                "Matia Mahal", "Jama Masjid", "Churiwalan", "Bazar Sita Ram", "Turkman Gate",
                "Kali Masjid", "Hauz Qazi", "Ajmeri Gate", "Kucha Pandit", "Farash Khana",
                "Lal Kuan", "Chawari Bazar", "Dharampura", "Kinari Bazar", "Cheera Khana",
                "Dareeba", "Lajpat Rai Market", "Red Fort", "Bhagirath Palace", "Chandni Chowk",
                "Town Hall", "Katra Neel", "Fatehpuri", "Gandhi Cloth Market", "Nai Sarak",
                "Maliwara", "Roshanpura", "Jogiwara", "Ballimaran", "Charkhewalan",
                "Saudagran", "Katra Baryan", "Naya Bans", "Cloth Market", "Novelty Cinema",
                "SP Mukerjee Marg", "Tilak Bazar", "Khari Baoli", "Naya Bazar", "Lahori Gate",
                "Sadar Bazar", "Pratap Market", "Rui Mandi", "Teliwara", "Pahari Dhiraj",
                "Bara Hindu Rao", "Kutub Road", "Pan Mandi", "Basti Julahan", "Idgah Road",
                "Baratooti", "Nawab Road", "Ahata Kidara", "Basti Khatikan", "Chamelian Road",
                "Kishan Ganj", "Aziz Ganj", "Nawab Ganj", "Islam Ganj", "Sarai Rohilla",
                "Kashmeri Gate", "Mori Gate", "Hamilton Road", "Ram Bazar", "Lothian Road",
                "ISBT", "Jamna Bazar", "RMS Bhawan", "Bara Bazaar", "Chabi Ganj"
            ];

            const detectedLocalities = [];
            const lowerRaw = rawText.toLowerCase();
            knownPhrases.forEach(phrase => {
                if (lowerRaw.includes(phrase.toLowerCase()) && !detectedLocalities.includes(phrase)) {
                    detectedLocalities.push(phrase);
                }
            });

            // 1. Populate Door Numbers Group
            if (doorNumbers.length > 0 && doorGroup && doorList) {
                doorList.innerHTML = doorNumbers.map(num => `
                    <button onclick="quickSearch('${num}')" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-amber-100 hover:bg-amber-600 hover:text-white text-amber-950 border border-amber-300 font-mono font-black text-xs transition-all shadow-2xs active:scale-95 cursor-pointer">
                        <span class="material-symbols-outlined text-xs">tag</span>
                        <span>Door #${num}</span>
                    </button>
                `).join('');
                doorGroup.classList.remove('hidden');
            } else if (doorGroup) {
                doorGroup.classList.add('hidden');
            }

            // 2. Populate Localities Group
            if (detectedLocalities.length > 0 && locGroup && locList) {
                locList.innerHTML = detectedLocalities.map(loc => `
                    <button onclick="quickSearch('${loc.replace(/'/g, "\\'")}')" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-emerald-100 hover:bg-emerald-700 hover:text-white text-emerald-950 border border-emerald-300 font-black text-xs transition-all shadow-2xs active:scale-95 cursor-pointer">
                        <span class="material-symbols-outlined text-xs">location_on</span>
                        <span>${loc}</span>
                    </button>
                `).join('');
                locGroup.classList.remove('hidden');
            } else if (locGroup) {
                locGroup.classList.add('hidden');
            }

            // 3. Populate All Individual Words
            if (uniqueTokens.length === 0) {
                wordsListEl.innerHTML = `<span class="text-xs text-on-surface-variant font-medium">No distinct address words extracted.</span>`;
            } else {
                wordsListEl.innerHTML = uniqueTokens.map(token => {
                    const isPin = /^\d{6}$/.test(token);
                    const isDoor = /^\d{1,5}$/.test(token);

                    let badgeStyle = "bg-surface-container-lowest hover:bg-primary hover:text-white border-outline-variant text-on-surface";
                    let icon = "touch_app";

                    if (isPin) {
                        badgeStyle = "bg-primary/10 hover:bg-primary hover:text-white text-primary border-primary/30 font-mono font-black";
                        icon = "pin";
                    } else if (isDoor) {
                        badgeStyle = "bg-amber-100 hover:bg-amber-600 hover:text-white text-amber-950 border-amber-300 font-mono font-black";
                        icon = "tag";
                    }

                    return `
                        <button onclick="quickSearch('${token.replace(/'/g, "\\'")}')" 
                                class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl border text-xs font-bold transition-all shadow-2xs active:scale-95 cursor-pointer ${badgeStyle}"

            }

            if (searchAllBtn) {
                searchAllBtn.onclick = () => {
                    // Combine detected localities or top tokens for smart composite search
                    const primaryQuery = detectedLocalities.length > 0 
                        ? (doorNumbers.length > 0 ? `${doorNumbers[0]} ${detectedLocalities[0]}` : detectedLocalities[0])
                        : uniqueTokens.slice(0, 5).join(' ');
                    quickSearch(primaryQuery || rawText.slice(0, 30));
                };
            }

            panel.classList.remove('hidden');
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

            const beat = BEATS_DATABASE.find(b => b.beatNumber === activeBeatNumber) || BEATS_DATABASE[0];

            const gpoLat = 28.6655, gpoLng = 77.2335;

        function changeLookupBeat(beatNumber) {
            const beat = BEATS_DATABASE.find(b => b.beatNumber === beatNumber) || BEATS_DATABASE[0];
            activeBeatDetails = beat;
            navigateTo('postalLookup', beat);

            // Auto scroll active pill into center
            setTimeout(() => {
                const activePill = document.getElementById(`pill_beat_${beatNumber}`);
                if (activePill) {
                    activePill.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            }, 100);
        }

        function initLookupMap() {
            const container = document.getElementById('lookupLeafletMap');
            if (!container) return;
            try {
                if (container._leaflet_id) { container._leaflet_id = null; container.innerHTML = ""; }
                const beat = activeBeatDetails || BEATS_DATABASE[0];
                const map = L.map('lookupLeafletMap').setView([beat.lat, beat.lng], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

                const boundsGroup = L.featureGroup();

                // 1. Delhi GPO Head Office Marker
                const gpoLat = 28.6655, gpoLng = 77.2335;
                const gpoIcon = L.divIcon({
                    className: 'custom-leaflet-gpo-marker',
                    html: `
                        <div style="background-color: #0f172a; color: #ffffff; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.35); border: 2.5px solid #ffffff;">
                            <span class="material-symbols-outlined" style="font-size: 20px;">account_balance</span>
                        </div>
                    `,
                    iconSize: [34, 34],
                    iconAnchor: [17, 17]
                });
                const gpoMarker = L.marker([gpoLat, gpoLng], { icon: gpoIcon }).addTo(map)
                    .bindPopup(`
                        <div class="text-xs font-sans">
                            <b class="text-slate-900 uppercase">Delhi G.P.O. - 110006</b><br>
                            <span class="text-[11px] text-slate-600 font-semibold">Head Delivery Office & Hub Center</span><br>
                            <span class="text-[10px] text-primary font-bold">Kashmere Gate, Delhi - 110006</span>
                        </div>
                    `);
                boundsGroup.addLayer(gpoMarker);

                // 2. Dynamic 4 Closest Adjacent Border Beats
                const neighbors = BEATS_DATABASE
                    .filter(b => b.beatNumber !== beat.beatNumber)
                    .map(b => {
                        const d = Math.sqrt(Math.pow((b.lat - beat.lat) * 111, 2) + Math.pow((b.lng - beat.lng) * 111 * Math.cos(beat.lat * Math.PI / 180), 2));
                        return { beat: b, distKm: d };
                    })
                    .sort((a, b) => a.distKm - b.distKm)
                    .slice(0, 4);

                const neighborColors = [
                    { border: '#ea580c', bg: '#fff7ed', text: '#ea580c' }, // Orange
                    { border: '#0284c7', bg: '#f0f9ff', text: '#0284c7' }, // Blue
                    { border: '#7c3aed', bg: '#f5f3ff', text: '#7c3aed' }, // Purple
                    { border: '#059669', bg: '#ecfdf5', text: '#059669' }  // Emerald
                ];

                neighbors.forEach((n, idx) => {
                    const c = neighborColors[idx % neighborColors.length];
                    const maskedPhone = isPhoneDataUnlocked()
                        ? `+91 ${n.beat.mobileNumber}`
                        : `• +91 ${n.beat.mobileNumber ? n.beat.mobileNumber.slice(0, 2) + '••••••' + n.beat.mobileNumber.slice(-2) : '••••••••••'}`;

                    // Border Beat Coverage Radius Circle
                    const neighborCircle = L.circle([n.beat.lat, n.beat.lng], {
                        color: c.border,
                        fillColor: c.border,
                        fillOpacity: 0.12,
                        weight: 2,
                        dashArray: '5, 5',
                        radius: 260
                    }).addTo(map);
                    boundsGroup.addLayer(neighborCircle);

                    // Connecting dashed line between active beat & neighbor for clear handoff context
                    L.polyline([[beat.lat, beat.lng], [n.beat.lat, n.beat.lng]], {
                        color: c.border,
                        weight: 2,
                        dashArray: '4, 6',
                        opacity: 0.65
                    }).addTo(map);

                    // Custom DivIcon Marker for Neighbor Beat
                    const neighborIcon = L.divIcon({
                        className: 'custom-leaflet-neighbor-marker',
                        html: `
                            <div style="background-color: ${c.border}; color: #ffffff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; font-family: monospace; box-shadow: 0 3px 8px rgba(0,0,0,0.3); border: 2.5px solid #ffffff; cursor: pointer;">
                                #${n.beat.beatNumber}
                            </div>
                        `,
                        iconSize: [32, 32],
                        iconAnchor: [16, 16]
                    });

                    const neighborMarker = L.marker([n.beat.lat, n.beat.lng], { icon: neighborIcon }).addTo(map)
                        .bindPopup(`
                            <div class="text-xs font-sans" style="min-width: 190px;">
                                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; margin-bottom: 4px;">
                                    <b style="color: ${c.border}; font-weight: 900;">BORDER BEAT #${n.beat.beatNumber}</b>
                                    <span style="font-size: 10px; background: #f1f5f9; padding: 2px 5px; border-radius: 4px; font-family: monospace; font-weight: bold;">
                                        ~${n.distKm.toFixed(2)} km
                                    </span>
                                </div>
                                <b style="color: #0f172a; font-size: 12px; display: block;">${n.beat.areaName}</b>
                                <div style="margin-top: 4px; color: #334155; font-size: 11px;">
                                    👤 Carrier: <b>${n.beat.postmanName} (${n.beat.type})</b><br>
                                    📞 <span style="font-family: monospace;">${maskedPhone}</span>
                                </div>
                                <div style="margin-top: 8px; padding-top: 6px; border-top: 1px solid #e2e8f0;">
