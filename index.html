            position: absolute;

            width: 90%;

            height: 24px;
            border-color: #fdc003;

        function getCurrentLanguage() {
            try {
                return localStorage.getItem('delhi_gpo_selected_lang') || 'en';
            } catch (e) {
                return 'en';
            }
        }

        function applyCurrentLanguage(rootNode = document.body) {
            const lang = getCurrentLanguage();
            if (!rootNode) return;
            
            // 1. Explicit data-i18n attributes
            rootNode.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (lang === 'en') {
                    el.textContent = key;
                } else if (I18N_TRANSLATIONS[lang] && I18N_TRANSLATIONS[lang][key]) {
                    el.textContent = I18N_TRANSLATIONS[lang][key];
                }
            });

            // 2. Placeholder attributes
            rootNode.querySelectorAll('[placeholder]').forEach(el => {
                const origPlaceholder = el.getAttribute('data-orig-ph') || el.getAttribute('placeholder');
                if (!el.getAttribute('data-orig-ph')) el.setAttribute('data-orig-ph', origPlaceholder);
                
                if (lang === 'en') {
                    el.setAttribute('placeholder', origPlaceholder);
                } else if (I18N_TRANSLATIONS[lang] && I18N_TRANSLATIONS[lang][origPlaceholder]) {
                    el.setAttribute('placeholder', I18N_TRANSLATIONS[lang][origPlaceholder]);
                }
            });

            // 3. Translate matching text nodes across the view
            if (lang !== 'en' && I18N_TRANSLATIONS[lang]) {
                const dict = I18N_TRANSLATIONS[lang];
                const walker = document.createTreeWalker(rootNode, NodeFilter.SHOW_TEXT, null, false);
                let node;
                while (node = walker.nextNode()) {
                    const text = node.nodeValue.trim();
                    if (text && dict[text]) {
                        node.nodeValue = node.nodeValue.replace(text, dict[text]);
                    }
                }
            }
        }

        let APP_SETTINGS = {

            enableMapNavigation: false,       // Default: False (Locked for Users)
            showDetailedPatrolMetrics: false  // Default: False (Shows GPO Distance Only)
        };

        function loadAppSettings() {
            try {
                const stored = localStorage.getItem(APP_SETTINGS_KEY);
                if (stored) {
                    APP_SETTINGS = { ...APP_SETTINGS, ...JSON.parse(stored) };
                }
            } catch (e) {
                console.warn("Settings read error:", e);
            }
        }
        loadAppSettings();

        function saveAppSettings() {
            try {
                localStorage.setItem(APP_SETTINGS_KEY, JSON.stringify(APP_SETTINGS));
            } catch (e) {
                console.warn("Settings save error:", e);
            }
        }

        function toggleAppSetting(key) {
            if (APP_SETTINGS.hasOwnProperty(key)) {
                APP_SETTINGS[key] = !APP_SETTINGS[key];
                saveAppSettings();
                if (currentTab === 'admin' && isAdminLoggedIn) {
                    const appContainer = document.getElementById('appContent');
                    if (appContainer) appContainer.innerHTML = renderAdminDashboardPage();
                }
            }

            return APP_SETTINGS.showPhoneNumbers === true;

            return APP_SETTINGS.enableMapNavigation === true;

            return APP_SETTINGS.showDetailedPatrolMetrics === true;
        }

            if (!phone) return "N/A";

            return `••••••${clean.slice(-2)}`;

        /* 10-MINUTE PRIVACY SEARCH STORAGE UTILITIES */
        const SEARCH_HISTORY_KEY = 'delhi_gpo_recent_searches_10m';

        function get10mRecentSearches() {
            try {
                const raw = localStorage.getItem(SEARCH_HISTORY_KEY);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                const now = Date.now();
                // Filter items newer than 10 minutes (600,000 ms)
                const validItems = parsed.filter(item => (now - item.timestamp) < 600000);
                if (validItems.length !== parsed.length) {
                    localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(validItems));
                }
                return validItems.map(item => item.query);
            } catch (e) {
                return [];
            }
        }

        function saveSearchTo10mStorage(query) {
            if (!query || typeof query !== 'string') return;
            const clean = query.trim();
            if (clean.length < 1) return;
            try {
                const raw = localStorage.getItem(SEARCH_HISTORY_KEY);
                let list = raw ? JSON.parse(raw) : [];
                const now = Date.now();
                // Remove duplicates and old entries
                list = list.filter(item => item.query.toLowerCase() !== clean.toLowerCase() && (now - item.timestamp) < 600000);
                list.unshift({ query: clean, timestamp: now });
                // Keep max 6 recent queries
                list = list.slice(0, 6);
                localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(list));
            } catch (e) {
                console.warn("Search save notice:", e);
            }
        }

        function clearSearchHistory() {
            try {
                localStorage.removeItem(SEARCH_HISTORY_KEY);
            } catch (e) {
                console.warn("Search clear notice:", e);
            }
        }

        function toggleVoiceSearch(inputId, btnId) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showModalNotice("Voice Search", "Speech recognition is not supported in this browser. Please type your search query.");
                return;
            }

            const inputEl = document.getElementById(inputId);
            const btnEl = document.getElementById(btnId);

            if (isVoiceListening && activeRecognition) {
                activeRecognition.stop();
                isVoiceListening = false;
                if (btnEl) btnEl.classList.remove('mic-recording');
                return;
            }

            try {
                activeRecognition = new SpeechRecognition();
                activeRecognition.lang = 'en-IN';
                activeRecognition.interimResults = false;
                activeRecognition.maxAlternatives = 1;

                activeRecognition.onstart = () => {
                    isVoiceListening = true;
                    if (btnEl) btnEl.classList.add('mic-recording');
                };

                activeRecognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    if (inputEl) {
                        inputEl.value = transcript;
                        performSearch(inputId);
                    }
                };

                activeRecognition.onerror = (event) => {
                    console.warn("Speech recognition notice:", event.error);
                    isVoiceListening = false;
                    if (btnEl) btnEl.classList.remove('mic-recording');
                };

                activeRecognition.onend = () => {
                    isVoiceListening = false;
                    if (btnEl) btnEl.classList.remove('mic-recording');
                };

                activeRecognition.start();
            } catch (err) {
                console.warn("Voice init notice:", err);
                isVoiceListening = false;
                if (btnEl) btnEl.classList.remove('mic-recording');
            }
        }

        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))).toFixed(2);
        }

        function getBeatDistanceInfo(beat) {
            if (!beat) return "N/A";
            const dist = calculateDistanceKm(DELHI_GPO_COORDS.lat, DELHI_GPO_COORDS.lng, beat.lat || 28.6500, beat.lng || 77.2300);
            return `~${dist} km from Delhi G.P.O.`;
        }

        function calculateBeatRouteMetrics(beat) {
            if (!beat) return { gpoDistKm: "1.2", internalRouteKm: "4.5", totalDailyCoverageKm: "6.9", estWalkingTimeHrs: "3.5", areaCount: 15 };
            const gpoDist = calculateDistanceKm(DELHI_GPO_COORDS.lat, DELHI_GPO_COORDS.lng, beat.lat || 28.6500, beat.lng || 77.2300);
            const areasCount = Array.isArray(beat.areas) ? beat.areas.length : 12;
            const internalRoute = (areasCount * 0.28 + 1.2).toFixed(1);
            const totalDaily = (parseFloat(gpoDist) * 2 + parseFloat(internalRoute)).toFixed(1);
            const estHours = (parseFloat(internalRoute) / 1.4 + 0.5).toFixed(1);
            return { gpoDistKm: gpoDist, internalRouteKm: internalRoute, totalDailyCoverageKm: totalDaily, estWalkingTimeHrs: estHours, areaCount: areasCount };
        }

        /* Helper to get neighboring beats geographically */
        function getNeighborBeats(beatNumber) {
            const current = BEATS_DATABASE.find(b => b.beatNumber === beatNumber);
            if (!current) return [];
            return BEATS_DATABASE
                .filter(b => b.beatNumber !== beatNumber)
                .map(b => ({
                    beat: b,
                    dist: calculateDistanceKm(current.lat || 28.65, current.lng || 77.23, b.lat || 28.65, b.lng || 77.23)
                }))
                .sort((a, b) => parseFloat(a.dist) - parseFloat(b.dist))
                .slice(0, 4)
                .map(item => item.beat);
        }

        /* Instant Search Database with Strict Dynamic Precision */
        function searchDatabase(query) {
            if (!query || typeof query !== 'string') return [];
            const rawQ = query.toLowerCase().trim();
            // Strip out non-alphanumeric characters for flexible matching
            const normQ = rawQ.replace(/[\s,\-\.\/#]/g, '');
            if (normQ.length < 1) return [];

            // Delhi GPO PIN or Core keywords check
            if (normQ === '110006' || normQ === 'delhigpo' || normQ === 'gpo' || normQ === 'delhi110006') {
                return BEATS_DATABASE.map(beat => ({
                    beat,
                    score: 100,
                    matchReason: 'Delhi G.P.O. Core Jurisdiction (PIN 110006)'
                }));
            }

            let matches = [];
            // Extract pure number if user typed "1", "01", "beat 5", "#22", "b30"
            const numOnlyMatch = normQ.replace(/^beat|^b|^no/, '');
            const parsedBeatNum = parseInt(numOnlyMatch, 10);
            const isSingleBeatRange = !isNaN(parsedBeatNum) && parsedBeatNum >= 1 && parsedBeatNum <= 50;

            BEATS_DATABASE.forEach(beat => {
                let score = 0;
                let matchReason = '';

                // 1. Direct Beat Number Match (e.g., "1", "01", "beat 1", "#1", "b1")
                if (isSingleBeatRange && beat.beatNumber === parsedBeatNum && (normQ === `${parsedBeatNum}` || normQ === `beat${parsedBeatNum}` || normQ === `b${parsedBeatNum}` || normQ === `0${parsedBeatNum}`)) {
                    score += 200;
                    matchReason = `Exact Beat #${beat.beatNumber}`;
                }

                // 2. Postman Staff Name Match (Minimum 3 characters)
                const normStaff = (beat.postmanName || '').toLowerCase().replace(/[\s,\-\.\/#]/g, '');
                if (normStaff && normQ.length >= 3 && (normStaff.includes(normQ) || (normQ.length >= 4 && normQ.includes(normStaff)))) {
                    score += 120;
                    matchReason = `Assigned Carrier: ${beat.postmanName}`;
                }

                // 3. Main Area Name Flexible Match (Minimum 3 characters)
                const normArea = (beat.areaName || '').toLowerCase().replace(/[\s,\-\.\/#]/g, '');
                if (normArea && normQ.length >= 3 && normArea.includes(normQ)) {
                    score += 100;
                    matchReason = `Area: ${beat.areaName}`;
                }

                // 4. Sub-Localities, Katras & Galis Match (Minimum 3 characters)
                if (Array.isArray(beat.areas) && normQ.length >= 3) {
                    for (const sub of beat.areas) {
                        if (!sub) continue;
                        const normSub = sub.toLowerCase().replace(/[\s,\-\.\/#]/g, '');
                        if (normSub.includes(normQ)) {
                            score += 90;
                            matchReason = `Katra / Street: ${sub}`;
                            break;
                        }
                    }
                }

                // 5. Door / House / Building Number in Range Match
                const queryDoorNum = parseInt(normQ.replace(/\D/g, ''), 10);
                if (!isNaN(queryDoorNum) && queryDoorNum > 0 && beat.doorRanges && !isSingleBeatRange) {
                    const ranges = beat.doorRanges.split(',');
                    for (const rStr of ranges) {
                        const parts = rStr.trim().split('-');
                        if (parts.length === 2) {
                            const min = Math.min(parseInt(parts[0], 10), parseInt(parts[1], 10));
                            const max = Math.max(parseInt(parts[0], 10), parseInt(parts[1], 10));
                            if (!isNaN(min) && !isNaN(max) && queryDoorNum >= min && queryDoorNum <= max) {
                                score += 110;
                                matchReason = `Door No. ${queryDoorNum} in range (${parts[0].trim()} - ${parts[1].trim()})`;
                                break;
                            }
                        } else if (parts.length === 1 && parseInt(parts[0], 10) === queryDoorNum) {
                            score += 110;
                            matchReason = `Exact Door #${queryDoorNum}`;
                            break;
                        }
                    }
                }

                // 6. Hub Name Match
                const normHub = (beat.hub || '').toLowerCase().replace(/[\s,\-\.\/#]/g, '');
                if (normHub && normQ.length >= 4 && normHub.includes(normQ)) {
                    score += 70;
                    matchReason = `Hub: ${beat.hub}`;
                }

                if (score > 0) matches.push({ beat, score, matchReason });
            });

            matches.sort((a, b) => b.score - a.score);
            return matches;
        }

    const POSTAL_AI_CACHE = new Map();

    async function fetchLivePostalFromGeminiAI(locationQuery) {
        const cleanKey = locationQuery.toLowerCase().trim();
        
        // Instant in-memory cache return for lightning speed
        if (POSTAL_AI_CACHE.has(cleanKey)) {
            applyPostalDataToUI(POSTAL_AI_CACHE.get(cleanKey));
            return;
        }

        const apiKey = "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        const promptText = `Find Indian postal PIN code & India Post details for: "${locationQuery}".
Return JSON ONLY:
{"areaName":"Official Locality/Town Name","pincode":"6-digit PIN","deliveryPostOffice":"Delivery SO or HO name","postalDivision":"Division Name","district":"District Name","state":"State Name"}`;

        const payload = {
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: {
                responseMimeType: "application/json"
            }
        };

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            const textResponse = result?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!textResponse) return;

            const postalData = JSON.parse(textResponse);
            if (postalData && postalData.pincode) {
                POSTAL_AI_CACHE.set(cleanKey, postalData);
                applyPostalDataToUI(postalData);
            }
        } catch (e) {
            console.warn("Gemini Postal AI fetch error:", e);
        }
    }

    function applyPostalDataToUI(postalData) {
        const pinBadge = document.getElementById('livePinBadge');
        const delPo = document.getElementById('liveDeliveryPo');
        const postDiv = document.getElementById('livePostalDiv');
        const distEl = document.getElementById('liveDistrict');
        const stateEl = document.getElementById('liveStateCircle');
        const dispatchPin = document.getElementById('liveDispatchPin');
        const googleLink = document.getElementById('liveGoogleAiLink');
        const linkArea = document.getElementById('liveLinkArea');

        if (pinBadge) pinBadge.textContent = `PIN: ${postalData.pincode}`;
        if (delPo && postalData.deliveryPostOffice) delPo.textContent = postalData.deliveryPostOffice;
        if (postDiv && postalData.postalDivision) postDiv.textContent = postalData.postalDivision;
        if (distEl && postalData.district) distEl.textContent = postalData.district;
        if (stateEl && postalData.state) stateEl.textContent = postalData.state;
        if (dispatchPin) dispatchPin.textContent = postalData.pincode;
        if (linkArea && postalData.areaName) linkArea.textContent = postalData.areaName;
        if (googleLink) {
            googleLink.href = `https://www.google.com/search?q=${encodeURIComponent(postalData.areaName + ' ' + postalData.pincode + ' post office details')}`;
        }
    }

        async function handleCameraBtnClick() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                try {
                    await startMobileCamera();
                    return;
                } catch (e) {
                    console.warn("Live camera stream error, launching native hardware camera:", e);
                }
            }
            triggerNativeCamera();
        }

        function triggerNativeCamera() {
            const input = document.getElementById('cameraHardwareInput');
            if (input) {
                input.value = '';
                input.click();
            }
        }

        function openGalleryPicker() {
            const input = document.getElementById('galleryFileInput');

                input.value = '';
                input.click();
            }
        }

        async function startMobileCamera() {
            if (selectedCameraStream) stopMobileCamera();
            
            let stream = null;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: { ideal: currentFacingMode },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
            } catch (e1) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                } catch (e2) {
                    throw e2;
                }
            }

            if (!stream) throw new Error("No stream returned");

            selectedCameraStream = stream;
            isCameraActive = true;
            const video = document.getElementById('cameraVideo');
            if (video) { 
                video.srcObject = stream; 
                video.muted = true;
                video.setAttribute('playsinline', 'true');
                video.setAttribute('autoplay', 'true');
                video.classList.remove('hidden');
                await video.play();
            }

        // Fast image pre-processing to boost Tesseract recognition speed 3x
        function preprocessImageForFastOCR(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.naturalWidth || 640;
                    let h = img.naturalHeight || 480;
                    
                    // Downscale large camera images to max 960px for speed while preserving text clarity
                    const maxDim = 960;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        } else {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                    }
                    
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    
                    // High-contrast grayscale conversion for fast edge analysis
                    try {
                        const imgData = ctx.getImageData(0, 0, w, h);
                        const d = imgData.data;
                        for (let i = 0; i < d.length; i += 4) {
                            const gray = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
                            // Contrast stretch
                            const contrastGray = gray > 140 ? Math.min(255, gray * 1.15) : Math.max(0, gray * 0.85);
                            d[i] = contrastGray;
                            d[i + 1] = contrastGray;
                            d[i + 2] = contrastGray;
                        }
                        ctx.putImageData(imgData, 0, 0);
                    } catch (e) {
                        console.warn("Preprocessing notice:", e);
                    }
                    
                    resolve({ processedDataUrl: canvas.toDataURL('image/jpeg', 0.85), width: w, height: h, originalUrl: dataUrl });
                };
                img.src = dataUrl;
            });
        }

        async function processOCR(dataUrl) {
            stopMobileCamera();
            const loadingOverlay = document.getElementById('ocrLoadingOverlay');
            const loadingText = document.getElementById('ocrLoadingText');
            if (loadingOverlay) {
                loadingOverlay.classList.remove('hidden');
                loadingOverlay.classList.add('flex');
            }

            let extractedText = "";
            let wordsList = [];

            try {
                if (loadingText) loadingText.textContent = "Optimizing image for fast OCR...";
                const { processedDataUrl, width: imgW, height: imgH, originalUrl } = await preprocessImageForFastOCR(dataUrl);

                if (window.Tesseract && typeof window.Tesseract.recognize === 'function') {
                    if (loadingText) loadingText.textContent = "Scanning words at high speed...";
                    
                    const result = await Tesseract.recognize(processedDataUrl, 'eng', {
                        tessedit_pageseg_mode: '6', // PSM 6: Uniform text block (fastest)
                        logger: m => {
                            if (m.status === 'recognizing text' && loadingText) {
                                loadingText.textContent = `Fast OCR Scan: ${Math.round((m.progress || 0) * 100)}%`;
                            }
                        }
                    });

                    extractedText = (result.data.text || '').trim();
                    if (result.data.words && result.data.words.length > 0) {
                        wordsList = result.data.words
                            .filter(w => (w.text || '').trim().length >= 1 && (w.confidence || 0) > 20)
                            .map((w, idx) => {
                                const cleanTxt = w.text.replace(/[^a-zA-Z0-9\-\/]/g, '').trim();
                                const isNum = /^[0-9\-\/]+$/.test(cleanTxt);
                                const isPin = /^[1-9][0-9]{5}$/.test(cleanTxt);
                                const x0 = Math.max(0, w.bbox.x0);
                                const y0 = Math.max(0, w.bbox.y0);
                                const x1 = Math.min(imgW, w.bbox.x1);
                                const y1 = Math.min(imgH, w.bbox.y1);
                                return {
                                    id: `w_${idx}`,
                                    text: cleanTxt || w.text.trim(),
                                    isNumber: isNum,
                                    isPin: isPin,
                                    pctLeft: ((x0 / imgW) * 100).toFixed(2),
                                    pctTop: ((y0 / imgH) * 100).toFixed(2),
                                    pctWidth: (Math.max(3, ((x1 - x0) / imgW) * 100)).toFixed(2),
                                    pctHeight: (Math.max(2.8, ((y1 - y0) / imgH) * 100)).toFixed(2)
                                };
                            }).filter(w => w.text.length > 0);
                    }
                }
            } catch (err) {
                console.warn("Tesseract Fast OCR error:", err);
            }

            activeOcrPayload = {
                imageDataUrl: dataUrl,
                words: wordsList,
                rawText: extractedText
            };

            navigateTo('ocrResults', activeOcrPayload);
        }

        /* Helper to dynamically load html2canvas if CDN delayed or deferred */
        function loadHtml2CanvasLib() {
            return new Promise((resolve, reject) => {
                if (typeof window !== 'undefined' && window.html2canvas) {
                    return resolve(window.html2canvas);
                }
                const existing = document.querySelector('script[src*="html2canvas"]');
                if (existing) {
                    existing.addEventListener('load', () => resolve(window.html2canvas));
                    existing.addEventListener('error', () => reject(new Error('html2canvas script failed to load')));
                    return;
                }
                const s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                s.onload = () => resolve(window.html2canvas);
                s.onerror = () => {
                    const s2 = document.createElement('script');
                    s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
                    s2.onload = () => resolve(window.html2canvas);
                    s2.onerror = reject;
                    document.head.appendChild(s2);
                };
                document.head.appendChild(s);
            });
        }

        /* Helper to dynamically load jsPDF if CDN delayed or deferred */
        function loadJsPDFLib() {
            return new Promise((resolve, reject) => {
                if (typeof window !== 'undefined') {
                    if (window.jspdf && window.jspdf.jsPDF) return resolve(window.jspdf.jsPDF);
                    if (window.jsPDF) return resolve(window.jsPDF);
                }
                const existing = document.querySelector('script[src*="jspdf"]');
                if (existing) {
                    existing.addEventListener('load', () => resolve(window.jspdf ? window.jspdf.jsPDF : window.jsPDF));
                    existing.addEventListener('error', () => reject(new Error('jsPDF script failed to load')));
                    return;
                }
                const s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
                s.onload = () => resolve(window.jspdf ? window.jspdf.jsPDF : window.jsPDF);
                s.onerror = () => {
                    const s2 = document.createElement('script');
                    s2.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
                    s2.onload = () => resolve(window.jspdf ? window.jspdf.jsPDF : window.jsPDF);
                    s2.onerror = reject;
                    document.head.appendChild(s2);
                };
                document.head.appendChild(s);
            });
        }

        /* 2. Direct 1:1 Exact Print-Identical A4 PDF Downloader */
        async function downloadA4BeatSheet(beatNumber) {
            const beat = BEATS_DATABASE.find(b => b.beatNumber === beatNumber) || BEATS_DATABASE[0];
            const fileName = `Delhi_GPO_110006_Beat_${beat.beatNumber}_A4_Sheet.pdf`;

            // Update button icon to loading spinner
            const btnIcon = document.getElementById(`downloadBtnIcon_${beat.beatNumber}`);
            if (btnIcon) {
                btnIcon.textContent = 'progress_activity';
                btnIcon.classList.add('animate-spin', 'text-primary');
            }

            let iframe = null;
            try {
                // Render inside an isolated iframe with extra margin to prevent scrollbars
                iframe = document.createElement('iframe');
                iframe.style.position = 'fixed';
                iframe.style.top = '0';
                iframe.style.left = '0';
                iframe.style.width = '820px';
                iframe.style.height = '1150px';
                iframe.style.zIndex = '-9999';
                iframe.style.opacity = '0.01';
                iframe.style.pointerEvents = 'none';
                iframe.style.border = 'none';
                iframe.style.overflow = 'hidden';
                document.body.appendChild(iframe);

                const iframeDoc = iframe.contentWindow.document;
                iframeDoc.open();
                iframeDoc.write(generateA4SheetHTML(beat));
                iframeDoc.close();

                // Apply class to disable surrounding wrappers inside iframe
                if (iframeDoc.body) iframeDoc.body.classList.add('is-download-render');

                // Wait for the iframe's Leaflet map, fonts, and OpenStreetMap tiles to finish rendering
                await new Promise((resolve) => {
                    let checks = 0;
                    const interval = setInterval(() => {
                        checks++;
                        if (iframe.contentWindow && iframe.contentWindow.renderComplete) {
                            clearInterval(interval);
                            setTimeout(resolve, 300);
                        } else if (checks >= 30) { // max 3s fallback
                            clearInterval(interval);
                            resolve();
                        }
                    }, 100);
                });

                if (iframeDoc.fonts && iframeDoc.fonts.ready) {
                    await iframeDoc.fonts.ready;
                }

                const targetEl = iframeDoc.querySelector('.a4-document') || iframeDoc.body;

                let h2c = (typeof window !== 'undefined' && window.html2canvas) ? window.html2canvas : await loadHtml2CanvasLib();
                let jsPDFClass = null;
                if (typeof window !== 'undefined') {
                    if (window.jspdf && window.jspdf.jsPDF) jsPDFClass = window.jspdf.jsPDF;
                    else if (window.jsPDF) jsPDFClass = window.jsPDF;
                }
                if (!jsPDFClass) jsPDFClass = await loadJsPDFLib();

                if (h2c && jsPDFClass) {
                    const canvas = await h2c(targetEl, {
                        scale: 2, // 300 DPI High Resolution
                        useCORS: true,
                        allowTaint: true,
                        backgroundColor: '#ffffff',
                        logging: false,
                        width: 794,
                        height: 1123,
                        windowWidth: 820,
                        windowHeight: 1150,
                        scrollX: 0,
                        scrollY: 0
                    });

                    // Lossless PNG for crisp borders and line-art
                    const imgData = canvas.toDataURL('image/png');
                    const doc = new jsPDFClass({
                        orientation: 'portrait',
                        unit: 'mm',
                        format: 'a4'
                    });

                    // Place exact 1:1 image across the full A4 canvas (210mm x 297mm)
                    doc.addImage(imgData, 'PNG', 0, 0, 210, 297, undefined, 'FAST');
                    doc.save(fileName);
                } else {
                    openA4PrintSheet(beatNumber);
                }
            } catch (err) {
                console.error("A4 PDF Direct Export Fallback:", err);
                openA4PrintSheet(beatNumber);
            } finally {
                if (iframe && iframe.parentNode) {
                    iframe.parentNode.removeChild(iframe);
                }
                if (btnIcon) {
                    btnIcon.textContent = 'download';
                    btnIcon.classList.remove('animate-spin', 'text-primary');
                }
            }
        }

        function computePostageTariff() {
            const serviceType = document.getElementById('calcServiceType')?.value || 'speed_post';
            const distance = document.getElementById('calcDistance')?.value || 'local';
            const weightInput = document.getElementById('calcWeight');
            let weight = parseFloat(weightInput?.value) || 50;
            const ack = document.getElementById('calcAck')?.value || 'no';
            const insValue = parseFloat(document.getElementById('calcInsurance')?.value) || 0;

            const resAmountEl = document.getElementById('calcResultAmount');
            const breakdownEl = document.getElementById('calcBreakdown');
            const gstBadgeEl = document.getElementById('calcGstBadge');
            if (!resAmountEl || !breakdownEl) return;

            let baseAmount = 0;
            let gstRate = 0; // 0.18 for Speed Post
            let details = [];

            if (serviceType === 'speed_post') {
                gstRate = 0.18;
                // Speed Post Pricing Slabs based on Official DOP Matrix
                if (distance === 'local') {
                    if (weight <= 50) baseAmount = 15;
                    else if (weight <= 200) baseAmount = 25;
                    else if (weight <= 500) baseAmount = 30;
                    else {
                        const extra500g = Math.ceil((weight - 500) / 500);
                        baseAmount = 30 + extra500g * 10;
                    }
                } else if (distance === 'up_to_200') {
                    if (weight <= 50) baseAmount = 35;
                    else if (weight <= 200) baseAmount = 35;
                    else if (weight <= 500) baseAmount = 50;
                    else {
                        const extra500g = Math.ceil((weight - 500) / 500);
                        baseAmount = 50 + extra500g * 15;
                    }
                } else if (distance === '201_1000') {
                    if (weight <= 50) baseAmount = 35;
                    else if (weight <= 200) baseAmount = 40;
                    else if (weight <= 500) baseAmount = 60;
                    else {
                        const extra500g = Math.ceil((weight - 500) / 500);
                        baseAmount = 60 + extra500g * 30;
                    }
                } else if (distance === '1001_2000') {
                    if (weight <= 50) baseAmount = 35;
                    else if (weight <= 200) baseAmount = 60;
                    else if (weight <= 500) baseAmount = 80;
                    else {
                        const extra500g = Math.ceil((weight - 500) / 500);
                        baseAmount = 80 + extra500g * 40;
                    }
                } else { // above_2000
                    if (weight <= 50) baseAmount = 35;
                    else if (weight <= 200) baseAmount = 70;
                    else if (weight <= 500) baseAmount = 90;
                    else {
                        const extra500g = Math.ceil((weight - 500) / 500);
                        baseAmount = 90 + extra500g * 50;
                    }
                }
                details.push(`Speed Post Base: ₹${baseAmount.toFixed(2)}`);
            } else if (serviceType === 'registered_post') {
                // Registered Letter: Postage ₹5 for first 20g + ₹5 each addl 20g + Registration Fee ₹17
                const extra20g = Math.max(0, Math.ceil((weight - 20) / 20));
                const letterPostage = 5 + extra20g * 5;
                const regFee = 17;
                baseAmount = letterPostage + regFee;
                details.push(`Postage: ₹${letterPostage} + Reg Fee: ₹${regFee}`);
            } else if (serviceType === 'parcel') {
                // Registered Parcel: Up to 500g ₹19, each addl 500g ₹16 + Registration Fee ₹17
                const extra500g = Math.max(0, Math.ceil((weight - 500) / 500));
                const parcelPostage = 19 + extra500g * 16;
                const regFee = 17;
                baseAmount = parcelPostage + regFee;
                details.push(`Parcel: ₹${parcelPostage} + Reg Fee: ₹${regFee}`);
            } else if (serviceType === 'book_post') {
                // Book Post: ₹4 for first 50g + ₹3 each addl 50g
                const extra50g = Math.max(0, Math.ceil((weight - 50) / 50));
                baseAmount = 4 + extra50g * 3;
                details.push(`Book Post: ₹${baseAmount.toFixed(2)}`);
            } else { // ordinary_letter
                // Ordinary Letter: ₹5 for first 20g + ₹5 each addl 20g
                const extra20g = Math.max(0, Math.ceil((weight - 20) / 20));
                baseAmount = 5 + extra20g * 5;
                details.push(`Letter Postage: ₹${baseAmount.toFixed(2)}`);
            }

            // Optional Acknowledgement (AD)
            if (ack === 'yes') {
                baseAmount += 3;
                details.push(`Ack (AD): ₹3.00`);
            }

            // Optional Insurance
            if (insValue > 0) {
                let insFee = 4;
                if (insValue > 200) {
                    const addlUnits = Math.ceil((insValue - 200) / 1000);
                    insFee += addlUnits * 3;
                }
                baseAmount += insFee;
                details.push(`Insurance: ₹${insFee.toFixed(2)}`);
            }

            let totalPayable = baseAmount;
            if (gstRate > 0) {
                const cgst = baseAmount * 0.09;
                const sgst = baseAmount * 0.09;
                totalPayable = baseAmount + cgst + sgst;
                resAmountEl.textContent = `₹${totalPayable.toFixed(2)}`;
                if (gstBadgeEl) gstBadgeEl.textContent = `(Inclusive of 18% GST)`;
                breakdownEl.textContent = `${details.join(' • ')} • CGST (9%): ₹${cgst.toFixed(2)} • SGST (9%): ₹${sgst.toFixed(2)}`;
            } else {
                resAmountEl.textContent = `₹${totalPayable.toFixed(2)}`;
                if (gstBadgeEl) gstBadgeEl.textContent = `(Standard Exempt Postage)`;
                breakdownEl.textContent = details.join(' • ');
            }
        }
