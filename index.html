            display: block;
            width: 100%;
            height: auto;
            max-height: 480px;
            object-fit: contain;
        }
        .ocr-word-box {
            position: absolute;

        .ocr-word-tooltip {
            position: absolute;

        function tryFetchUserLocation() {
            if (navigator.geolocation) {

                            lng: pos.coords.longitude

                    },
                    { timeout: 8000, maximumAge: 60000 }
                );
            }
        }

        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371; // Radius of the Earth in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return (R * c).toFixed(2);
        }

        /* Calculate Total Beat Delivery Route Length & Coverage Metrics based on Area, Katras & Doors */
        function calculateBeatRouteMetrics(beat) {
            const bLat = beat.lat || 28.6500;
            const bLng = beat.lng || 77.2300;
            const gpoDist = parseFloat(calculateDistanceKm(DELHI_GPO_COORDS.lat, DELHI_GPO_COORDS.lng, bLat, bLng)) || 1.2;
            
            // Calculate internal alley & lane walking route based on registered localities & door segments
            const areaCount = Array.isArray(beat.areas) ? beat.areas.length : 10;
            const doorRangeCount = (beat.doorRanges ? beat.doorRanges.split(',').length : 5);
            
            // Typical Old Delhi dense postal beat walking circuit (1.6 km to 4.8 km internal grid)
            const internalRouteKm = Math.min(5.2, Math.max(1.8, (areaCount * 0.095 + doorRangeCount * 0.06 + 1.15))).toFixed(2);
            const totalDailyCoverageKm = (gpoDist * 2 + parseFloat(internalRouteKm)).toFixed(2);
            const estWalkingTimeHrs = (parseFloat(internalRouteKm) / 1.1 + 0.5).toFixed(1); // avg postal walking speed with drops
            
            let userDistStr = "";
            if (currentUserLocation) {
                const fromUser = calculateDistanceKm(currentUserLocation.lat, currentUserLocation.lng, bLat, bLng);
                userDistStr = ` • ${fromUser} km from your GPS`;
            }

            return {
                gpoDistKm: gpoDist,
                internalRouteKm: internalRouteKm,
                totalDailyCoverageKm: totalDailyCoverageKm,
                estWalkingTimeHrs: estWalkingTimeHrs,
                areaCount: areaCount,
                gpoSummary: `~${gpoDist} km from Delhi G.P.O.${userDistStr}`,
                totalRouteSummary: `~${internalRouteKm} km Internal Route (~${totalDailyCoverageKm} km Total Beat Tour)`
            };
        }

            const metrics = calculateBeatRouteMetrics(beat);

            const rawQuery = input ? input.value : '';

        function searchDatabase(query) {
            if (!query || typeof query !== 'string') return [];
            const q = query.toLowerCase().trim();
            if (q.length < 1) return [];

            const cleanQueryNum = parseInt(q.replace(/\D/g, ''), 10);
            let matches = [];

            BEATS_DATABASE.forEach(beat => {
                let score = 0;
                let matchReason = '';

                // Match exact beat number
                if (q === `beat ${beat.beatNumber}` || q === `${beat.beatNumber}` || q === `beat${beat.beatNumber}` || q === `#${beat.beatNumber}`) {
                    score += 100;
                    matchReason = `Exact Beat Number #${beat.beatNumber}`;
                }

                // Match primary area or hub
                if (beat.areaName && beat.areaName.toLowerCase().includes(q)) {
                    score += 85;
                    matchReason = `Matched Main Area: ${beat.areaName}`;
                }
                if (beat.hub && beat.hub.toLowerCase().includes(q)) {
                    score += 60;
                    matchReason = `Matched Hub: ${beat.hub}`;
                }

                // Match Katras, Streets and Sub-localities
                if (Array.isArray(beat.areas)) {
                    beat.areas.forEach(subArea => {
                        if (subArea && subArea.toLowerCase().includes(q)) {
                            score += 80;
                            matchReason = `Matched Locality: ${subArea}`;
                        }
                    });
                }

                // Match Postman staff name (supports first name, last name, or full string)
                if (beat.postmanName && beat.postmanName.toLowerCase().includes(q)) {
                    score += 98;
                    matchReason = `Matched Postal Staff: ${beat.postmanName}`;
                }
                if (beat.mobileNumber && beat.mobileNumber.includes(q)) {
                    score += 95;
                    matchReason = `Matched Staff Mobile: ${beat.mobileNumber}`;
                }

                // Match House / Shop Door Numbers and Numerical Ranges
                if (!isNaN(cleanQueryNum) && cleanQueryNum > 0 && beat.doorRanges) {
                    const ranges = beat.doorRanges.split(',');
                    ranges.forEach(rangeStr => {
                        const parts = rangeStr.trim().split('-');
                        if (parts.length === 2) {
                            const start = parseInt(parts[0], 10);
                            const end = parseInt(parts[1], 10);
                            if (!isNaN(start) && !isNaN(end)) {
                                const min = Math.min(start, end);
                                const max = Math.max(start, end);
                                if (cleanQueryNum >= min && cleanQueryNum <= max) {
                                    score += 95;
                                    matchReason = `Door No. ${cleanQueryNum} falls within range (${min}-${max})`;
                                }
                            }
                        } else if (parts.length === 1) {
                            if (parseInt(parts[0], 10) === cleanQueryNum) {
                                score += 95;
                                matchReason = `Exact Door No. ${cleanQueryNum}`;
                            }
                        }
                    });
                }

                if (score > 0) {
                    matches.push({ beat, score, matchReason });
                }
            });

            matches.sort((a, b) => b.score - a.score);
            return matches;
        }

        function initBeatMap(beat) {
            const container = document.getElementById('leafletMapContainer');
            if (!container) return;

            try {
                if (container._leaflet_id) {
                    container._leaflet_id = null;
                    container.innerHTML = "";
                }
                const distanceStr = getBeatDistanceInfo(beat);
                const map = L.map('leafletMapContainer').setView([beat.lat, beat.lng], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                // Add Delivery Zone Circle
                L.circle([beat.lat, beat.lng], {
                    color: '#af101a',
                    fillColor: '#fdc003',
                    fillOpacity: 0.2,
                    radius: 350
                }).addTo(map);

                const marker = L.marker([beat.lat, beat.lng]).addTo(map);
                marker.bindPopup(`
                    <div style="font-family: 'Inter', sans-serif; font-size: 12px; line-height: 1.4;">
                        <b style="color: #af101a; font-size: 13px;">Beat #${beat.beatNumber}: ${beat.areaName}</b><br>
                        <span style="color: #785900; font-weight: bold;">📏 Distance: ${distanceStr}</span><br>
                        <span>👤 Postman: <b>${beat.postmanName}</b></span>
                    </div>
                `).openPopup();
            } catch (err) {
                console.warn("Leaflet Map init notice:", err);
            }
        }

        async function startMobileCamera() {
            try {
                const constraints = { video: { facingMode: currentFacingMode } };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                selectedCameraStream = stream;
                isCameraActive = true;

                const video = document.getElementById('cameraVideo');
                const placeholder = document.getElementById('cameraPlaceholder');
                const overlay = document.getElementById('scanFrameOverlay');
                const captureBtn = document.getElementById('captureBtn');
                const startBtn = document.getElementById('startCamBtn');

                if (video) {
                    video.srcObject = stream;
                    video.classList.remove('hidden');
                }
                if (placeholder) placeholder.classList.add('hidden');
                if (overlay) {
                    overlay.classList.remove('hidden');
                    overlay.classList.add('flex');
                }
                if (captureBtn) captureBtn.classList.remove('hidden');
                if (startBtn) startBtn.classList.add('hidden');
            } catch (err) {
                const placeholder = document.getElementById('cameraPlaceholder');
                if (placeholder) {
                    placeholder.innerHTML = `
                        <div class="p-4 bg-tertiary-container/30 text-on-tertiary-container border border-tertiary rounded-xl text-center">
                            <span class="material-symbols-outlined text-2xl mb-1">no_photography</span>
                            <p class="text-xs font-bold">Camera Access Unavailable</p>
                            <p class="text-[11px] opacity-90 mt-1">Please use "Upload Letter Photo" above to process an envelope image.</p>
                        </div>
                    `;
                }
            }
        }

        function switchCameraFacing() {
            stopMobileCamera();
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            startMobileCamera();
        }

        function stopMobileCamera() {
            if (selectedCameraStream) {
                selectedCameraStream.getTracks().forEach(track => track.stop());
                selectedCameraStream = null;
            }
            isCameraActive = false;
        }

        function captureAndOCR() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.getElementById('cropCanvas');

            if (!video || !canvas) return;

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageDataUrl = canvas.toDataURL('image/png');
            processOCR(imageDataUrl);
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                processOCR(event.target.result);
            };
            reader.readAsDataURL(file);
        }

        async function processOCR(imageDataUrl) {
            stopMobileCamera();

            const appContainer = document.getElementById('appContent');
            appContainer.innerHTML = `
                <div class="max-w-md mx-auto my-12 bg-surface-container-lowest rounded-2xl border border-outline-variant p-8 shadow-xl text-center flex flex-col items-center gap-md">
                    <div class="w-14 h-14 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
                    <h3 class="text-base font-bold text-on-surface">Scanning & Detecting Text Regions...</h3>
                    <p class="text-xs text-on-surface-variant">Tesseract OCR is isolating bounding boxes and matching against Delhi G.P.O. database...</p>
                </div>
            `;

            try {
                let textResult = "";
                let recognizedWords = [];
                let naturalWidth = 640;
                let naturalHeight = 480;

                const imgObj = new Image();
                imgObj.src = imageDataUrl;
                await new Promise((resolve) => {
                    imgObj.onload = () => {
                        naturalWidth = imgObj.naturalWidth || 640;
                        naturalHeight = imgObj.naturalHeight || 480;
                        resolve();
                    };
                    imgObj.onerror = () => resolve();
                });

                if (window.Tesseract) {
                    const res = await Tesseract.recognize(imageDataUrl, 'eng');
                    textResult = res.data.text || "";
                    if (res.data && Array.isArray(res.data.words)) {
                        recognizedWords = res.data.words
                            .filter(w => w.text && w.text.trim().length > 0 && w.bbox)
                            .map(w => ({
                                text: w.text.trim().replace(/[^\w\s\/-]/gi, ''),
                                raw: w.text.trim(),
                                bbox: w.bbox
                            })).filter(w => w.text.length > 0);
                    }
                } else {
                    textResult = "3902 Urdu Bazar Matia Mahal Delhi 110006";
                    recognizedWords = [
                        { text: "3902", raw: "3902", bbox: { x0: 40, y0: 60, x1: 140, y1: 110 } },
                        { text: "Urdu", raw: "Urdu", bbox: { x0: 150, y0: 60, x1: 250, y1: 110 } },
                        { text: "Bazar", raw: "Bazar", bbox: { x0: 260, y0: 60, x1: 370, y1: 110 } },
                        { text: "Matia", raw: "Matia", bbox: { x0: 40, y0: 130, x1: 150, y1: 180 } },
                        { text: "Mahal", raw: "Mahal", bbox: { x0: 160, y0: 130, x1: 280, y1: 180 } },
                        { text: "110006", raw: "110006", bbox: { x0: 40, y0: 200, x1: 180, y1: 250 } }
                    ];
                }

                const doorMatch = textResult.match(/\b\d{1,4}(\/\d{1,3})?\b/);
                const pinMatch = textResult.match(/\b1100\d{2}\b/);
                const fields = {
                    doorNumber: doorMatch ? doorMatch[0] : '3902',
                    pinCode: pinMatch ? pinMatch[0] : '110006',
                    area: textResult.toLowerCase().includes('chandni') ? 'Chandni Chowk' : (textResult.toLowerCase().includes('ballimaran') ? 'Ballimaran' : 'Urdu Bazar'),
                    rawText: textResult
                };

                const searchTarget = fields.doorNumber || fields.area || '3902';
                saveSearchTo24hStorage(searchTarget);

                if (supabaseClient) {
                    try {
                        await supabaseClient.from('scan_history').insert({
                            scanned_text: textResult,
                            extracted_data: fields
                        });
                    } catch (e) { console.warn("Supabase temp scan log:", e); }
                }

                const results = searchDatabase(searchTarget);

                navigateTo('ocrResults', {
                    imageDataUrl,
                    naturalWidth,
                    naturalHeight,
                    words: recognizedWords,
                    rawText: textResult,
                    fields,
                    results,
                    selectedText: searchTarget
                });
            } catch (err) {
                console.error("OCR Error:", err);
                const results = searchDatabase("3902");
                navigateTo('ocrResults', {
                    imageDataUrl,
                    naturalWidth: 640,
                    naturalHeight: 480,
                    words: [
                        { text: "3902", raw: "3902", bbox: { x0: 40, y0: 60, x1: 140, y1: 110 } },
                        { text: "Urdu", raw: "Urdu", bbox: { x0: 150, y0: 60, x1: 250, y1: 110 } },
                        { text: "Bazar", raw: "Bazar", bbox: { x0: 260, y0: 60, x1: 370, y1: 110 } },
                        { text: "110006", raw: "110006", bbox: { x0: 40, y0: 130, x1: 180, y1: 180 } }
                    ],
                    rawText: "3902 Urdu Bazar Matia Mahal Delhi 110006",
                    fields: { doorNumber: "3902", area: "Urdu Bazar", pinCode: "110006" },
                    results,
                    selectedText: "3902"
                });
            }
        }

        function renderLensBoundingBoxes(naturalW, naturalH) {
            const overlay = document.getElementById('lensBoundingBoxOverlay');
            const img = document.getElementById('lensDisplayImage');
            if (!overlay || !img) return;

            const dispW = img.clientWidth || img.offsetWidth;
            const dispH = img.clientHeight || img.offsetHeight;

            if (dispW === 0 || dispH === 0) {
                setTimeout(() => renderLensBoundingBoxes(naturalW, naturalH), 100);
                return;
            }

            const scaleX = dispW / (naturalW || 640);
            const scaleY = dispH / (naturalH || 480);
            const words = (activeOcrPayload && activeOcrPayload.words) ? activeOcrPayload.words : [];

            overlay.innerHTML = words.map((w, idx) => {
                if (!w.bbox) return '';
                const left = Math.max(0, w.bbox.x0 * scaleX);
                const top = Math.max(0, w.bbox.y0 * scaleY);
                const width = Math.max(16, (w.bbox.x1 - w.bbox.x0) * scaleX);
                const height = Math.max(14, (w.bbox.y1 - w.bbox.y0) * scaleY);

                return `
                    <div class="ocr-word-box" 
                         id="ocrBox_${idx}"
                         style="left: ${left}px; top: ${top}px; width: ${width}px; height: ${height}px;"
                         onclick="selectOcrTextAndSearch('${w.text.replace(/'/g, "\\'")}', ${idx})"
                         title="Tap to search: ${w.text}">
                        <div class="ocr-word-tooltip">🔍 ${w.text}</div>
                    </div>
                `;
            }).join('');
        }

        function toggleVoiceSearch(inputId = 'homeSearchInput', btnId = 'homeMicBtn') {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showModalNotice("Voice Search Unavailable", "Your current browser does not support the Web Speech API. Please use text search.");
                return;
            }

            const inputEl = document.getElementById(inputId);
            const btnEl = document.getElementById(btnId);

            if (isVoiceListening) {
                if (activeRecognition) {
                    try { activeRecognition.stop(); } catch(e) {}
                }
                resetVoiceUI(btnEl, inputEl);
                return;
            }

            try {
                const recognition = new SpeechRecognition();
                activeRecognition = recognition;
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-IN'; 

                recognition.onstart = function () {
                    isVoiceListening = true;
                    if (btnEl) btnEl.classList.add('mic-recording');
                    if (inputEl) {
                        inputEl.placeholder = "🎙️ Listening... Please speak now (e.g. 3902, Urdu Bazar, Sitaram)...";
                        inputEl.classList.add('ring-2', 'ring-primary');
                    }
                    showVoiceToast("Listening... Speak Door No., Locality, or Beat.");
                };

                recognition.onresult = function (event) {
                    const speechText = event.results[0][0].transcript;
                    if (inputEl) inputEl.value = speechText;
                    hideVoiceToast();
                    resetVoiceUI(btnEl, inputEl);
                    performSearch(inputId);
                };

                recognition.onerror = function (event) {
                    console.warn("Speech recognition error:", event.error);
                    hideVoiceToast();
                    resetVoiceUI(btnEl, inputEl);
                    if (event.error === 'not-allowed') {
                        showModalNotice("Microphone Access Required", "Please allow microphone permissions in your browser to use voice search.");
                    }
                };

                recognition.onend = function () {
                    hideVoiceToast();
                    resetVoiceUI(btnEl, inputEl);
                };

                recognition.start();
            } catch (err) {
                console.warn("Voice search init error:", err);
                resetVoiceUI(btnEl, inputEl);
            }
        }

        const STORAGE_KEY_SEARCHES = 'delhigpo_searches_24h';

        function saveSearchTo24hStorage(queryTerm) {
            if (!queryTerm || typeof queryTerm !== 'string') return;
            const term = queryTerm.trim();
            if (term.length < 1) return;

            try {
                let list = get24hRecentSearchesRaw();
                const now = Date.now();
                list = list.filter(item => item.query.toLowerCase() !== term.toLowerCase() && (now - item.timestamp) < 24 * 60 * 60 * 1000);
                list.unshift({ query: term, timestamp: now });
                if (list.length > 8) list = list.slice(0, 8);
                localStorage.setItem(STORAGE_KEY_SEARCHES, JSON.stringify(list));
            } catch (e) { console.warn("Storage save notice:", e); }
        }

        function get24hRecentSearchesRaw() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY_SEARCHES);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                const now = Date.now();
                return parsed.filter(item => (now - item.timestamp) < 24 * 60 * 60 * 1000);
            } catch (e) { return []; }
        }

        function get24hRecentSearches() {
            return get24hRecentSearchesRaw().map(item => item.query);
        }

        async function purgeAll24hExpiredData() {
            try {
                const validList = get24hRecentSearchesRaw();
                localStorage.setItem(STORAGE_KEY_SEARCHES, JSON.stringify(validList));

                if (supabaseClient) {
                    try {
                        await supabaseClient.rpc('purge_expired_logs_24h');
                    } catch (err) {
                        console.warn("Supabase 24h cron rpc notice:", err);
                    }
                }
            } catch (e) {}
        }

        function renderPostalLookupPage(initialQuery) {
            let matchedBeat = BEATS_DATABASE[0];
            let doorDisplay = "";
            let localityDisplay = "";

            if (typeof initialQuery === 'number') {
                matchedBeat = BEATS_DATABASE.find(b => b.beatNumber === initialQuery) || BEATS_DATABASE[0];
            } else if (typeof initialQuery === 'object' && initialQuery !== null && initialQuery.beat) {
                matchedBeat = initialQuery.beat;
                const firstDoor = matchedBeat.doorRanges ? matchedBeat.doorRanges.split(',')[0].trim().split('-')[0] : '1';
                doorDisplay = initialQuery.door || `Door No. ${firstDoor}`;
                localityDisplay = `${matchedBeat.areaName || 'Chandni Chowk'}, Delhi 110006`;
            } else if (typeof initialQuery === 'string' && initialQuery.trim().length >= 1) {
                const searchRes = searchDatabase(initialQuery);
                if (searchRes.length > 0) {
                    matchedBeat = searchRes[0].beat;
                    doorDisplay = `Query: ${initialQuery}`;
                    localityDisplay = `${matchedBeat.areaName || 'Chandni Chowk'}, Delhi 110006`;
                }
            }

            if (!doorDisplay) {
                const firstDoor = matchedBeat.doorRanges ? matchedBeat.doorRanges.split(',')[0].trim().split('-')[0] : '1';
                doorDisplay = `Door No. ${firstDoor}`;

        function initLookupMap(payload) {
            const container = document.getElementById('lookupLeafletMap');
            if (!container) return;

            let beat = BEATS_DATABASE[0];
            if (typeof payload === 'number') {
                beat = BEATS_DATABASE.find(b => b.beatNumber === payload) || BEATS_DATABASE[0];
            } else if (typeof payload === 'object' && payload !== null && payload.beat) {
                beat = payload.beat;
            } else if (typeof payload === 'string' && payload.trim().length >= 1) {
                const searchRes = searchDatabase(payload);
                if (searchRes.length > 0) beat = searchRes[0].beat;
            }

            try {
                if (container._leaflet_id) {
                    container._leaflet_id = null;
                    container.innerHTML = "";
                }

                const metrics = calculateBeatRouteMetrics(beat);
                const neighbours = getNeighbourBeats(beat, 3);
                
                const map = L.map('lookupLeafletMap').setView([beat.lat, beat.lng], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                // Distinct thematic color palette for neighboring beats
                const neighbourColors = ['#d97706', '#0284c7', '#7c3aed'];

                // 1. Render Neighbour Beat Delivery Zones & Meeting Touchpoints
                neighbours.forEach((nb, index) => {
                    const nBeat = nb.beat;
                    const color = neighbourColors[index % neighbourColors.length];

                    // Boundary coverage circle for neighbor
                    const nCircle = L.circle([nBeat.lat, nBeat.lng], {
                        color: color,
                        fillColor: color,
                        fillOpacity: 0.16,
                        weight: 2,
                        dashArray: '5, 5',
                        radius: 300
                    }).addTo(map);

                    // Touchpoint / Inter-Beat Handover Line between Primary Beat & Neighbour
                    const junctionLine = L.polyline([
                        [beat.lat, beat.lng],
                        [nBeat.lat, nBeat.lng]
                    ], {
                        color: color,
                        weight: 2,
                        opacity: 0.65,
                        dashArray: '4, 6'
                    }).addTo(map);

                    junctionLine.bindTooltip(`Border Junction • ~${nb.distanceKm} km to Beat #${nBeat.beatNumber}`, {
                        sticky: true,
                        className: 'text-xs font-bold'
                    });

                    // Custom Circular Marker for Neighbouring Carrier
                    const nMarkerIcon = L.divIcon({
                        className: 'custom-neighbour-icon',
                        html: `
                            <div style="background-color: ${color}; color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; box-shadow: 0 2px 6px rgba(0,0,0,0.35); border: 2px solid #ffffff;">
                                #${nBeat.beatNumber}
                            </div>
                        `,
                        iconSize: [30, 30],
                        iconAnchor: [15, 15]
                    });

                    const nMarker = L.marker([nBeat.lat, nBeat.lng], { icon: nMarkerIcon }).addTo(map);
                    
                    const popupHtml = `
                        <div style="font-family: 'Inter', sans-serif; font-size: 12px; min-width: 200px; padding: 2px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                                <span style="background-color: ${color}; color: white; padding: 2px 6px; border-radius: 4px; font-weight: 800; font-size: 10px;">NEIGHBOUR BEAT #${nBeat.beatNumber}</span>
                                <span style="color: #666; font-size: 10px; font-weight: bold;">~${nb.distanceKm} km away</span>
                            </div>
                            <b style="color: #111; font-size: 13px; display: block; margin-bottom: 2px;">${nBeat.areaName}</b>
                            <div style="color: #444; margin-bottom: 6px; font-size: 11px;">
                                👤 Postman: <b>${nBeat.postmanName}</b><br>
                                📞 Mobile: <b>${nBeat.mobileNumber}</b>
                            </div>
                            <div style="display: flex; gap: 4px; margin-top: 6px;">
                                <a href="tel:${nBeat.mobileNumber}" style="flex: 1; text-align: center; background: #047857; color: white; text-decoration: none; padding: 4px 6px; border-radius: 6px; font-weight: bold; font-size: 10px;">📞 Call</a>
                                <a href="https://wa.me/91${nBeat.mobileNumber.replace(/\D/g, '')}" target="_blank" style="flex: 1; text-align: center; background: #25D366; color: white; text-decoration: none; padding: 4px 6px; border-radius: 6px; font-weight: bold; font-size: 10px;">💬 WhatsApp</a>
                            </div>
                            <button onclick="switchLookupBeat(${nBeat.beatNumber})" style="width: 100%; margin-top: 4px; background: #f3f4f6; color: #111; border: 1px solid #d1d5db; padding: 4px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer;">
                                Switch to Beat #${nBeat.beatNumber}
                            </button>
                        </div>
                    `;

                    nMarker.bindPopup(popupHtml);
                    nCircle.bindPopup(popupHtml);
                });

                // 2. Render Active Primary Beat Zone (Prominent Red)
                const activeCircle = L.circle([beat.lat, beat.lng], {
                    color: '#af101a',
                    fillColor: '#af101a',
                    fillOpacity: 0.25,
                    weight: 3,
                    radius: 350
                }).addTo(map);

                const activeMarkerIcon = L.divIcon({
                    className: 'custom-active-icon',
                    html: `
                        <div style="background-color: #af101a; color: #ffffff; width: 38px; height: 38px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 12px; box-shadow: 0 4px 12px rgba(175,16,26,0.6); border: 3px solid #ffffff; animation: pulse 2s infinite;">
                            <span>#${beat.beatNumber}</span>
                        </div>
                    `,
                    iconSize: [38, 38],
                    iconAnchor: [19, 19]
                });

                const activeMarker = L.marker([beat.lat, beat.lng], { icon: activeMarkerIcon }).addTo(map);
                activeMarker.bindPopup(`
                    <div style="font-family: 'Inter', sans-serif; font-size: 12px; min-width: 210px;">
                        <div style="background: #af101a; color: white; padding: 2px 8px; border-radius: 4px; font-weight: 800; font-size: 11px; display: inline-block; margin-bottom: 4px;">
                            ACTIVE BEAT #${beat.beatNumber}
                        </div>
                        <h4 style="color: #111; font-size: 13px; font-weight: 800; margin: 2px 0;">${beat.areaName}</h4>
                        <div style="font-size: 11px; color: #555; margin: 4px 0;">
                            <span>👤 Carrier: <b>${beat.postmanName} (${beat.type})</b></span><br>
                            <span>📏 GPO Distance: <b>~${metrics.gpoDistKm} km</b></span><br>
                            <span>🚶 Delivery Route: <b>~${metrics.internalRouteKm} km</b></span>
                        </div>
                        <div style="background: #fdf2f2; border-left: 3px solid #af101a; padding: 4px 6px; font-size: 10px; color: #af101a; font-weight: 700; margin-top: 4px;">
                            ${neighbours.length} Adjacent Neighbour Beats Linked
                        </div>
                    </div>
                `).openPopup();

                // 3. Fit bounds to nicely frame active beat and its neighbours
                const allPoints = [[beat.lat, beat.lng], ...neighbours.map(n => [n.beat.lat, n.beat.lng])];
                map.fitBounds(allPoints, { padding: [35, 35] });

            } catch (err) {
                console.warn("Lookup Leaflet Map init:", err);
            }
        }

        async function syncAllBeatsToSupabase() {
            if (!supabaseClient) {
                showModalNotice("Supabase Not Configured", "Please verify your Supabase database connection.");
                return;
            }
            try {
                showModalNotice("Syncing Database...", "Uploading all 50 verified beats to Supabase PostgreSQL table 'beats'...");
                
                const payload = BEATS_DATABASE.map(b => ({
                    beat_number: b.beatNumber,
                    hub: b.hub,
                    area_name: b.areaName,
                    postman_name: b.postmanName,
                    mobile_number: b.mobileNumber,
                    type: b.type,
                    door_ranges: b.doorRanges,
                    areas: b.areas,
                    lat: b.lat,
                    lng: b.lng
                }));

                const { error } = await supabaseClient.from('beats').upsert(payload, { onConflict: 'beat_number' });
                if (error) throw error;

                closeCustomModal();
                showModalNotice("Sync Successful", `Successfully uploaded/updated all ${BEATS_DATABASE.length} Beats in Supabase table 'beats'.`);
            } catch (err) {
                closeCustomModal();
                showModalNotice("Sync Result", `Data push finished. Note: ${err.message || 'Complete'}`);
            }
        }

        function exportBeatsToCSV() {
            const headers = ["Beat Number", "Hub", "Area Name", "Postman Name", "Mobile Number", "Staff Type", "Door Ranges", "Localities"];
            const rows = BEATS_DATABASE.map(b => [
                b.beatNumber,
                `"${b.hub}"`,
                `"${b.areaName}"`,
                `"${b.postmanName}"`,
                `"${b.mobileNumber}"`,
                `"${b.type}"`,
                `"${b.doorRanges.replace(/"/g, '""')}"`,
                `"${b.areas.join('; ').replace(/"/g, '""')}"`
            ]);

            const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Delhi_GPO_110006_Beat_Map_Directory.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function handleSaveBeatEdit(e, beatNumber) {

            const hub = document.getElementById('editHub').value.trim() || 'DELHI GPO';

            const postmanName = document.getElementById('editPostmanName').value.trim() || 'Unassigned';

            const doorRanges = document.getElementById('editDoorRanges').value.trim() || 'None';

            if (areas.length < 1) areas.push(areaName);

            BEATS_DATABASE[idx] = { ...BEATS_DATABASE[idx], hub, areaName, postmanName, mobileNumber, doorRanges, areas };

            if (supabaseClient) {

                        hub, area_name: areaName, postman_name: postmanName, mobile_number: mobileNumber, door_ranges: doorRanges, areas
                    }).eq('beat_number', beatNumber);

            closeCustomModal();
            navigateTo('admin');

                    <div>
                        <h3 class="text-base font-bold text-on-surface">${title}</h3>
                        <p class="text-xs text-on-surface-variant mt-1">${msg}</p>
                    </div>
                    <button onclick="closeCustomModal()" class="px-5 py-2 bg-primary text-on-primary rounded-full text-xs font-bold mx-auto">OK</button>
                </div>
            `;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCustomModal() {
            const modal = document.getElementById('modalContainer');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
            modal.innerHTML = '';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            tryFetchUserLocation();
            await purgeAll24hExpiredData();
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient.from('beats').select('*').order('beat_number');
                    if (!error && data && data.length > 0) {
                        BEATS_DATABASE = data.map(row => ({
                            beatNumber: row.beat_number,
                            hub: row.hub,
                            areaName: row.area_name,
                            postmanName: row.postman_name,
                            mobileNumber: row.mobile_number,
                            type: row.type || 'Postman',
                            doorRanges: row.door_ranges,
                            areas: Array.isArray(row.areas) ? row.areas : (typeof row.areas === 'string' ? JSON.parse(row.areas || '[]') : []),
                            lat: row.lat || 28.6500,
                            lng: row.lng || 77.2300
                        }));
                    }
                } catch (err) {
                    console.warn("Supabase fetch notice:", err);
                }
            }
            navigateTo('home');
        });
    </script>
</body>
</html>
